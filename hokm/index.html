<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d0e">
<title>میز حکم</title>
<meta name="description" content="بازی حکم چهارنفره در برابر سه ربات، با میز سه‌بعدی و انیمیشن کامل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Vazirmatn:wght@200;300;400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<style>
/* Layout: dark room, a walnut-railed teal table lit from above fills the space right of the tricks panel and below the score bar;
   opponents' fans sit on the rail, the trick lands in the pool of light, your hand arcs over the near rail. Single deliberate dark look. */
:root{
  --deep:#050d0e; --mint:#46e3a9; --mint-soft:#b9ffe6; --amber:#ffc663; --coral:#ff7d6b;
  --text:#ecf6f2; --muted:#89a9a2; --line:rgba(185,255,230,.10);
  --us:var(--mint); --them:var(--coral);
  --ui:"Vazirmatn",system-ui,Tahoma,sans-serif;
  --cw:84px; --tw:70px; --bw:34px; --tr:220px;
  --spring:cubic-bezier(.2,.9,.3,1.3); --spring-soft:cubic-bezier(.2,.85,.25,1.08);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--deep);color:var(--text);font-family:var(--ui);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
b,strong,h2{font-weight:700}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible,.card:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

/* ---------- room & table ---------- */
#stage{position:relative;height:100%;overflow:hidden;isolation:isolate;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0;
  background:radial-gradient(ellipse 80% 70% at 56% 58%,#10302f 0%,#081a1b 52%,#030809 100%)}
.layer{position:absolute;inset:0;pointer-events:none}
.tableTop{position:absolute;left:0;top:0;width:10px;height:10px;z-index:0;transform-origin:50% 100%;border-radius:var(--tr);padding:15px;
  background:linear-gradient(180deg,#3d2b22 0%,#22160f 40%,#120b08 100%);
  box-shadow:inset 0 1px 0 rgba(255,230,200,.2),inset 0 -3px 8px rgba(0,0,0,.7),0 40px 90px rgba(0,0,0,.75),0 0 140px rgba(70,227,169,.06)}
.tableTop::after{content:"";position:absolute;inset:6px;border-radius:calc(var(--tr) - 6px);border:1px dashed rgba(255,220,180,.13);pointer-events:none}
.felt{position:relative;width:100%;height:100%;border-radius:calc(var(--tr) - 15px);overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse 70% 62% at 50% 40%,#34857d 0%,#20615b 32%,#15433f 64%,#0c2c2b 100%);
  box-shadow:0 0 0 1px rgba(255,214,150,.35),inset 0 0 70px rgba(0,0,0,.55),inset 0 14px 34px rgba(0,0,0,.4)}
.felt::before{content:"";position:absolute;inset:0;background-image:var(--felt,var(--noise));background-size:220px 220px;opacity:.62;mix-blend-mode:overlay}
.felt::after{content:"";position:absolute;inset:18px;border-radius:calc(var(--tr) - 33px);border:1px solid rgba(200,255,235,.07)}
.beam{position:absolute;inset:-20% -10% 0;background:radial-gradient(ellipse 42% 60% at 50% 0%,rgba(205,255,240,.22) 0%,rgba(160,240,220,.07) 45%,transparent 72%);
  mix-blend-mode:screen;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}
.shamseh{position:absolute;left:50%;top:48%;width:min(78%,560px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.035;pointer-events:none}
#dust{z-index:1;width:100%;height:100%}
.vignette{z-index:2;background:radial-gradient(ellipse 90% 85% at 55% 50%,transparent 60%,rgba(0,0,0,.5) 100%)}
.turnLight{position:absolute;left:0;top:0;width:min(56vmin,440px);aspect-ratio:1;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(110,255,200,.18) 0%,rgba(110,255,200,.06) 36%,transparent 68%);mix-blend-mode:screen;
  transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .5s;opacity:0}

/* ---------- glass ---------- */
.glass{background:linear-gradient(160deg,rgba(22,58,60,.7),rgba(7,24,26,.64));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.lbl{display:block;font-size:.68rem;font-weight:300;color:var(--muted);line-height:1.5}
.us{--c:var(--us)} .them{--c:var(--them)}

/* ---------- shared animated border ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinAng{to{--ang:360deg}}
.edge::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 55%,var(--ec,var(--mint)) 75%,transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 3s linear infinite;opacity:0;transition:opacity .4s}

/* ---------- top bar ---------- */
.topbar{position:absolute;z-index:8;top:max(12px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:9px 10px 9px 12px;min-height:72px;animation:dropIn 1s var(--spring-soft) backwards;overflow:hidden}
@keyframes dropIn{from{transform:translateY(-130%);opacity:0}}
.topbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(185,255,230,.07) 48%,transparent 60%);background-size:260% 100%;animation:streak 8s ease-in-out infinite}
@keyframes streak{0%,55%{background-position:160% 0}100%{background-position:-110% 0}}
.tb-start{display:flex;align-items:center;gap:10px;min-width:0}
.chipB{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);min-width:0}
.chipB b{display:block;font-size:1rem;font-weight:700;line-height:1.35;white-space:nowrap}
.ring{position:relative;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.22)}
.ring .q{font-weight:500;color:var(--muted);font-size:1.15rem;animation:qpulse 1.8s ease-in-out infinite}
@keyframes qpulse{50%{opacity:.3}}
.ring.set{background:linear-gradient(160deg,#fff,#e0e8e4);border:0;box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 26px rgba(255,198,99,.4)}
.ring.set::before{content:"";position:absolute;inset:-3.5px;border-radius:16px;padding:2.5px;pointer-events:none;background:conic-gradient(from var(--ang),#ffc663,#fff3c9 25%,#ffc663 50%,#9c6a18 75%,#ffc663);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 4s linear infinite}
.ring.set::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);background-size:320% 100%;background-position:130% 0;animation:tileShine 5s ease-in-out infinite;opacity:.7}
@keyframes tileShine{0%,72%{background-position:130% 0}100%{background-position:-70% 0}}
.ring svg{width:58%;height:58%}
.crownC{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 34% 28%,#ffe7ad,#c98a24);
  box-shadow:0 0 16px rgba(255,198,99,.4),inset 0 -2px 5px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.5);animation:crownGlow 2.8s ease-in-out infinite}
.crownC svg{width:21px;height:21px}
@keyframes crownGlow{50%{box-shadow:0 0 28px rgba(255,198,99,.75),inset 0 -2px 5px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.5)}}
.vs{position:relative;display:grid;grid-template-columns:auto auto minmax(120px,230px) auto auto;align-items:center;gap:14px;padding:8px 18px;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,125,107,.14),rgba(255,255,255,.02) 32%,rgba(255,255,255,.02) 68%,rgba(70,227,169,.15));border:1px solid rgba(255,255,255,.07);--ec:rgba(185,255,230,.55)}
.vs.edge::before{opacity:.55;animation-duration:6s}
.vs .tn{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1}
.vs .tn b{font-size:.92rem}
.avs{display:flex;direction:ltr}
.avs i{width:21px;height:21px;border-radius:50%;margin-left:-7px;border:2px solid #0c2426;display:grid;place-items:center;font-style:normal;font-size:.6rem;font-weight:700;color:#fff;
  background:radial-gradient(circle at 32% 28%,var(--g1),var(--g2))}
.avs i:first-child{margin-left:0}
.big{font-size:2.3rem;font-weight:700;line-height:1.05;color:var(--c);text-shadow:0 0 24px color-mix(in srgb,var(--c) 50%,transparent);min-width:1.2ch;text-align:center;font-variant-numeric:tabular-nums}
.tug{display:flex;flex-direction:column;gap:6px}
.tug .bar{display:grid;grid-template-columns:repeat(7,1fr) 2px repeat(7,1fr);gap:3px;direction:ltr;height:9px}
.tug .bar i{border-radius:3px;background:rgba(255,255,255,.07);transition:background .5s,box-shadow .5s}
.tug .bar i.mid{background:rgba(255,255,255,.4);border-radius:1px}
.tug .bar i.on.us{background:var(--us);box-shadow:0 0 10px rgba(70,227,169,.6)}
.tug .bar i.on.them{background:var(--them);box-shadow:0 0 10px rgba(255,125,107,.6)}
.tug .bar i.pop{animation:segPop 1s var(--spring)}
@keyframes segPop{25%{transform:scaleY(2.6);filter:brightness(1.8)}}
.tug small{text-align:center;font-size:.62rem;color:var(--muted)}
.vs.flash-us{animation:flashUs 1.1s ease-out}.vs.flash-them{animation:flashThem 1.1s ease-out}
@keyframes flashUs{0%{box-shadow:0 0 0 1px var(--us),0 0 40px rgba(70,227,169,.6)}}
@keyframes flashThem{0%{box-shadow:0 0 0 1px var(--them),0 0 40px rgba(255,125,107,.6)}}
.tb-end{display:flex;justify-content:flex-end;gap:8px}
.iconBtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;padding:0;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:transform .35s var(--spring),border-color .2s,background .2s}
.iconBtn:hover{transform:translateY(-3px) scale(1.05);border-color:rgba(70,227,169,.45);background:rgba(70,227,169,.08)}
.iconBtn:active{transform:scale(.92)}
.iconBtn svg{width:19px;height:19px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:disabled{opacity:.3;cursor:default;transform:none}
.roll{display:inline-grid;overflow:hidden;vertical-align:bottom}
.roll>span{grid-area:1/1}
.roll .out{animation:rollOut .4s cubic-bezier(.5,0,.75,0) forwards}
.roll .in{animation:rollIn .75s var(--spring) backwards}
@keyframes rollOut{to{transform:translateY(-90%) scale(.8);opacity:0}}
@keyframes rollIn{from{transform:translateY(90%) scale(.8);opacity:0}}

/* ---------- tricks panel ---------- */
.tricks{position:absolute;z-index:8;left:max(14px,env(safe-area-inset-left,0px));top:96px;width:226px;padding:14px;display:flex;flex-direction:column;gap:12px;--pw:40px;overflow:hidden;animation:slideIn 1s var(--spring-soft) .12s backwards}
@keyframes slideIn{from{transform:translateX(-120%);opacity:0}}
.tp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.tp-h b{font-size:1.02rem}
.tp-h .round{font-size:.66rem;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tp-team{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 8%,transparent),rgba(255,255,255,.015) 60%);border:1px solid rgba(255,255,255,.06);--ec:var(--c);transition:transform .5s var(--spring)}
.tp-team.lead::before{opacity:1}
.tp-team.hit{animation:hit .7s var(--spring)}
@keyframes hit{30%{transform:scale(1.035)}}
.tp-top{display:flex;align-items:center;gap:10px}
.tp-top .nm{flex:1;min-width:0;line-height:1.3}
.tp-top .nm b{display:block;font-size:.98rem}
.tp-top .nm small{display:block;font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cring{position:relative;width:54px;height:54px;flex:none}
.cring svg{position:absolute;inset:0;width:100%;height:100%}
.cring path{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4;stroke-linecap:round;transition:stroke .4s}
.cring path.on{stroke:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.cring path.pop{animation:arcPop .9s var(--spring)}
@keyframes arcPop{30%{stroke-width:7;filter:drop-shadow(0 0 8px var(--c)) brightness(1.5)}}
.cring .num{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
.cring .num .roll{font-size:1.3rem;font-weight:700;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.tray{position:relative;height:calc(var(--pw)*1.9);border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#21625b,#0f3532 75%);box-shadow:inset 0 3px 10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.tray::before{content:"";position:absolute;inset:0;background-image:var(--felt,var(--noise));background-size:160px 160px;opacity:.6;mix-blend-mode:overlay}
.tray.flashT{animation:trayFlash .9s ease-out}
@keyframes trayFlash{0%{box-shadow:inset 0 0 34px color-mix(in srgb,var(--c) 70%,transparent),inset 0 3px 10px rgba(0,0,0,.6)}}
.stack{position:relative;width:calc(var(--pw)*1.45);height:calc(var(--pw)*1.45)}
.stack:empty::before{content:"";position:absolute;left:50%;top:50%;width:var(--pw);height:calc(var(--pw)*1.4);transform:translate(-50%,-50%);border-radius:6px;border:1.5px dashed color-mix(in srgb,var(--c) 35%,transparent)}
.stack .pc{position:absolute;left:50%;top:50%;width:var(--pw);height:calc(var(--pw)*1.4);margin:calc(var(--pw)*-.7) 0 0 calc(var(--pw)*-.5)}
.stack .pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.6))}
.kotWarn{position:absolute;top:-10px;inset-inline-end:12px;font-size:.64rem;font-weight:700;padding:2px 10px;border-radius:999px;color:#3a2405;
  background:linear-gradient(#ffe09a,#e09a2c);box-shadow:0 0 14px rgba(255,198,99,.6);animation:warn 1.3s ease-in-out infinite;z-index:2}
@keyframes warn{50%{transform:scale(1.08);box-shadow:0 0 26px rgba(255,198,99,.95)}}
.tp-last{display:flex;flex-direction:column;gap:8px;padding:2px}
.tp-last .lh{display:flex;justify-content:space-between;align-items:baseline}
.tp-last .lh b{font-size:.72rem;font-weight:500;color:var(--mint)}
.lastMini{display:flex;justify-content:center;gap:6px;min-height:58px;align-items:flex-start}
.lastMini figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.58rem;color:var(--muted);animation:rise .5s var(--spring-soft) backwards}
.lastMini .card{--cw:32px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.lastMini .w .card{box-shadow:0 0 0 1.5px var(--mint),0 0 14px rgba(70,227,169,.6)}
.lastMini .w figcaption{color:var(--mint);font-weight:700}
.lastMini .empty{font-size:.68rem;color:var(--muted);align-self:center}
.tricks.short .tp-last{display:none}
.tricks.strip{flex-direction:row;align-items:stretch;gap:8px;padding:7px;--pw:17px;width:auto}
.tricks.strip .tp-h,.tricks.strip .tp-last,.tricks.strip .nm small,.tricks.strip .avs{display:none}
.tricks.strip .tp-team{flex:1;flex-direction:row;align-items:center;gap:8px;padding:5px 8px}
.tricks.strip .tp-top{flex:1;gap:8px}
.tricks.strip .cring{width:38px;height:38px}
.tricks.strip .cring .num .roll{font-size:.95rem}
.tricks.strip .tray{height:38px;width:44px;flex:none}
.tricks.strip .kotWarn{top:-8px;font-size:.56rem;padding:1px 7px}

/* ---------- seats & name plates ---------- */
.seat{position:absolute;left:0;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px}
.seat.row{flex-direction:row-reverse;gap:14px}
.fanBox{position:relative;flex:none}
.fan{position:absolute;width:0;height:0;transform-origin:0 0}
.bk{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw)*1.4);transform-origin:50% 115%}
.bk svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.plate{position:relative;display:flex;align-items:center;gap:11px;width:var(--plw,184px);padding:8px 12px 8px 9px;border-radius:20px;
  transition:box-shadow .4s,transform .6s var(--spring),border-color .4s;--ec:var(--mint)}
.plate .av{position:relative;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.08rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);
  background:radial-gradient(circle at 32% 26%,var(--g1),var(--g2));box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.35)}
.tring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);overflow:visible;pointer-events:none}
.tring circle{fill:none;stroke-width:2.4}
.tring .trk{stroke:color-mix(in srgb,var(--c) 30%,transparent)}
.tring .prg{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;filter:drop-shadow(0 0 4px var(--mint))}
.plate.active .tring .prg{opacity:1;animation:tdraw var(--think,.9s) linear forwards}
.plate.active.mine .tring .prg{stroke-dashoffset:0;animation:tpulse 1.5s ease-in-out infinite}
@keyframes tdraw{to{stroke-dashoffset:0}}
@keyframes tpulse{50%{opacity:.35}}
.plate .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.plate .nm{font-size:1rem;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .meta{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);white-space:nowrap;line-height:1.2}
.role{padding:2px 8px;border-radius:999px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 24%,transparent)}
.cntc{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cntc svg{width:9px;height:12px}
.think,.yt{display:none}
.think{gap:3px;align-items:center;color:var(--mint)}
.think i{width:4px;height:4px;border-radius:50%;background:var(--mint);animation:bob .9s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-3px);opacity:.4}}
.yt{color:var(--mint);font-weight:500}
.plate.active:not(.mine) .think{display:inline-flex}
.plate.active:not(.mine) .cntc,.plate.active.mine .cntc{display:none}
.plate.active.mine .yt{display:inline}
.hk{position:absolute;top:-11px;inset-inline-end:16px;display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 8px;border-radius:999px;font-size:.66rem;font-weight:700;color:#3a2405;
  background:linear-gradient(#ffe5a8,#e3a23a);box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 14px rgba(255,198,99,.5);animation:hkIn .8s var(--spring) backwards}
.hk svg{width:12px;height:12px}
@keyframes hkIn{from{transform:scale(0) rotate(-20deg)}}
.plate.active{border-color:rgba(70,227,169,.3);box-shadow:0 0 36px rgba(70,227,169,.28),0 14px 34px rgba(0,0,0,.4);transform:translateY(-3px)}
.plate.active::before{opacity:1}
.compact .plate{--plw:146px;padding:6px 10px 6px 7px;gap:9px}
.compact .plate .av{width:34px;height:34px;font-size:.9rem}
.compact .plate .nm{font-size:.88rem}
.compact .plate .role{display:none}
.av .face{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.av .face svg{width:100%;height:100%;display:block}
.bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);z-index:9;white-space:nowrap;padding:7px 14px;border-radius:14px;
  background:linear-gradient(#ffffff,#e6f2ee);color:#0d2b27;font-weight:700;font-size:.9rem;line-height:1.4;box-shadow:0 10px 26px rgba(0,0,0,.4);pointer-events:none;animation:bubIn .6s var(--spring) backwards}

    x.putImageData(im,0,0);document.documentElement.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}
  const star=(n,r1,r2,rot=0)=>{let p=[];for(let i=0;i<n*2;i++){const a=(i*Math.PI/n)+rot,rr=i%2?r2:r1;p.push((Math.sin(a)*rr).toFixed(1)+','+(-Math.cos(a)*rr).toFixed(1))}return p.join(' ')};
  let sh=`<circle r="124" fill="none" stroke="#c9fff0" stroke-width="1.5"/><circle r="116" fill="none" stroke="#c9fff0" stroke-width=".6"/>`;
  for(let i=0;i<32;i++) sh+=`<path transform="rotate(${i*11.25})" d="M0 -84C9 -96 9 -106 0 -114C-9 -106 -9 -96 0 -84Z" fill="#c9fff0"/>`;

  const curl=(x,y,sx,sy)=>`<path transform="translate(${x} ${y}) scale(${sx} ${sy})" d="M0 0C6 0 10 3 10 8C10 12 6 13 4.5 10.5C3 8 5.5 6 7 7.5M0 0C0 6 3 10 8 10" fill="none" stroke="#fff" stroke-width=".8"/>`;

/* dust drifting in the light */
(function dust(){
  const cv=$('dust'),ctx=cv.getContext('2d');let W,H;const P=[];
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  for(let i=0;i<70;i++) P.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,vx:(Math.random()-.5)*.00012,vy:-(.00004+Math.random()*.00014),a:.15+Math.random()*.45,ph:Math.random()*6});
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx+Math.sin(t/3000+p.ph)*.00006;p.y+=p.vy;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      const bx=(p.x-.5)/(.18+p.y*.25),beam=Math.exp(-bx*bx)*(1-p.y*.55);
      const tw=.6+.4*Math.sin(t/700+p.ph*3);
      ctx.fillStyle=`rgba(210,255,240,${(p.a*beam*tw).toFixed(3)})`;
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,7);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if(!reduce) requestAnimationFrame(frame);
})();

function aceSpade(){

}
const faceCache={};
function cardSVG(c){
  if(faceCache[c.id]) return faceCache[c.id];

  else if(c.r>10) body=court(c.r,c.s);

async function dealSeq(seq,total){

    D=Math.max(560,Math.min(820,dist/Math.max(.6,along)*2.4));

  const sm=d.samples,a=sm[0],b=sm[sm.length-1],dt=Math.max(16,b[2]-a[2]),vx=(b[0]-a[0])/dt,vy=(b[1]-a[1])/dt;
  const ok=st.phase==='play'&&st.turn===0&&!st.busy;
  if(!cancel&&ok&&(d.hot||vy<-.55)){
    // keep moving with the release speed for a moment while the card straightens, then hand over to the flight
    st.lock=true;const t0=performance.now(),sx=d.cx,sy=d.cy,b0=d.b;
    const step=now=>{
      const k=Math.min(1,(now-t0)/90);d.cx=sx+vx*(now-t0);d.cy=sy+vy*(now-t0);setBend(d.g,b0*(1-k));
      d.g.style.transform=`translate(${(d.cx-d.w/2).toFixed(1)}px,${(d.cy-d.h/2).toFixed(1)}px) rotate(${d.rot.toFixed(2)}deg) scale(1.1)`;
      if(k<1){requestAnimationFrame(step);return}
      const thrown={r:{left:d.cx-d.w*.55,top:d.cy-d.h*.55,width:d.w*1.1,height:d.h*1.1},ang:d.rot,w:d.w*1.1,vel:[vx,vy]};
      d.g.remove();st.lock=false;play(0,d.c,thrown);
    };
    requestAnimationFrame(step);return;
  }
  // not thrown: the card springs back into the hand
  const t=d.el.getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/2;
  setBend(d.g,0);
  d.g.animate([{transform:d.g.style.transform},{transform:`translate(${tx-d.w/2}px,${ty-d.h/2}px) perspective(900px) rotate(${cardAngle(d.el,0)}deg) rotateX(0deg) scale(1)`}],{duration:520,easing:EASE_POP,fill:'forwards'})
    .finished.then(()=>{d.g.remove();d.el.style.visibility=''});
}

/* ---- felt texture: fine fibres over the existing colour ---- */
(function feltTex(){
  try{
    const N=256,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');
    const im=x.createImageData(N,N);for(let i=0;i<im.data.length;i+=4){const v=128+(Math.random()-.5)*34;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
    x.putImageData(im,0,0);
    for(let i=0;i<2600;i++){
      const px=Math.random()*N,py=Math.random()*N,a=Math.random()*Math.PI*2,l=2+Math.random()*7,light=Math.random()<.5,bx=(Math.random()-.5)*2.4,by=(Math.random()-.5)*2.4;
      x.strokeStyle=light?`rgba(255,255,255,${(.05+Math.random()*.09).toFixed(3)})`:`rgba(0,0,0,${(.06+Math.random()*.1).toFixed(3)})`;x.lineWidth=.5+Math.random()*.7;
      for(const ox of [-N,0,N]) for(const oy of [-N,0,N]){
        if((ox&&px>12&&px<N-12)||(oy&&py>12&&py<N-12)) continue;
        x.beginPath();x.moveTo(px+ox,py+oy);x.quadraticCurveTo(px+ox+Math.cos(a)*l*.5+bx,py+oy+Math.sin(a)*l*.5+by,px+ox+Math.cos(a)*l,py+oy+Math.sin(a)*l);x.stroke();
      }
    }
    document.documentElement.style.setProperty('--felt',`url(${c.toDataURL()})`);
  }catch(e){}
})();

/* ---- bending card: thin strips chained in 3D so the card can bow ---- */
const BEND_N=8;
function makeBendCard(c,w,h){
  const g=document.createElement('div');g.className='bendCard';g.style.width=w+'px';g.style.height=h+'px';
  const sw=w/BEND_N,half=BEND_N/2,svg=cardSVG(c);
  const strip=(i,k,side)=>`<div class="bs ${side}" style="width:${sw}px;height:${h}px;left:${side==='r'?(k===1?w/2:sw):(k===1?w/2-sw:-sw)}px"><div class="clip" style="width:${sw+.8}px;height:${h}px;${side==='l'?'margin-left:-.8px':''}"><div class="bsi" style="left:${-i*sw+(side==='l'?.8:0)}px;width:${w}px;height:${h}px">${svg}</div><i class="sh" style="--k:${k}"></i></div>`;
  let r='',l='';
  for(let k=1;k<=half;k++){r+=strip(half-1+k,k,'r');l+=strip(half-k,k,'l')}
  g.innerHTML=`<div class="shadowU"></div>`+r+'</div>'.repeat(half)+l+'</div>'.repeat(half);
  return g;
}
function setBend(g,b){g.style.setProperty('--b',b.toFixed(2)+'deg');g.style.setProperty('--bn',b.toFixed(2))}

/* ---- extra sounds ---- */
function sfx(kind){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    if(kind==='boom'){o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+.6);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.85)}
    else{o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1320,t+.08);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.18)}
  }catch(e){}
}
const blip=()=>sfx('blip');
function fireworks(ms=3400){
  if(reduce)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#46e3a9','#b9ffe6','#ffc663','#ffffff','#ff9f84'],P=[];let next=0;const t0=performance.now();
  (function f(now){
    const el=now-t0;
    if(el<ms-900&&now>next){next=now+300+Math.random()*260;const bx=W*(.18+Math.random()*.64),by=H*(.14+Math.random()*.3),c=cols[Math.random()*5|0];
      for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*4.5;P.push({x:bx,y:by,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}sfx('boom')}
    x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.vy*=.985;p.l-=.012;if(p.l<=0){P.splice(i,1);continue}
      x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,1.8,0,7);x.fill()}
    x.globalAlpha=1;
    if(el<ms) requestAnimationFrame(f);else cv.remove();
  })(t0);
}
