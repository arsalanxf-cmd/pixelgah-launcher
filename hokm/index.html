<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d0e">
<title>میز ورق</title>
<meta name="description" content="بازی‌های ورق ایرانی: حکم، شلم، پاسور، دل، هفت‌خبیث، رامی و پاسیانس.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Vazirmatn:wght@200;300;400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<style>
/* Layout: dark room, a walnut-railed teal table lit from above fills the space right of the tricks panel and below the score bar;
   opponents' fans sit on the rail, the trick lands in the pool of light, your hand arcs over the near rail. Single deliberate dark look. */
:root{
  --deep:#050d0e; --mint:#46e3a9; --mint-soft:#b9ffe6; --amber:#ffc663; --coral:#ff7d6b;
  --text:#ecf6f2; --muted:#89a9a2; --line:rgba(185,255,230,.10);
  --us:var(--mint); --them:var(--coral);
  --ui:"Vazirmatn",system-ui,Tahoma,sans-serif;
  --cw:84px; --tw:70px; --bw:34px; --tr:220px;
  --spring:cubic-bezier(.2,.9,.3,1.3); --spring-soft:cubic-bezier(.2,.85,.25,1.08);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--deep);color:var(--text);font-family:var(--ui);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
b,strong,h2{font-weight:700}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible,.card:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

/* ---------- room & table ---------- */
#stage{position:relative;height:100%;overflow:hidden;isolation:isolate;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0;
  background:radial-gradient(ellipse 80% 70% at 56% 58%,#10302f 0%,#081a1b 52%,#030809 100%)}
.layer{position:absolute;inset:0;pointer-events:none}
.tableTop{position:absolute;left:0;top:0;width:10px;height:10px;z-index:0;transform-origin:50% 100%;border-radius:var(--tr);padding:15px;
  background:linear-gradient(180deg,#3d2b22 0%,#22160f 40%,#120b08 100%);
  box-shadow:inset 0 1px 0 rgba(255,230,200,.2),inset 0 -3px 8px rgba(0,0,0,.7),0 40px 90px rgba(0,0,0,.75),0 0 140px rgba(70,227,169,.06)}
.tableTop::after{content:"";position:absolute;inset:6px;border-radius:calc(var(--tr) - 6px);border:1px dashed rgba(255,220,180,.13);pointer-events:none}
.felt{position:relative;width:100%;height:100%;border-radius:calc(var(--tr) - 15px);overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse 70% 62% at 50% 40%,#34857d 0%,#20615b 32%,#15433f 64%,#0c2c2b 100%);
  box-shadow:0 0 0 1px rgba(255,214,150,.35),inset 0 0 70px rgba(0,0,0,.55),inset 0 14px 34px rgba(0,0,0,.4)}
.felt::before{content:"";position:absolute;inset:0;background-image:var(--felt,var(--noise));background-size:220px 220px;opacity:.62;mix-blend-mode:overlay}
.felt::after{content:"";position:absolute;inset:18px;border-radius:calc(var(--tr) - 33px);border:1px solid rgba(200,255,235,.07)}
.beam{position:absolute;inset:-20% -10% 0;background:radial-gradient(ellipse 42% 60% at 50% 0%,rgba(205,255,240,.22) 0%,rgba(160,240,220,.07) 45%,transparent 72%);
  mix-blend-mode:screen;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7}}
.shamseh{position:absolute;left:50%;top:48%;width:min(78%,560px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.035;pointer-events:none}
#dust{z-index:1;width:100%;height:100%}
.vignette{z-index:2;background:radial-gradient(ellipse 90% 85% at 55% 50%,transparent 60%,rgba(0,0,0,.5) 100%)}
.turnLight{position:absolute;left:0;top:0;width:min(56vmin,440px);aspect-ratio:1;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(110,255,200,.18) 0%,rgba(110,255,200,.06) 36%,transparent 68%);mix-blend-mode:screen;
  transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .5s;opacity:0}

/* ---------- glass ---------- */
.glass{background:linear-gradient(160deg,rgba(22,58,60,.7),rgba(7,24,26,.64));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.lbl{display:block;font-size:.68rem;font-weight:300;color:var(--muted);line-height:1.5}
.us{--c:var(--us)} .them{--c:var(--them)}

/* ---------- shared animated border ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinAng{to{--ang:360deg}}
.edge::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 55%,var(--ec,var(--mint)) 75%,transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 3s linear infinite;opacity:0;transition:opacity .4s}

/* ---------- top bar ---------- */
.topbar{position:absolute;z-index:8;top:max(12px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:9px 10px 9px 12px;min-height:72px;animation:dropIn 1s var(--spring-soft) backwards;overflow:hidden}
@keyframes dropIn{from{transform:translateY(-130%);opacity:0}}
.topbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(185,255,230,.07) 48%,transparent 60%);background-size:260% 100%;animation:streak 8s ease-in-out infinite}
@keyframes streak{0%,55%{background-position:160% 0}100%{background-position:-110% 0}}
.tb-start{display:flex;align-items:center;gap:10px;min-width:0}
.chipB{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);min-width:0}
.chipB b{display:block;font-size:1rem;font-weight:700;line-height:1.35;white-space:nowrap}
.ring{position:relative;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.22)}
.ring .q{font-weight:500;color:var(--muted);font-size:1.15rem;animation:qpulse 1.8s ease-in-out infinite}
@keyframes qpulse{50%{opacity:.3}}
.ring.set{background:linear-gradient(160deg,#fff,#e0e8e4);border:0;box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 26px rgba(255,198,99,.4)}
.ring.set::before{content:"";position:absolute;inset:-3.5px;border-radius:16px;padding:2.5px;pointer-events:none;background:conic-gradient(from var(--ang),#ffc663,#fff3c9 25%,#ffc663 50%,#9c6a18 75%,#ffc663);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinAng 4s linear infinite}
.ring.set::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);background-size:320% 100%;background-position:130% 0;animation:tileShine 5s ease-in-out infinite;opacity:.7}
@keyframes tileShine{0%,72%{background-position:130% 0}100%{background-position:-70% 0}}
.ring svg{width:58%;height:58%}
.crownC{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 34% 28%,#ffe7ad,#c98a24);
  box-shadow:0 0 16px rgba(255,198,99,.4),inset 0 -2px 5px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.5);animation:crownGlow 2.8s ease-in-out infinite}
.crownC svg{width:21px;height:21px}
@keyframes crownGlow{50%{box-shadow:0 0 28px rgba(255,198,99,.75),inset 0 -2px 5px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.5)}}
.vs{position:relative;display:grid;grid-template-columns:auto auto minmax(120px,230px) auto auto;align-items:center;gap:14px;padding:8px 18px;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,125,107,.14),rgba(255,255,255,.02) 32%,rgba(255,255,255,.02) 68%,rgba(70,227,169,.15));border:1px solid rgba(255,255,255,.07);--ec:rgba(185,255,230,.55)}
.vs.edge::before{opacity:.55;animation-duration:6s}
.vs .tn{display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1}
.vs .tn b{font-size:.92rem}
.avs{display:flex;direction:ltr}
.avs i{width:21px;height:21px;border-radius:50%;margin-left:-7px;border:2px solid #0c2426;display:grid;place-items:center;font-style:normal;font-size:.6rem;font-weight:700;color:#fff;
  background:radial-gradient(circle at 32% 28%,var(--g1),var(--g2))}
.avs i:first-child{margin-left:0}
.big{font-size:2.3rem;font-weight:700;line-height:1.05;color:var(--c);text-shadow:0 0 24px color-mix(in srgb,var(--c) 50%,transparent);min-width:1.2ch;text-align:center;font-variant-numeric:tabular-nums}
.tug{display:flex;flex-direction:column;gap:6px}
.tug .bar{display:grid;grid-template-columns:repeat(7,1fr) 2px repeat(7,1fr);gap:3px;direction:ltr;height:9px}
.tug .bar i{border-radius:3px;background:rgba(255,255,255,.07);transition:background .5s,box-shadow .5s}
.tug .bar i.mid{background:rgba(255,255,255,.4);border-radius:1px}
.tug .bar i.on.us{background:var(--us);box-shadow:0 0 10px rgba(70,227,169,.6)}
.tug .bar i.on.them{background:var(--them);box-shadow:0 0 10px rgba(255,125,107,.6)}
.tug .bar i.pop{animation:segPop 1s var(--spring)}
@keyframes segPop{25%{transform:scaleY(2.6);filter:brightness(1.8)}}
.tug small{text-align:center;font-size:.62rem;color:var(--muted)}
.vs.flash-us{animation:flashUs 1.1s ease-out}.vs.flash-them{animation:flashThem 1.1s ease-out}
@keyframes flashUs{0%{box-shadow:0 0 0 1px var(--us),0 0 40px rgba(70,227,169,.6)}}
@keyframes flashThem{0%{box-shadow:0 0 0 1px var(--them),0 0 40px rgba(255,125,107,.6)}}
.tb-end{display:flex;justify-content:flex-end;gap:8px}
.iconBtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;padding:0;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:transform .35s var(--spring),border-color .2s,background .2s}
.iconBtn:hover{transform:translateY(-3px) scale(1.05);border-color:rgba(70,227,169,.45);background:rgba(70,227,169,.08)}
.iconBtn:active{transform:scale(.92)}
.iconBtn svg{width:19px;height:19px;fill:none;stroke:var(--text);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconBtn:disabled{opacity:.3;cursor:default;transform:none}
.roll{display:inline-grid;overflow:hidden;vertical-align:bottom}
.roll>span{grid-area:1/1}
.roll .out{animation:rollOut .4s cubic-bezier(.5,0,.75,0) forwards}
.roll .in{animation:rollIn .75s var(--spring) backwards}
@keyframes rollOut{to{transform:translateY(-90%) scale(.8);opacity:0}}
@keyframes rollIn{from{transform:translateY(90%) scale(.8);opacity:0}}

/* ---------- tricks panel ---------- */
.tricks{position:absolute;z-index:8;left:max(14px,env(safe-area-inset-left,0px));top:96px;width:226px;padding:14px;display:flex;flex-direction:column;gap:12px;--pw:40px;overflow:hidden;animation:slideIn 1s var(--spring-soft) .12s backwards}
@keyframes slideIn{from{transform:translateX(-120%);opacity:0}}
.tp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.tp-h b{font-size:1.02rem}
.tp-h .round{font-size:.66rem;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tp-team{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 8%,transparent),rgba(255,255,255,.015) 60%);border:1px solid rgba(255,255,255,.06);--ec:var(--c);transition:transform .5s var(--spring)}
.tp-team.lead::before{opacity:1}
.tp-team.hit{animation:hit .7s var(--spring)}
@keyframes hit{30%{transform:scale(1.035)}}
.tp-top{display:flex;align-items:center;gap:10px}
.tp-top .nm{flex:1;min-width:0;line-height:1.3}
.tp-top .nm b{display:block;font-size:.98rem}
.tp-top .nm small{display:block;font-size:.64rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cring{position:relative;width:54px;height:54px;flex:none}
.cring svg{position:absolute;inset:0;width:100%;height:100%}
.cring path{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4;stroke-linecap:round;transition:stroke .4s}
.cring path.on{stroke:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.cring path.pop{animation:arcPop .9s var(--spring)}
@keyframes arcPop{30%{stroke-width:7;filter:drop-shadow(0 0 8px var(--c)) brightness(1.5)}}
.cring .num{position:absolute;inset:0;display:grid;place-items:center;line-height:1}
.cring .num .roll{font-size:1.3rem;font-weight:700;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.tray{position:relative;height:calc(var(--pw)*1.9);border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#21625b,#0f3532 75%);box-shadow:inset 0 3px 10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.tray::before{content:"";position:absolute;inset:0;background-image:var(--felt,var(--noise));background-size:160px 160px;opacity:.6;mix-blend-mode:overlay}
.tray.flashT{animation:trayFlash .9s ease-out}
@keyframes trayFlash{0%{box-shadow:inset 0 0 34px color-mix(in srgb,var(--c) 70%,transparent),inset 0 3px 10px rgba(0,0,0,.6)}}
.stack{position:relative;width:calc(var(--pw)*1.45);height:calc(var(--pw)*1.45)}
.stack:empty::before{content:"";position:absolute;left:50%;top:50%;width:var(--pw);height:calc(var(--pw)*1.4);transform:translate(-50%,-50%);border-radius:6px;border:1.5px dashed color-mix(in srgb,var(--c) 35%,transparent)}
.stack .pc{position:absolute;left:50%;top:50%;width:var(--pw);height:calc(var(--pw)*1.4);margin:calc(var(--pw)*-.7) 0 0 calc(var(--pw)*-.5)}
.stack .pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.6))}
.kotWarn{position:absolute;top:-10px;inset-inline-end:12px;font-size:.64rem;font-weight:700;padding:2px 10px;border-radius:999px;color:#3a2405;
  background:linear-gradient(#ffe09a,#e09a2c);box-shadow:0 0 14px rgba(255,198,99,.6);animation:warn 1.3s ease-in-out infinite;z-index:2}
@keyframes warn{50%{transform:scale(1.08);box-shadow:0 0 26px rgba(255,198,99,.95)}}
.tp-last{display:flex;flex-direction:column;gap:8px;padding:2px}
.tp-last .lh{display:flex;justify-content:space-between;align-items:baseline}
.tp-last .lh b{font-size:.72rem;font-weight:500;color:var(--mint)}
.lastMini{display:flex;justify-content:center;gap:6px;min-height:58px;align-items:flex-start}
.lastMini figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.58rem;color:var(--muted);animation:rise .5s var(--spring-soft) backwards}
.lastMini .card{--cw:32px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.lastMini .w .card{box-shadow:0 0 0 1.5px var(--mint),0 0 14px rgba(70,227,169,.6)}
.lastMini .w figcaption{color:var(--mint);font-weight:700}
.lastMini .empty{font-size:.68rem;color:var(--muted);align-self:center}
.tricks.short .tp-last{display:none}
.tricks.strip{flex-direction:row;align-items:stretch;gap:8px;padding:7px;--pw:17px;width:auto}
.tricks.strip .tp-h,.tricks.strip .tp-last,.tricks.strip .nm small,.tricks.strip .avs{display:none}
.tricks.strip .tp-team{flex:1;flex-direction:row;align-items:center;gap:8px;padding:5px 8px}
.tricks.strip .tp-top{flex:1;gap:8px}
.tricks.strip .cring{width:38px;height:38px}
.tricks.strip .cring .num .roll{font-size:.95rem}
.tricks.strip .tray{height:38px;width:44px;flex:none}
.tricks.strip .kotWarn{top:-8px;font-size:.56rem;padding:1px 7px}

/* ---------- seats & name plates ---------- */
.seat{position:absolute;left:0;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px}
.seat.row{flex-direction:row-reverse;gap:14px}
.fanBox{position:relative;flex:none}
.fan{position:absolute;width:0;height:0;transform-origin:0 0}
.bk{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw)*1.4);transform-origin:50% 115%}
.bk svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.plate{position:relative;display:flex;align-items:center;gap:11px;width:var(--plw,184px);padding:8px 12px 8px 9px;border-radius:20px;
  transition:box-shadow .4s,transform .6s var(--spring),border-color .4s;--ec:var(--mint)}
.plate .av{position:relative;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.08rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);
  background:radial-gradient(circle at 32% 26%,var(--g1),var(--g2));box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.4),0 4px 10px rgba(0,0,0,.35)}
.tring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);overflow:visible;pointer-events:none}
.tring circle{fill:none;stroke-width:2.4}
.tring .trk{stroke:color-mix(in srgb,var(--c) 30%,transparent)}
.tring .prg{stroke:var(--mint);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;filter:drop-shadow(0 0 4px var(--mint))}
.plate.active .tring .prg{opacity:1;animation:tdraw var(--think,.9s) linear forwards}
.plate.active.mine .tring .prg{stroke-dashoffset:0;animation:tpulse 1.5s ease-in-out infinite}
@keyframes tdraw{to{stroke-dashoffset:0}}
@keyframes tpulse{50%{opacity:.35}}
.plate .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.plate .nm{font-size:1rem;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .meta{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);white-space:nowrap;line-height:1.2}
.role{padding:2px 8px;border-radius:999px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 24%,transparent)}
.cntc{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.cntc svg{width:9px;height:12px}
.think,.yt{display:none}
.think{gap:3px;align-items:center;color:var(--mint)}
.think i{width:4px;height:4px;border-radius:50%;background:var(--mint);animation:bob .9s ease-in-out infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-3px);opacity:.4}}
.yt{color:var(--mint);font-weight:500}
.plate.active:not(.mine) .think{display:inline-flex}
.plate.active:not(.mine) .cntc,.plate.active.mine .cntc{display:none}
.plate.active.mine .yt{display:inline}
.hk{position:absolute;top:-11px;inset-inline-end:16px;display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 8px;border-radius:999px;font-size:.66rem;font-weight:700;color:#3a2405;
  background:linear-gradient(#ffe5a8,#e3a23a);box-shadow:0 4px 12px rgba(0,0,0,.35),0 0 14px rgba(255,198,99,.5);animation:hkIn .8s var(--spring) backwards}
.hk svg{width:12px;height:12px}
@keyframes hkIn{from{transform:scale(0) rotate(-20deg)}}
.plate.active{border-color:rgba(70,227,169,.3);box-shadow:0 0 36px rgba(70,227,169,.28),0 14px 34px rgba(0,0,0,.4);transform:translateY(-3px)}
.plate.active::before{opacity:1}
.compact .plate{--plw:146px;padding:6px 10px 6px 7px;gap:9px}
.compact .plate .av{width:34px;height:34px;font-size:.9rem}
.compact .plate .nm{font-size:.88rem}
.compact .plate .role{display:none}
.av .face{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.av .face svg{width:100%;height:100%;display:block}
.bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);z-index:9;white-space:nowrap;padding:7px 14px;border-radius:14px;
  background:linear-gradient(#ffffff,#e6f2ee);color:#0d2b27;font-weight:700;font-size:.9rem;line-height:1.4;box-shadow:0 10px 26px rgba(0,0,0,.4);pointer-events:none;animation:bubIn .6s var(--spring) backwards}

/* ---------- trick area ---------- */
.center{position:absolute;left:0;top:0;width:300px;height:260px;z-index:3}

.deck{position:absolute;left:var(--dx,50%);top:var(--dy,50%);transform:perspective(900px) rotateX(26deg);transition:left .6s var(--spring-soft),top .6s var(--spring-soft),opacity .4s,scale .4s;width:var(--tw);height:calc(var(--tw)*1.4);margin:calc(var(--tw)*-.7) 0 0 calc(var(--tw)*-.5);z-index:2}

.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.lb-tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;border-radius:24px;
  background:linear-gradient(165deg,rgba(28,74,74,.72),rgba(7,24,26,.72));border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .7s var(--spring-soft) var(--d) backwards;transition:transform .5s var(--spring),box-shadow .3s,border-color .3s;overflow:hidden}
.lb-tile::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(185,255,230,.12),transparent 70%);opacity:.7}
.lb-tile:not(.soon):hover{transform:translateY(-6px);border-color:rgba(70,227,169,.4);box-shadow:0 26px 50px rgba(0,0,0,.5),0 0 40px rgba(70,227,169,.12)}
.lb-fan{position:relative;height:118px;display:grid;place-items:center}
.lb-fan .lc{position:absolute;width:62px;height:87px;border-radius:5px;box-shadow:0 6px 14px rgba(0,0,0,.45);transform-origin:50% 120%;
  transform:translateX(calc(var(--k)*20px)) rotate(calc(var(--k)*11deg));transition:transform .6s var(--spring)}
.lb-fan .lc svg{width:100%;height:100%;display:block}
.lb-tile:not(.soon):hover .lc{transform:translateX(calc(var(--k)*30px)) translateY(-6px) rotate(calc(var(--k)*17deg))}
.lb-txt h3{margin:0;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.lb-txt p{margin:4px 0 0;color:var(--muted);font-size:.86rem;line-height:1.75}
.tag{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--amber);color:#3a2405}
.lb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}
.pchips{display:flex;gap:4px;flex-wrap:wrap}
.pchip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 11px;font-size:.74rem;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.pchip.on{background:rgba(70,227,169,.16);border-color:rgba(70,227,169,.55);color:var(--mint-soft);font-weight:500}
.pinfo{font-size:.76rem;color:var(--muted)}
.lb-play{border:none;border-radius:999px;padding:9px 22px;font-weight:700;font-size:.92rem;cursor:pointer;color:#05231a;background:linear-gradient(180deg,#8cf5cd,var(--mint));
  box-shadow:0 8px 20px rgba(70,227,169,.3);transition:transform .4s var(--spring)}
.lb-play:hover{transform:translateY(-2px) scale(1.04)}
.lb-tile.soon{opacity:.62}
.lb-tile.soon .lb-play{background:rgba(255,255,255,.08);color:var(--muted);box-shadow:none;cursor:default}
.lb-foot{margin:0;text-align:center;color:var(--muted);font-size:.8rem}

/* ---------- action buttons above your hand ---------- */
.actions{position:absolute;z-index:9;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:7px;border-radius:22px;
  background:rgba(5,20,22,.62);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.aTitle{font-size:.82rem;color:var(--muted);padding:0 8px;white-space:nowrap}
.abtn{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 16px;font-size:.86rem;font-weight:500;cursor:pointer;white-space:nowrap;
  animation:rise .45s var(--spring-soft) backwards;transition:transform .35s var(--spring),background .2s,border-color .2s}
.abtn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(70,227,169,.5);background:rgba(70,227,169,.12)}
.abtn.primary{background:linear-gradient(180deg,#8cf5cd,var(--mint));color:#05231a;border:0;font-weight:700;box-shadow:0 8px 20px rgba(70,227,169,.3)}
.abtn:disabled{opacity:.4;cursor:default}
.abtn.warn{border-color:rgba(255,198,99,.5);color:var(--amber)}
.mbtns{position:relative;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.cta.ghostb{background:rgba(255,255,255,.07);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.confirm .panel{max-width:380px}

/* ---------- selected cards in your hand ---------- */
.hand .card.picked{--lift:calc(var(--cw)*.34);box-shadow:0 0 0 2px var(--amber),0 0 22px rgba(255,198,99,.5),0 10px 18px rgba(0,0,0,.4)}
.hand .card.selectable{cursor:pointer}
.hand .card.selectable:hover{--lift:calc(var(--cw)*.14)}

/* ---------- players' scoreboard ---------- */
.pcap{position:relative;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);--ec:rgba(185,255,230,.55)}
.pcap.edge::before{opacity:.5;animation-duration:6s}
.pcs{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;transition:background .4s,box-shadow .4s}
.pcs .mav{width:30px;height:30px;border-radius:50%;flex:none;display:block;background:radial-gradient(circle at 32% 28%,var(--g1),var(--g2));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent)}
.pcs .pn{font-size:.8rem;font-weight:700;white-space:nowrap}
.pcs .big{font-size:1.5rem}
.pcs.lead{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.pcs.hit{animation:hit .7s var(--spring)}
.pcl{font-size:.62rem;color:var(--muted);white-space:nowrap;padding:0 8px 0 4px;border-inline-start:1px solid var(--line);max-width:9em;line-height:1.4;white-space:normal}
@media (max-width:899px){.pcl{display:none}}

/* ---------- side panel with three or more blocks ---------- */
.tricks.many{gap:9px}
.tricks.many .tp-team{padding:9px 11px;gap:7px}
.tricks.many .tray{height:calc(var(--pw)*1.45)}
.tricks.many .cring{width:46px;height:46px}
.tricks.many .tp-last{display:none}
.tp-stats{display:flex;gap:6px;flex-wrap:wrap}
.tp-stats span{font-size:.66rem;color:var(--muted);padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);white-space:nowrap}
.tp-stats b{color:var(--text);font-weight:700}
.tp-stats .hot{color:var(--amber);border-color:rgba(255,198,99,.4)}
.tricks.strip .tp-stats{display:none}

/* ---------- table piles, peek card, big pop ---------- */
.pile2{position:absolute;width:calc(var(--tw)*.9);height:calc(var(--tw)*1.26);transform:translate(-50%,-50%) perspective(900px) rotateX(26deg)}
.pile2 .pstk,.pile2 .pl{position:absolute;inset:0}
.pile2 .pl{border-radius:calc(var(--tw)*.07);box-shadow:0 1px 2px rgba(0,0,0,.55)}
.pile2 .pl svg{width:100%;height:100%;display:block}
.pile2.empty .pstk{border:1.5px dashed rgba(185,255,230,.25);border-radius:calc(var(--tw)*.07)}
.pile2 .plbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-size:.62rem;color:var(--muted);white-space:nowrap}
.pile2 .pcnt{position:absolute;top:-10px;right:-10px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:.7rem;font-weight:700;background:rgba(0,0,0,.55);border:1px solid var(--line)}
.pile2 .pcnt:empty{display:none}
.pile2.discard{left:16%;top:50%}
.slot.peek{left:50%;top:48%;scale:1.25;z-index:6}
.bigPop{position:fixed;z-index:27;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(2.6rem,9vw,4.4rem);pointer-events:none;white-space:nowrap;
  background:linear-gradient(#fff6d8,#ffc663 55%,#c47f15);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,198,99,.6));
  animation:bigPop 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.bigPop.us{background:linear-gradient(#fff,#b9ffe6 50%,#2fd197);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 6px 24px rgba(70,227,169,.6))}
@keyframes bigPop{0%{transform:translate(-50%,-50%) scale(2.6);opacity:0;filter:blur(10px)}22%{transform:translate(-50%,-50%) scale(.92);opacity:1;filter:blur(0)}32%{transform:translate(-50%,-50%) scale(1.04)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(.96)}}
.chooser .q b{color:var(--mint)}

/* ---------- pasur ---------- */
.slot.tbl{transition:left .55s var(--spring-soft),top .55s var(--spring-soft)}
.slot.tbl.target .face{box-shadow:0 0 0 2px var(--amber),0 0 26px rgba(255,198,99,.75),0 8px 16px rgba(0,0,0,.45)}
.slot.tbl.target{z-index:4}
.pdeckI{background:none;box-shadow:none;animation:none;border-radius:6px;overflow:hidden;width:28px;height:38px}
.pdeckI svg{width:100%!important;height:100%!important}
.pkey{display:flex;flex-direction:column;gap:5px}
.pkey span{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.72rem;color:var(--muted)}
.pkey span svg{width:12px;height:12px;vertical-align:-2px}
.pkey b{color:var(--amber);font-weight:700}
.tp-stats svg{width:11px;height:11px;vertical-align:-1px;margin-inline-end:3px}
.ptab{position:relative;width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.88rem}
.ptab th{font-weight:700;padding:6px 8px;color:var(--c)}
.ptab td{padding:6px 8px;border-top:1px solid rgba(255,255,255,.06);text-align:center}
.ptab td:first-child{text-align:start;color:var(--muted)}
.ptab td svg{width:13px;height:13px;vertical-align:-2px}
.ptab td b{color:var(--amber)}
.ptab .tot td{font-weight:700;font-size:1rem;color:var(--text);border-top:1px solid rgba(255,255,255,.18)}
.hand .card.fresh{box-shadow:0 0 0 2px var(--mint),0 0 20px rgba(70,227,169,.5),0 10px 18px rgba(0,0,0,.4);animation:freshP 1.4s ease-in-out infinite}
@keyframes freshP{50%{box-shadow:0 0 0 2px var(--mint),0 0 32px rgba(70,227,169,.75),0 10px 18px rgba(0,0,0,.4)}}
.abtn.warn{border-color:rgba(255,125,107,.6);color:#ffb3a8}
.tp-stats .hot{color:var(--amber);font-weight:700}
/* haft khabis felt */
.kDir{position:absolute;left:50%;top:50%;width:calc(var(--tw)*4.6);aspect-ratio:1;transform:translate(-50%,-50%) perspective(900px) rotateX(26deg);pointer-events:none;z-index:0}
.kDirF{width:100%;height:100%;transition:transform .9s var(--spring-soft)}
.kDir.ccw .kDirF{transform:scaleX(-1)}
.kDirF svg{width:100%;height:100%;display:block;animation:kspin 18s linear infinite;filter:drop-shadow(0 0 6px rgba(70,227,169,.25))}
@keyframes kspin{to{rotate:360deg}}
.kPen{position:absolute;z-index:30;transform:translate(-50%,-50%);min-width:44px;height:30px;padding:0 10px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:1rem;color:#fff;
  background:linear-gradient(180deg,#ff8a74,#d9473a);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 6px 18px rgba(217,71,58,.5),0 0 26px rgba(255,125,107,.45);opacity:0;scale:.6;transition:opacity .3s,scale .4s var(--spring-pop,cubic-bezier(.3,1.6,.5,1));pointer-events:none}
.kPen.on{opacity:1;scale:1}
.kSuitB{position:absolute;z-index:30;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:9px;
  background:radial-gradient(circle at 35% 30%,#fffdf6,#efe6d2);box-shadow:0 0 0 2px var(--amber),0 0 24px rgba(255,198,99,.6),0 8px 16px rgba(0,0,0,.45);opacity:0;scale:.5;transition:opacity .3s,scale .4s;pointer-events:none}
.kSuitB.on{opacity:1;scale:1}
.kSuitB svg{width:100%;height:100%}
.kdirI svg{width:20px;height:20px;transition:transform .7s var(--spring-soft)}
.kdirI.ccw svg{transform:scaleX(-1)}
.kmini{display:inline-flex;align-items:center;gap:0;direction:ltr}
.kmini i{display:block;width:22px;height:31px;margin-left:-8px;border-radius:3px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.kmini i:first-child{margin-left:0}
.kmini i svg{width:100%;height:100%;display:block}
.kmini em{font-style:normal;font-size:.72rem;color:var(--muted);margin-left:6px}
.kwin{color:var(--mint);font-size:.78rem;font-weight:700}
.ktab td{vertical-align:middle}
/* rummy melds */
.rmeld{position:absolute;display:flex;direction:ltr;transform:translate(-50%,-50%) perspective(900px) rotateX(26deg);transition:left .5s var(--spring-soft),top .5s var(--spring-soft);padding-bottom:7px;z-index:2}
.rmeld .rc{width:var(--mw,48px);aspect-ratio:5/7;border-radius:calc(var(--mw,48px)*.08);overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.3);flex:none;transition:box-shadow .3s}
.rmeld .rc+.rc{margin-left:calc(var(--mw,48px)*-.64)}
.rmeld .rc svg{width:100%;height:100%;display:block}
.rmeld::after{content:'';position:absolute;left:10%;right:10%;bottom:0;height:3px;border-radius:3px;background:var(--them);opacity:.75;box-shadow:0 0 10px var(--them)}
.rmeld.us::after{background:var(--us);box-shadow:0 0 10px var(--us)}
.rmeld.target .rc{box-shadow:0 0 0 2px var(--amber),0 0 20px rgba(255,198,99,.65)}
.rmeld.target{z-index:4;animation:rPulse 1s ease-in-out infinite}
@keyframes rPulse{50%{filter:brightness(1.12)}}
.center.rPick .deck,.center.rPick .slot.disc.pick{cursor:pointer;filter:drop-shadow(0 0 14px rgba(70,227,169,.55))}
.center.rPick .deck:hover,.center.rPick .slot.disc.pick:hover{filter:drop-shadow(0 0 20px rgba(70,227,169,.85))}
.rmI svg{width:20px;height:20px;color:var(--coral)}
.abtn.dash{background:transparent;border-style:dashed;opacity:.85}
/* solitaire */
.sc{position:absolute;width:var(--sw,70px);height:calc(var(--sw,70px)*1.4);perspective:900px;touch-action:none;
  transition:left .4s cubic-bezier(.2,.9,.25,1.1),top .4s cubic-bezier(.2,.9,.25,1.1),rotate .2s}
.sc .sci{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .5s cubic-bezier(.3,.9,.3,1.12)}
.sc.up .sci{transform:none}
.sc .scf,.sc .scb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--sw,70px)*.07);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.25);transition:box-shadow .25s}
.sc .scb{transform:rotateY(180deg)}
.sc svg{width:100%;height:100%;display:block}
.sc.up{cursor:grab}
.sc.drag{transition:rotate .15s;cursor:grabbing}
.sc.drag .scf{box-shadow:0 22px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.2)}
.sc.hint .scf,.sc.hint .scb{box-shadow:0 0 0 2px var(--amber),0 0 24px rgba(255,198,99,.75)}
.sslot{position:absolute;width:var(--sw,70px);height:calc(var(--sw,70px)*1.4);border-radius:calc(var(--sw,70px)*.07);border:1.5px dashed rgba(185,255,230,.2);
  display:grid;place-items:center;color:rgba(185,255,230,.28);background:rgba(0,0,0,.08);font-family:'Oswald',sans-serif;font-size:calc(var(--sw,70px)*.36)}
.sslot svg{width:40%;height:40%;opacity:0;transition:opacity .3s}
.sslot.stk{cursor:pointer}
.sslot.stk.empty svg{opacity:1}
.sslot.hint{border-color:var(--amber);box-shadow:0 0 22px rgba(255,198,99,.5)}
.sslot.wst{border-color:transparent;background:none}
.lctl{display:flex;flex-direction:column;gap:8px}
.lctl .abtn{width:100%;justify-content:center}
.lseg{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.74rem;color:var(--muted)}
.lseg span{padding:0 6px;flex:1}
.lseg button{border:0;border-radius:9px;padding:6px 10px;background:transparent;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.lseg button.on{background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--mint);box-shadow:0 0 0 1px color-mix(in srgb,var(--mint) 45%,transparent)}
.lCascade{position:fixed;inset:0;width:100vw;height:100vh;z-index:60;cursor:pointer}
.pcs .lt{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
body.solo #status{pointer-events:none}
.lDrawI svg{color:#1c2330}
/* phone strip: many players and solitaire controls */
.tricks.strip.many .tray{display:none}
.tricks.strip.many .tp-team{padding:4px 6px;gap:5px}
.tricks.strip.many .cring{width:32px;height:32px}
.tricks.strip.many .nm b{font-size:.74rem}
body[data-game=solitaire] .tricks.strip #lb{display:none}
body[data-game=solitaire] .tricks.strip .lctl{flex-direction:row;flex:1;gap:6px;align-items:center}
body[data-game=solitaire] .tricks.strip .lctl .abtn{width:auto;flex:1;padding:7px 6px;font-size:.72rem}
body[data-game=solitaire] .tricks.strip .lseg{flex:none;padding:3px}
body[data-game=solitaire] .tricks.strip .lseg span{display:none}
body[data-game=solitaire] .tricks.strip .lseg button{padding:5px 7px;font-size:.7rem}
@media (max-width:600px){body[data-game=solitaire] #vs .pcs:last-child{display:none}body[data-game=solitaire] #vs .pn{display:none}body[data-game=solitaire] #vs .pcs .mav{display:none}}
/* ===== online ===== */
.plate.active.mine.timed .tring .prg{stroke-dashoffset:100;animation:tdraw var(--think) linear forwards}
.plate.hurry .tring .prg{stroke:var(--coral);filter:drop-shadow(0 0 5px var(--coral))}
.plate.hurry{animation:hurryP .5s ease-in-out infinite alternate}
@keyframes hurryP{to{box-shadow:0 0 30px rgba(255,125,107,.45),0 14px 34px rgba(0,0,0,.4)}}
.plate.off{filter:saturate(.25) brightness(.8)}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translateX(-50%);padding:11px 20px;border-radius:999px;font-size:.88rem;font-weight:500;animation:rise .4s var(--spring-soft) backwards;transition:opacity .4s,translate .4s}
.toast.out{opacity:0;translate:0 10px}
/* lobby: offline / online switch */
.lb-modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;animation:rise .8s var(--spring-soft) .08s backwards}
.lb-mode{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.lb-mode button{border:0;border-radius:999px;padding:8px 18px;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .3s,color .3s}
.lb-mode button.on{background:linear-gradient(180deg,#8cf5cd,var(--mint));color:#05231a;box-shadow:0 6px 18px rgba(70,227,169,.3)}
.ndot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.ndot.ready{background:#46e3a9;box-shadow:0 0 8px #46e3a9}.ndot.connecting{background:var(--amber);animation:blink 1s infinite}.ndot.closed,.ndot.fail{background:var(--coral)}
@keyframes blink{50%{opacity:.3}}
.lb-online{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.lobby.online .lb-online{display:flex}
.lb-me{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:999px;padding:4px 14px 4px 5px;color:var(--text);font:inherit;font-weight:700;font-size:.86rem;cursor:pointer}
.lb-me .mav,.oSeat .mav,.lbRows .mav,.pfAv .mav,.radar .mav{display:block;border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--g1),var(--g2));flex:none}
.lb-me .mav{width:30px;height:30px}
.lb-code{display:flex;align-items:center;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(0,0,0,.18);overflow:hidden}
.lb-code input{width:96px;border:0;background:transparent;color:var(--text);font:inherit;font-family:'Oswald',sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:8px 12px;outline:none;direction:ltr;text-align:center}
.lb-code button,.lb-lbBtn{border:0;background:rgba(70,227,169,.14);color:var(--mint);font:inherit;font-weight:700;font-size:.84rem;padding:9px 14px;cursor:pointer}
.lb-lbBtn{border-radius:999px;border:1px solid rgba(70,227,169,.3)}
.lb-onb{display:none;gap:6px}
.lobby.online .lb-onb{display:flex}
.lobby.online .lb-play{display:none}
.lb-onb button{border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.86rem;cursor:pointer;font-family:inherit;transition:transform .3s var(--spring)}
.lb-onb .lb-q,.lb-onb .lb-d{color:#05231a;background:linear-gradient(180deg,#8cf5cd,var(--mint));box-shadow:0 8px 20px rgba(70,227,169,.25)}
.lb-onb .lb-c{color:var(--text);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.lb-onb button:hover{transform:translateY(-2px)}
.lobby.noserver .lb-onb button,.lobby.noserver .lb-online>*{opacity:.4;pointer-events:none}
/* online overlay screens */
.oPanel{max-width:560px;width:calc(100vw - 32px)}
.oIn{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem;margin:6px 0 14px;outline:none}
.oIn:focus{border-color:var(--mint)}
.pfAv{display:flex;justify-content:center;gap:12px;margin-bottom:8px}
.pfAv button{border:2px solid transparent;border-radius:50%;padding:3px;background:none;cursor:pointer;transition:transform .3s var(--spring),border-color .3s}
.pfAv button.on{border-color:var(--mint);transform:scale(1.1)}
.pfAv .mav{width:58px;height:58px}
.oHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.oHead small{color:var(--muted);font-size:.8rem}
.oHead h2{margin:2px 0 0}
.oCode{font-family:'Oswald',sans-serif;letter-spacing:.14em;color:var(--mint);direction:ltr;display:inline-block}
.oTable{position:relative;height:250px;margin:16px 0 6px}
.oFelt{position:absolute;inset:44px 70px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#1c6a5c,#0b3a33 70%);box-shadow:inset 0 0 0 3px rgba(91,52,24,.9),inset 0 0 30px rgba(0,0,0,.5);display:grid;place-items:center;text-align:center;padding:0 30px}
.oFelt span{font-size:.72rem;color:rgba(185,255,230,.6)}
.oSeat{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;width:110px;transform:translate(-50%,-50%);text-align:center;animation:rise .5s var(--spring-soft) backwards}
.oSeat .mav{width:52px;height:52px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent),0 6px 16px rgba(0,0,0,.4)}
.oSeat .mav.e{display:grid;place-items:center;background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.25);box-shadow:none;color:var(--muted);font-style:normal;font-size:1.4rem}
.oSeat .on{font-size:.84rem;font-weight:700;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.oSeat.empty .on{color:var(--muted);font-weight:400}
.oSeat .tgs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.oSeat .tg{font-size:.6rem;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
.oSeat .tg.h{background:rgba(255,198,99,.18);color:var(--amber)}.oSeat .tg.me{background:rgba(70,227,169,.18);color:var(--mint)}.oSeat .tg.off{background:rgba(255,125,107,.15);color:var(--coral)}
.oSeat .kx{position:absolute;top:-4px;right:22px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.oSeat.p-b{left:50%;top:86%}.oSeat.p-t{left:50%;top:14%}.oSeat.p-r{left:88%;top:50%}.oSeat.p-l{left:12%;top:50%}
.oSearch{text-align:center}
.radar{position:relative;width:120px;height:120px;margin:6px auto 14px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(70,227,169,.5);animation:radar 2.4s ease-out infinite;font-style:normal}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
@keyframes radar{from{transform:scale(.4);opacity:1}to{transform:scale(1.15);opacity:0}}
.radar .mav{width:64px;height:64px;position:relative;z-index:2}
.oLeft{color:var(--muted);font-size:.86rem}.oLeft b{color:var(--amber)}
.lbTabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 12px}
.lbTabs button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.lbTabs button.on{background:rgba(70,227,169,.16);border-color:rgba(70,227,169,.45);color:var(--mint)}
.lbList{max-height:52vh;overflow:auto}
.lbRows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.lbRows li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.03)}
.lbRows li.myrow{background:rgba(70,227,169,.12);box-shadow:0 0 0 1px rgba(70,227,169,.35)}
.lbRows li:nth-child(1) .rk{color:#ffd36b}.lbRows li:nth-child(2) .rk{color:#d8e2e6}.lbRows li:nth-child(3) .rk{color:#f0a36b}
.lbRows .rk{width:22px;text-align:center;font-weight:700;color:var(--muted)}
.lbRows .mav{width:32px;height:32px}
.lbRows .nm{flex:1;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbRows .st{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.lbRows .st b{color:var(--amber);font-size:1rem}.lbRows .st small{color:var(--muted);font-size:.68rem}
@media (max-width:560px){.oTable{height:220px}.oFelt{inset:40px 54px}.oSeat{width:90px}.oSeat .mav{width:44px;height:44px}.lb-code input{width:80px}}
.ptab tr.myrow td{color:var(--mint);font-weight:700}.ptab tr.myrow td:first-child{color:var(--mint)}
</style>

<script>/* ===== art: card faces and backs, felt, avatars ===== */

const $=id=>document.getElementById(id);
const reduceBase=matchMedia('(prefers-reduced-motion: reduce)').matches;let reduce=reduceBase;
/* ================= art ================= */
(function buildArt(){
  try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const im=x.createImageData(160,160);
    for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=50}
    x.putImageData(im,0,0);document.documentElement.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}
  const star=(n,r1,r2,rot=0)=>{let p=[];for(let i=0;i<n*2;i++){const a=(i*Math.PI/n)+rot,rr=i%2?r2:r1;p.push((Math.sin(a)*rr).toFixed(1)+','+(-Math.cos(a)*rr).toFixed(1))}return p.join(' ')};
  let sh=`<circle r="124" fill="none" stroke="#c9fff0" stroke-width="1.5"/><circle r="116" fill="none" stroke="#c9fff0" stroke-width=".6"/>`;
  for(let i=0;i<32;i++) sh+=`<path transform="rotate(${i*11.25})" d="M0 -84C9 -96 9 -106 0 -114C-9 -106 -9 -96 0 -84Z" fill="#c9fff0"/>`;
  sh+=`<polygon points="${star(16,82,58)}" fill="none" stroke="#c9fff0" stroke-width="1.5"/><polygon points="${star(8,56,30,Math.PI/8)}" fill="#c9fff0" opacity=".5"/>`;
  $('shamseh').innerHTML=sh;
  const star2=(n,r1,r2,cx,cy)=>{let p=[];for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?r2:r1;p.push((cx+Math.sin(a)*rr).toFixed(2)+','+(cy-Math.cos(a)*rr).toFixed(2))}return p.join(' ')};
  const curl=(x,y,sx,sy)=>`<path transform="translate(${x} ${y}) scale(${sx} ${sy})" d="M0 0C6 0 10 3 10 8C10 12 6 13 4.5 10.5C3 8 5.5 6 7 7.5M0 0C0 6 3 10 8 10" fill="none" stroke="#fff" stroke-width=".8"/>`;
  $('dynDefs').innerHTML=`<symbol id="backP" viewBox="0 0 100 140">
    <rect x=".5" y=".5" width="99" height="139" rx="6.5" fill="#fff" stroke="#cfd3d6"/>
    <rect x="6" y="6" width="88" height="128" rx="3" fill="url(#lace)"/>
    <rect x="8" y="8" width="84" height="124" rx="2" fill="none" stroke="#fff" stroke-width=".9"/>
    <rect x="10" y="10" width="80" height="120" rx="1.5" fill="none" stroke="#fff" stroke-width=".4"/>
    ${curl(11,11,1,1)}${curl(89,11,-1,1)}${curl(11,129,1,-1)}${curl(89,129,-1,-1)}
    <ellipse cx="50" cy="70" rx="21" ry="27" style="fill:var(--bc,#a8162a)" stroke="#fff" stroke-width="1.1"/>
    <ellipse cx="50" cy="70" rx="17.5" ry="23.5" fill="none" stroke="#fff" stroke-width=".45"/>
    <polygon points="${star2(8,15,7,50,70)}" fill="none" stroke="#fff" stroke-width=".8"/>
    <polygon points="${star2(8,7.5,3.6,50,70)}" fill="#fff"/>
    <circle cx="50" cy="70" r="1.6" style="fill:var(--bc,#a8162a)"/>
    <rect x=".5" y=".5" width="99" height="139" rx="6.5" fill="url(#sheen)"/></symbol>`;
})();

/* dust drifting in the light */
(function dust(){
  const cv=$('dust'),ctx=cv.getContext('2d');let W,H;const P=[];
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener('resize',size);
  for(let i=0;i<70;i++) P.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.6,vx:(Math.random()-.5)*.00012,vy:-(.00004+Math.random()*.00014),a:.15+Math.random()*.45,ph:Math.random()*6});
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx+Math.sin(t/3000+p.ph)*.00006;p.y+=p.vy;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
      const bx=(p.x-.5)/(.18+p.y*.25),beam=Math.exp(-bx*bx)*(1-p.y*.55);
      const tw=.6+.4*Math.sin(t/700+p.ph*3);
      ctx.fillStyle=`rgba(210,255,240,${(p.a*beam*tw).toFixed(3)})`;
      ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,7);ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if(!reduce) requestAnimationFrame(frame);
})();

/* ================= card faces ================= */
const SUITS=['S','H','C','D'];
const SN={S:'پیک',H:'دل',D:'خشت',C:'گشنیز'};
const RED={H:1,D:1};
const RL=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||String(r));
const pipFill=s=>RED[s]?'#d9303b':'#1c2330';
const PIPS={
  2:[[50,25],[50,115]],3:[[50,25],[50,70],[50,115]],
  4:[[30,25],[70,25],[30,115],[70,115]],5:[[30,25],[70,25],[50,70],[30,115],[70,115]],
  6:[[30,25],[70,25],[30,70],[70,70],[30,115],[70,115]],
  7:[[30,25],[70,25],[50,47],[30,70],[70,70],[30,115],[70,115]],
  8:[[30,25],[70,25],[50,47],[30,70],[70,70],[50,93],[30,115],[70,115]],
  9:[[30,25],[70,25],[30,55],[70,55],[50,70],[30,85],[70,85],[30,115],[70,115]],
  10:[[30,25],[70,25],[50,40],[30,55],[70,55],[30,85],[70,85],[50,100],[30,115],[70,115]]
};
const pip=(s,x,y,size,flip)=>{const h=size/2;return `<use href="#s${s}" x="${x-h}" y="${y-h}" width="${size}" height="${size}" fill="${pipFill(s)}"${flip?` transform="rotate(180 ${x} ${y})"`:''}/>`};
function court(r,s){
  const R='#cf2030',B='#1d4a9c',Y='#f1c232',K='#141414',SK='#f8e1c8',W='#fff',G='#2e7d4f';
  const si=SUITS.indexOf(s),c1=si%2?B:R,c2=c1===R?B:R,k2=c2===R?'R':'B';
  const o=`stroke="${K}" stroke-width=".6" stroke-linejoin="round" stroke-linecap="round"`;
  let h='';
  // attribute held, behind the figure
  if(r===13){
    h+=`<path d="M71 18.5L74 20.5L60.5 55L57.5 53.6Z" fill="#eef2f6" ${o}/><path d="M72.4 20.2L59.2 54.2" stroke="#9aa6b4" stroke-width=".5"/>`;
    h+=`<path d="M54.5 50.5L65 55.5" stroke="${K}" stroke-width="3.8" stroke-linecap="round"/><path d="M54.5 50.5L65 55.5" stroke="${Y}" stroke-width="2.5" stroke-linecap="round"/>`;
  }else if(r===12){
    h+=`<path d="M31 64C30 54 31 47 34.5 42" fill="none" stroke="${K}" stroke-width="1"/>`;
    h+=`<path d="M31.4 53c-4.2-1-6.4-4-6.4-6.2c3.2 0 6.4 2.2 6.4 6.2Z" fill="${G}" ${o}/><path d="M32.2 48.4c3-2.2 6.2-2.2 7.4-1c-2.2 2.2-4.4 2.2-7.4 1Z" fill="${G}" ${o}/>`;
    h+=`<circle cx="34.6" cy="40" r="4.4" fill="${R}" ${o}/><path d="M32 40.6q2.6-3.2 5.2 0q-2.6 2.1-5.2 0Z" fill="#ec5966" ${o}/><circle cx="34.6" cy="39.5" r="1" fill="${Y}"/>`;
  }else{
    h+=`<path d="M73 17C65 24 61 37 59.5 55L57 54C59 37 64 24 73 17Z" fill="${Y}" ${o}/>`;
    for(let i=0;i<5;i++) h+=`<path d="M${68.6-i*2.1} ${23+i*6}q4 2.6 7 .4" fill="none" ${o}/>`;
  }
  // robe
  h+=`<path d="M19 70C20 58 29 51 41 50L50 53.5L59 50C71 51 80 58 81 70Z" fill="${c1}" ${o}/>`;
  h+=`<path d="M22 67C24 59 31 54.5 40.5 53.4M78 67C76 59 69 54.5 59.5 53.4" fill="none" stroke="${Y}" stroke-width="1.5" stroke-dasharray="2 1.1"/>`;
  h+=`<path d="M42 70L43.5 54.5H56.5L58 70Z" fill="url(#broc${k2})" ${o}/><path d="M43.5 54.5L42 70M56.5 54.5L58 70" stroke="${Y}" stroke-width="1.3"/><path d="M43.5 54.5L42 70M56.5 54.5L58 70" stroke="${K}" stroke-width=".35"/>`;
  for(const x of [27,73]){
    h+=`<path d="M${x-6} 69.6L${x} 58.2L${x+6} 69.6Z" fill="${W}" ${o}/>`;
    for(const [dx,dy] of [[0,62.2],[-2.6,66.3],[2.6,66.3]]) h+=`<path d="M${x+dx} ${dy}l-.9 1.8h1.8z" fill="${K}"/>`;
  }
  // arm and hand
  const hand=r===12?[31.4,58.5]:[59,54.6];
  if(r===12) h+=`<path d="M21.5 70C23 63.5 27 59.6 31 58.4L34.6 61.5C31.2 63.5 29 66.5 28.2 70Z" fill="${c2}" ${o}/>`;
  else h+=`<path d="M78.5 70C77 63 72.5 57.8 62 55.4L59.5 58.6C66 60.5 70 64.5 71.5 70Z" fill="${c2}" ${o}/>`;
  h+=`<ellipse cx="${hand[0]}" cy="${hand[1]}" rx="2.9" ry="2.3" fill="${SK}" ${o}/>`;
  // collar
  h+=`<path d="M34 51.5Q50 62.5 66 51.5L64 57.8Q50 66.5 36 57.8Z" fill="${Y}" ${o}/>`;
  h+=`<path d="M35.6 54.4Q50 63.6 64.4 54.4" fill="none" stroke="${K}" stroke-width=".35"/>`;

function arcPath(k,n=7,r=23,c=27,gap=9){
  const a0=(k*360/n+gap/2-90)*Math.PI/180,a1=((k+1)*360/n-gap/2-90)*Math.PI/180;
  return `M${(c+r*Math.cos(a0)).toFixed(2)} ${(c+r*Math.sin(a0)).toFixed(2)}A${r} ${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(2)} ${(c+r*Math.sin(a1)).toFixed(2)}`;
}
function setRing(el,n,max,pop){
  const svg=el.firstElementChild,segs=Math.min(max,13);
  if(svg.children.length!==segs) svg.innerHTML=Array.from({length:segs},(_,k)=>`<path d="${arcPath(k,segs)}"/>`).join('');
  const on=Math.round(Math.min(n,max)/max*segs);
  [...svg.children].forEach((pa,k)=>{pa.classList.toggle('on',k<on);if(pop&&k===on-1){pa.classList.remove('pop');pa.getBoundingClientRect();pa.classList.add('pop')}});
}

/* counts the round's points up in the end-of-round dialog */
function rollScores(sides,prefix,before,after){
  sides.forEach(s=>{const el=$(prefix+s);if(el) setRoll(el,before[s])});
  sides.forEach(s=>{
    const el=$(prefix+s);if(!el||after[s]===before[s])return;
    const steps=Math.min(8,Math.abs(after[s]-before[s])),sid=T.sid;let k=0;
    const tick=()=>{if(sid!==T.sid||!el.isConnected)return;k++;setRoll(el,Math.round(before[s]+(after[s]-before[s])*k/steps));tone('tick');if(k<steps) setTimeout(tick,steps>3?160:420)};
    setTimeout(tick,800);
  });
}

/* ===== moves: card flights between any two places ===== */
const rectOf=el=>el.getBoundingClientRect();
function srcFromEl(el,o={}){return el?{r:rectOf(el),ang:o.ang||0,w:el.offsetWidth,down:!!o.down,tx:o.tx||0}:null}
function srcFromDeck(){const t=deckTop();return t?{r:rectOf(t),ang:0,w:t.offsetWidth,down:true,tx:TILT}:null}
function srcFromSpot(sp){const f=sp.querySelector('.flip');return {r:rectOf(sp),ang:+sp.dataset.rot||0,w:(f||sp).offsetWidth*(parseFloat(getComputedStyle(sp).scale)||1),down:sp.classList.contains('down'),tx:TILT}}
/* flies a floating card from a source rectangle onto an element's box */
function flyToEl(card,from,toEl,o={}){
  if(!from||!toEl||reduce) return Promise.resolve();
  const tr=rectOf(toEl),w=o.w||toEl.offsetWidth||tr.width,h=o.h||toEl.offsetHeight||tr.height;
  const fx=makeFx(w,h,card);placeFx(fx,tr.left+tr.width/2,tr.top+tr.height/2);
  const fr=from.r,fl=fx.firstChild,dx=fr.left+fr.width/2-(tr.left+tr.width/2),dy=fr.top+fr.height/2-(tr.top+tr.height/2);
  const flip=o.flip!==undefined?o.flip:(!!from.down!==!!o.down?[.12,.5]:null);
  return animateFlight(fl,{from:{x:dx,y:dy,r:from.ang||0,ry:from.down?180:0,s:(from.w||fr.width)/w,tx:from.tx||0},to:{x:0,y:0,r:o.rot||0,ry:o.down?180:0,s:1,tx:o.tx||0},
    tilt:[0,.45],bend:o.bend??(dx>0?36:-36),lift:o.lift??.14,prog:o.prog||glide,rotProg:t=>springAt(t,.7,8),flip,n:40},
    {duration:o.dur||560,fill:'forwards',shadowEls:[...fl.children]}).finished.then(()=>fx.remove(),()=>fx.remove());
}

/* ===== online: connection, the server's event queue, and helpers the online tables share ===== */
const ONLINE_WS=/*@ONLINE_WS@*/'';
const NET={ws:null,ready:false,want:false,token:null,pid:null,name:'',av:0,day:null,q:[],qw:null,me:0,n:0,room:null,start:null,
  fastLeft:0,inputId:null,thrown:null,retry:0,queue:null,pending:null,listeners:{},seatBot:[],lastPong:0};
try{NET.token=localStorage.getItem('mz_tok');NET.name=localStorage.getItem('mz_name')||'';NET.av=+(localStorage.getItem('mz_av')||0)}catch(e){}
function netUrl(){
  if(ONLINE_WS) return ONLINE_WS;
  if(/^https?:$/.test(location.protocol)&&!/github\.io$|claude\.ai$|claudeusercontent/.test(location.hostname)) return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  return '';
}
const netAvailable=()=>!!netUrl();
function netConnect(){
  NET.want=true;
  if(NET.ws&&(NET.ws.readyState===0||NET.ws.readyState===1)) return;
  const url=netUrl();if(!url){netEmit('status','none');return}
  netEmit('status','connecting');
  let ws;try{ws=new WebSocket(url)}catch(e){netEmit('status','fail');return}
  NET.ws=ws;
  ws.onopen=()=>{NET.retry=0;ws.send(JSON.stringify({t:'hello',token:NET.token,name:NET.name,av:NET.av}))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}netOnMessage(m)};
  ws.onclose=()=>{
    const was=NET.ready;NET.ready=false;NET.ws=null;netEmit('status','closed');
    if(T.online&&was) setStatus('اتصال قطع شد · دوباره وصل می‌شویم…');
    if(NET.want){const d=Math.min(10000,800*Math.pow(1.7,NET.retry++));setTimeout(()=>{if(NET.want) netConnect()},d)}
  };
}
function netSend(m){if(NET.ws&&NET.ws.readyState===1) NET.ws.send(JSON.stringify(m))}
function netOn(k,f){(NET.listeners[k]=NET.listeners[k]||[]).push(f)}
function netEmit(k,v){(NET.listeners[k]||[]).forEach(f=>{try{f(v)}catch(e){console.error(e)}})}
setInterval(()=>{if(NET.ready) netSend({t:'ping',at:Date.now()})},20000);

function netOnMessage(m){
  switch(m.t){
    case 'welcome':
      NET.ready=true;NET.pid=m.pid;NET.token=m.token;NET.name=m.name;NET.av=m.av;NET.day=m.day;NET.stats=m.stats||{};
      try{localStorage.setItem('mz_tok',m.token);localStorage.setItem('mz_name',m.name);localStorage.setItem('mz_av',m.av)}catch(e){}
      netEmit('status','ready');netEmit('me');
      // back from a lost connection: if the server no longer has our table (it restarted), leave it
      if(T.online){const sid=T.sid;clearTimeout(NET.lostT);NET.lostT=setTimeout(()=>{if(T.online&&sid===T.sid){T.online=false;goLobby();toast('ارتباط با میز قطع شد')}},4000)}
      break;
    case 'me':NET.name=m.name;NET.av=m.av;try{localStorage.setItem('mz_name',m.name);localStorage.setItem('mz_av',m.av)}catch(e){}netEmit('me');break;
    case 'room':NET.room=m;NET.queue=null;netEmit('room',m);break;
    case 'queue':NET.queue=m;netEmit('queue',m);break;
    case 'left':NET.room=null;NET.queue=null;netEmit('room',null);break;
    case 'start':netMount(m,[],null);break;
    case 'replay':netMount(m.start,m.evs,m.pending);break;
    case 'ev':
      if(m.e.t==='seat'){netSeat(m.e);break}
      netPush(m.e);break;
    case 'ask':netPush(m);break;
    case 'react':if(T.online) say(onR(m.seat),m.x);break;
    case 'kicked':NET.room=null;netEmit('room',null);if(T.online){T.online=false;goLobby()}toast(m.why==='host'?'میزبان شما را از اتاق بیرون کرد':'این حساب در صفحه‌ی دیگری باز شد');break;
    case 'err':toast({nf:'اتاقی با این کد پیدا نشد',full:'این اتاق پر است',started:'بازی این اتاق شروع شده است',game:'این بازی آنلاین نیست'}[m.code]||'خطا');netEmit('err',m);break;
    case 'lb':netEmit('lb',m);break;
    case 'daily':netEmit('daily',m);break;
    case 'pong':NET.lastPong=Date.now()-m.at;break;
  }
}

/* ---- seats: the server counts from its own seat 0, the screen counts from you ---- */
const onR=abs=>((abs-NET.me)%NET.n+NET.n)%NET.n;
const onA=rel=>(rel+NET.me)%NET.n;
/* a side (team or player) from the server's numbering to the screen's */
const onSide=s=>T.teams?(s^(NET.me%2)):onR(s);
const onSides=arr=>arr.map((_,s)=>arr[T.teams?(s^(NET.me%2)):onA(s)]);
const C=id=>{const s=id[0],r=+id.slice(1);return {s,r,id}};
const Cs=a=>(a||[]).map(C);

/* starts (or rebuilds after reconnecting) an online table */
function netMount(st,evs,pending){
  clearTimeout(NET.lostT);
  const mod=ONLINE[st.game];if(!mod){console.warn('no online module',st.game);return}
  NET.me=st.me;NET.n=st.n;NET.start=st;NET.q=[];NET.qw=null;NET.inputId=null;NET.thrown=null;
  NET.seatBot=st.seats.map(s=>s.bot);
  const names=[],chars=[];
  for(let r=0;r<st.n;r++){const s=st.seats[onA(r)];names.push(s.name);chars.push(((s.av%4)+4)%4)}
  NET.fastLeft=0;
  for(const e of evs){if(e.t==='seat') continue;if(e.t==='ask'&&e.id!==pending) e.stale=true;NET.q.push(e)}
  NET.fastLeft=NET.q.length;
  setFast(false);
  netEmit('mount',st);
  $('lobby').hidden=true;$('oroom')&&($('oroom').hidden=true);document.body.classList.add('ingame');
  mountGame(mod,{players:st.n,teams:st.teams,online:true,names,chars});
  st.seats.forEach((s,i)=>{if(!s.online&&!s.bot) netSeat({seat:i,online:false});if(s.bot) T.role[onR(i)]=T.role[onR(i)]||''});
}
function netSeat(e){
  if(!T.online)return;const r=onR(e.seat);
  if(e.bot){NET.seatBot[e.seat]=true;T.role[r]='ربات';if(r) say(r,'🤖')}
  else if(e.online===false) T.role[r]='آفلاین';
  else if(e.online) T.role[r]=defaultRole(r);
  updatePlate(r);$('seat'+r)?.querySelector('.plate')?.classList.toggle('off',e.online===false);
}

/* ---- the queue the online directors read from ---- */
function netPush(item){
  if(NET.inputId&&item.t!=='ask'){NET.inputId=null;T.cancel&&T.cancel()}
  NET.q.push(item);
  if(NET.qw){const w=NET.qw;NET.qw=null;w()}
}
function netNext(){
  setFast(NET.fastLeft>0||NET.q.filter(x=>x.t!=='ask').length>10);
  const s=T.sid;
  return waitFor(res=>{
    const take=()=>{if(s!==T.sid)return;const it=NET.q.shift();if(NET.fastLeft>0) NET.fastLeft--;res(it)};
    if(NET.q.length) take();else NET.qw=take;
  });
}
/* the next item without taking it (to see whether a round goes on or ends) */
function netPeek(){
  const s=T.sid;
  return waitFor(res=>{
    const look=()=>{if(s!==T.sid)return;res(NET.q[0])};
    if(NET.q.length) look();else NET.qw=()=>{look()};
  });
}
async function netExpect(t){
  const it=await netNext();
  if(it.t===t) return it;
  console.warn('online: expected',t,'got',it);
  netSend({t:'resync'});
  throw ABORT;
}
/* "turn" comes before every decision: lights the player up while they think */
async function netTurn(){
  const e=await netExpect('turn'),p=onR(e.seat);
  const human=!NET.seatBot[e.seat];
  const pl=$(p===0?'seat0':'seat'+p)?.querySelector('.plate');
  if(pl) pl.style.setProperty('--think',(human?(p===0?25000:22000):THINK)+'ms');
  setTurn(p,p!==0);
  return p;
}
/* shows an input for a server question; resolves CANCEL if the server answered for us (time out) */
async function netInput(a,ui){
  if(a.stale||!T.online) return CANCEL;
  NET.inputId=a.id;
  const pl=$('seat0')?.querySelector('.plate');
  if(pl){pl.classList.remove('active');void pl.offsetWidth;pl.style.setProperty('--think',a.ms+'ms');pl.classList.add('active','timed')}
  const s=T.sid,hurry=setTimeout(()=>{if(s===T.sid) pl?.classList.add('hurry')},Math.max(0,a.ms-6000));
  try{return await ui()}
  finally{clearTimeout(hurry);pl?.classList.remove('hurry','timed');if(NET.inputId===a.id) NET.inputId=null}
}
function netAnswer(a,v){if(!a.stale) netSend({t:'ans',id:a.id,v})}
/* your card: waits for the server's question, lets you play, sends the answer */
async function netMyCard(statusHtml,o={}){
  const a=await netExpect('ask');
  if(statusHtml) setStatus(statusHtml);
  const legal=Cs(a.legal);
  const r=await netInput(a,()=>pickCard(legal,{hover:o.hover,auto:()=>o.auto?o.auto(legal):legal[Math.random()*legal.length|0]}));
  if(r!==CANCEL&&r&&r.card){NET.thrown={id:r.card.id,thrown:r.thrown};netAnswer(a,r.card.id)}
  return a;
}
/* a card was played by anyone: the thrown-card source is used when it was yours */

const ONLINE={};

/* ===== Hokm: 4 players in two teams, or 2 and 3 players head to head ===== */
let H=null;
const hSide=i=>H.teams?i%2:i;
function hSort(h){const order=H&&H.trump?[H.trump,...['S','H','C','D'].filter(s=>s!==H.trump)]:['S','H','C','D'];h.sort((a,b)=>order.indexOf(a.s)-order.indexOf(b.s)||b.r-a.r)}
function hLegal(p){const h=H.hands[p];if(!H.trick.length) return h.slice();const f=h.filter(c=>c.s===H.trick[0].card.s);return f.length?f:h.slice()}
function hBeats(a,b){if(a.s===b.s) return a.r>b.r;return a.s===H.trump}
function hWinner(tr){let b=tr[0];for(const t of tr.slice(1)) if(hBeats(t.card,b.card)) b=t;return b}

/* ---- bots ---- */
function hUnseen(p){const mine=new Set(H.hands[p].map(c=>c.id));return ALL52.filter(c=>!H.gone.has(c.id)&&!mine.has(c.id)&&!H.known[p].has(c.id)&&c.id!==H.removed)}
const hMaster=(c,p)=>!hUnseen(p).some(u=>u.s===c.s&&u.r>c.r);
const hLow=cs=>cs.slice().sort((a,b)=>(a.s===H.trump)-(b.s===H.trump)||a.r-b.r)[0];
function hAiTrump(p){let best='S',bv=-1;for(const s of SUITS){const cs=H.hands[p].filter(c=>c.s===s);const v=cs.length*4+cs.reduce((t,c)=>t+Math.max(0,c.r-9),0);if(v>bv){bv=v;best=s}}return best}
function hAI(p){
  const L=hLegal(p),h=H.hands[p],Tr=H.trump,n=H.n,partner=n===4?(p+2)%4:-1;
  if(!H.trick.length){
    const tr=h.filter(c=>c.s===Tr),ut=hUnseen(p).filter(c=>c.s===Tr).length;
    if(tr.length&&ut>0&&tr.length>=ut-1){const m=tr.filter(c=>hMaster(c,p));if(m.length) return m[0]}
    const opps=[...Array(n).keys()].filter(x=>!sameSideH(x,p));
    const ms=h.filter(c=>c.s!==Tr&&hMaster(c,p)&&!opps.some(o=>H.voids[o].has(c.s)));
    if(ms.length) return ms.sort((a,b)=>b.r-a.r)[0];
    if(partner>=0){const pv=h.filter(c=>c.s!==Tr&&H.voids[partner].has(c.s)&&!H.voids[partner].has(Tr));if(pv.length) return hLow(pv)}
    const side=SUITS.filter(s=>s!==Tr).map(s=>h.filter(c=>c.s===s)).filter(a=>a.length).sort((a,b)=>b.length-a.length);
    if(side.length) return side[0].slice().sort((a,b)=>a.r-b.r)[0];
    return hLow(h);
  }
  const lead=H.trick[0].card.s,cur=hWinner(H.trick),last=H.trick.length===n-1;
  const after=[];for(let k=1;k<=n-1-H.trick.length;k++) after.push((p+k)%n);
  const oppAfter=after.filter(s=>!sameSideH(s,p));
  const wins=L.filter(c=>hBeats(c,cur.card));
  const byCost=a=>a.slice().sort((x,y)=>(x.s===Tr)-(y.s===Tr)||x.r-y.r);
  if(sameSideH(cur.seat,p)){
    const safe=last||(hMaster(cur.card,p)&&(cur.card.s===Tr||!oppAfter.some(o=>H.voids[o].has(lead)&&!H.voids[o].has(Tr))));
    if(safe) return hLow(L);

    if(wins[0].s!==lead) return byCost(wins)[0];
    if(H.trick.length>=n-2) return wins.slice().sort((a,b)=>b.r-a.r)[0];

}

async function hDealRest(deck){

  while(seq.length<n*target-5) for(let k=0;k<n;k++) for(let j=0;j<4;j++) seq.push((H.hakem+k)%n);
  const before=deck.length;

  hSort(H.hands[0]);T.hand=H.hands[0].slice();

async function hDeal2p(deck){

    }

  const lowest=(p,k)=>H.hands[p].slice().sort((a,b)=>hValue(a)-hValue(b)).slice(0,k);
  for(const [p,k] of [[H.hakem,3],[dealer,2]]){
    if(p===0){setStatus(`<b>${fa(k)} کارت</b> را برای کنار گذاشتن انتخاب کنید`);await discard(0,await selectCards({count:k,confirm:'کنار بگذار',auto:()=>lowest(0,k)}))}
    else{setTurn(p,true);setStatus(`${nameOf(p)} ${fa(k)} کارت کنار می‌گذارد`);await sleep(700);setTurn(-1);await discard(p,lowest(p,k))}
  }
  // drawing: look at the top card, keep it and throw the next away, or throw it away and keep the next
  let p=H.hakem;
  while(deck.length>=2){

    let keep;

      const peek=makeSpot(top,{cls:'peek',rot:0});center.appendChild(peek);
      await flyInto(peek,srcFromDeck(),{dur:560,ghosts:false,bump:false});
      keep=(await ask([{k:'keep',label:'نگه دار',primary:true},{k:'pass',label:'رد کن'}],{auto:hValue(top)>=8?'keep':'pass'}))==='keep';
      setTurn(-1);
      const fromPeek=srcFromSpot(peek);peek.remove();
      if(keep){H.hands[0].push(top);await intoHand(top,fromPeek);await flyToEl(null,srcFromDeck(),pileTop(pile),{down:true,tx:TILT,dur:400})}
      else{await flyToEl(top,fromPeek,pileTop(pile),{down:true,tx:TILT,dur:420});H.hands[0].push(nxt);await intoHand(nxt,srcFromDeck())}
      H.known[0].add(keep?nxt.id:top.id);
    }else{

      if(keep){await intoSeat(p,srcFromDeck());await flyToEl(null,srcFromDeck(),pileTop(pile),{down:true,tx:TILT,dur:380})}
      else{await flyToEl(null,srcFromDeck(),pileTop(pile),{down:true,tx:TILT,dur:380});await intoSeat(p,srcFromDeck())}
    }
    pileSet(pile,+pile.dataset.n+1);showDeck(deck.length);

  hSort(H.hands[0]);T.hand=H.hands[0].slice();renderHand();
}

function hReact(ws,cut){

function hEnd(total){
  const W=H.won,sides=hSides();
  if(H.n!==3){for(const s of sides) if(W[s]>=7) return {w:s,kot:sides.every(x=>x===s||W[x]===0)};return null}

  const played=W.reduce((a,b)=>a+b,0),R=total-played,max=Math.max(...W),leaders=sides.filter(s=>W[s]===max);
  if(leaders.length===1&&sides.every(s=>s===leaders[0]||W[s]+R<max)) return {w:leaders[0],kot:false};
  if(R===0){if(leaders.length===1) return {w:leaders[0],kot:false};const min=Math.min(...W);return {w:sides.find(s=>W[s]===min),kot:false}}
  return null;
}

/* ===== Pasur (chahar barg): capture cards that add up to eleven ===== */
let P=null;
const pVal=c=>c.r===14?1:c.r;                       /* ace counts one */
const pNum=c=>c.r===14||c.r<=10;
const pPts=c=>(c.r===14?1:0)+(c.r===11?1:0)+(c.id==='C2'?2:0)+(c.id==='D10'?3:0);
const pSide=i=>P.teams?i%2:i;
const pRank=c=>c.r===14?1:c.r;
function pSort(h){h.sort((a,b)=>pRank(a)-pRank(b)||SUITS.indexOf(a.s)-SUITS.indexOf(b.s))}
/* every way the played card can capture from the table (each option is a list of table cards) */
function pOptions(card,table){
  if(card.r===11){const t=table.filter(c=>c.r!==12&&c.r!==13);return t.length?[t]:[]}
  if(card.r===12||card.r===13){const m=table.filter(c=>c.r===card.r);return m.map(x=>[x])}
  const nums=table.filter(pNum),need=11-pVal(card),out=[];
  const rec=(k,sum,acc)=>{if(sum===need&&acc.length){out.push(acc.slice());}if(sum>=need||k>=nums.length)return;
    for(let j=k;j<nums.length;j++){acc.push(nums[j]);rec(j+1,sum+pVal(nums[j]),acc);acc.pop()}};
  rec(0,0,[]);return out;
}
const pWorth=cards=>cards.reduce((t,c)=>t+pPts(c)+(c.s==='C'?.42:0)+.07,0);
function pIsSur(card,opt,table){return card.r!==11&&opt.length===table.length&&!P.lastDeal}
function pSurAllowed(side){return P.scores[side]<50}
function pBest(card,table,side){
  const opts=pOptions(card,table);if(!opts.length) return null;
  let best=null,bv=-1e9;
  for(const o of opts){const v=pWorth(o.concat([card]))+(pIsSur(card,o,table)&&pSurAllowed(side)?5:0);if(v>bv){bv=v;best=o}}
  return {opt:best,v:bv};
}
/* cards this player hasn't seen: not in their hand, not on the table, not yet captured */
function pUnseen(p){
  const seen=new Set([...P.hands[p],...P.table,...P.gone].map(c=>c.id));
  return ALL52.filter(c=>!seen.has(c.id));
}
/* how much an opponent could take from a table on their next turn, roughly */
function pRisk(table,p){
  if(!table.length) return 0;
  const un=pUnseen(p),seenR=new Set();let worst=0;
  for(const c of un){const key=c.r;if(seenR.has(key))continue;seenR.add(key);
    const opts=pOptions(c,table);if(!opts.length)continue;
    let v=0;for(const o of opts) v=Math.max(v,pWorth(o.concat([c]))+(pIsSur(c,o,table)?5:0));
    const freq=un.filter(u=>u.r===c.r).length/Math.max(1,un.length);
    worst=Math.max(worst,v*Math.min(1,.35+freq*6));
  }
  return worst;
}
function pAI(p){
  const side=pSide(p);let best=null,bs=-1e9;
  for(const c of P.hands[p]){
    const b=pBest(c,P.table,side);let gain,after;
    if(b){gain=b.v;after=P.table.filter(x=>!b.opt.includes(x))}
    else{gain=-(pPts(c)*1.2+(c.s==='C'?.3:0)+(c.r===11?2.5:0));after=P.table.concat([c])}
    const sc=gain-.72*pRisk(after,p)+(c.r===11&&b&&b.opt.length<3?-1.5:0);
    if(sc>bs){bs=sc;best={card:c,opt:b?b.opt:null}}
  }
  return best;
}

async function pDeal(first){
  const n=P.n,seq=[],mine=[];
  for(let k=1;k<=n;k++) for(let j=0;j<4;j++) seq.push((P.dealer+k)%n);
  const before=P.deck.length;
  for(const p of seq){const c=P.deck.shift();P.hands[p].push(c);if(p===0) mine.push(c)}
  pSort(P.hands[0]);T.hand=P.hands[0].slice();

  setStatus(`پخش دست ${fa(P.deal)} از ${fa(P.deals)}`);

    for(;;){

      if(j>1||q>2||k>2){P.deck=shuffle(P.deck);continue}

async function pTurn(p){
  let card,thrown=null,opt=null;
  if(p===0){

    setTurn(-1);

    if(opts.length>1&&card.r!==11){
      const ranked=opts.map(o=>({o,v:pWorth(o)+(pIsSur(card,o,P.table)&&pSurAllowed(pSide(0))?5:0)})).sort((a,b)=>b.v-a.v);

  const gain=opt.concat([card]).reduce((t,c)=>t+pPts(c),0);

  }else if(card.r===11&&opt.length>=3){setFace(p,'smug');react(p,'big',.5)}
  else if(gain>=3){setFace(p,'happy');react(p,sameSide(p,0)?'win':'taunt',.4)}
  await sleep(sur?700:380);

}

/* ===== Hearts (del): avoid hearts and the queen of spades ===== */
let D=null;
const dPts=c=>c.s==='H'?1:(c.id==='S12'?13:0);
const QS='S12';

function dLegal(p){
  const h=D.hands[p],first=D.tricksPlayed===0;
  if(!D.trick.length){
    if(first) return h.filter(c=>c.id==='C2');
    if(!D.broken){const nh=h.filter(c=>c.s!=='H');if(nh.length) return nh}
    return h.slice();
  }
  const lead=D.trick[0].card.s,f=h.filter(c=>c.s===lead);

}
function dWinner(tr){const lead=tr[0].card.s;let b=tr[0];for(const t of tr) if(t.card.s===lead&&t.card.r>b.card.r) b=t;return b}
function dUnseen(p){const mine=new Set(D.hands[p].map(c=>c.id));return ALL52.filter(c=>!D.gone.has(c.id)&&!mine.has(c.id))}
/* which three cards a bot passes */
function dPassPick(p){
  const h=D.hands[p],len=s=>h.filter(c=>c.s===s).length,spades=len('S');

/* ===== Rummy: sets and runs, lay off, empty your hand ===== */
let R=null;
const rv=c=>c.r===14?1:c.r;
const rPts=c=>c.r===14?1:c.r>10?10:c.r;
const rCN=c=>kRN(c.r)+' '+SN[c.s];
function rSort(h){
  if(R&&R.byRank) h.sort((a,b)=>rv(a)-rv(b)||SUITS.indexOf(a.s)-SUITS.indexOf(b.s));
  else h.sort((a,b)=>SUITS.indexOf(a.s)-SUITS.indexOf(b.s)||rv(a)-rv(b));
}
function rIsSet(cs){return cs.length>=3&&cs.length<=4&&cs.every(c=>c.r===cs[0].r)}
function rIsRun(cs){
  if(cs.length<3||!cs.every(c=>c.s===cs[0].s)) return false;
  const v=cs.map(rv).sort((a,b)=>a-b);return v.every((x,i)=>x===v[0]+i);
}
function rCanLay(c,m){
  if(m.type==='set') return m.cards.length<4&&c.r===m.cards[0].r;
  if(c.s!==m.cards[0].s) return false;
  const v=m.cards.map(rv),lo=Math.min(...v),hi=Math.max(...v);
  return rv(c)===lo-1||rv(c)===hi+1;
}
/* every set and run hidden in a hand, then the best disjoint choice */
function rCands(h){
  const out=[],byR={};
  h.forEach(c=>(byR[c.r]=byR[c.r]||[]).push(c));
  for(const g of Object.values(byR)) if(g.length>=3){out.push(g.slice());if(g.length===4) for(let i=0;i<4;i++) out.push(g.filter((_,j)=>j!==i))}
  for(const s of SUITS){
    const cs=h.filter(c=>c.s===s).sort((a,b)=>rv(a)-rv(b));
    for(let i=0;i<cs.length;i++){const run=[cs[i]];for(let j=i+1;j<cs.length;j++){if(rv(cs[j])!==rv(run[run.length-1])+1) break;run.push(cs[j]);if(run.length>=3) out.push(run.slice())}}
  }
  return out;
}
function rBestMelds(h){
  const C=rCands(h);let best={v:0,set:[]};
  const dfs=(k,used,chosen,v)=>{
    if(v>best.v) best={v,set:chosen.slice()};
    for(let i=k;i<C.length;i++){
      if(C[i].some(c=>used.has(c.id))) continue;
      C[i].forEach(c=>used.add(c.id));chosen.push(C[i]);
      dfs(i+1,used,chosen,v+C[i].reduce((t,c)=>t+rPts(c)+1,0));
      chosen.pop();C[i].forEach(c=>used.delete(c.id));
    }
  };
  dfs(0,new Set(),[],0);return best.set;
}
const rDeadwood=h=>h.reduce((t,c)=>t+rPts(c),0);
/* how much a card is worth keeping: pairs, near-runs, and its cost if stuck in hand */
function rKeep(c,h){
  let v=-rPts(c)*.6;
  for(const x of h){if(x===c)continue;if(x.r===c.r) v+=7;if(x.s===c.s){const d=Math.abs(rv(x)-rv(c));if(d===1) v+=6;else if(d===2) v+=3}}
  if(R.melds.some(m=>rCanLay(c,m))) v+=25;
  return v;
}
function rAiDraw(p){
  const top=R.pile[R.pile.length-1];if(!top) return 'stock';
  const h=R.hands[p];
  if(rBestMelds(h.concat([top])).some(m=>m.includes(top))) return 'disc';
  if(R.melds.some(m=>rCanLay(top,m))) return 'disc';
  if(rKeep(top,h.concat([top]))>=6&&rPts(top)<=7) return 'disc';
  return R.stock.length||R.pile.length>1?'stock':'disc';
}
function rAiDiscard(p,takenId){
  const h=R.hands[p];let pool=h.filter(c=>c.id!==takenId);if(!pool.length) pool=h.slice();
  return pool.slice().sort((a,b)=>rKeep(a,h)-rKeep(b,h))[0];
}
function rAiAction(p,takenId){
  const h=R.hands[p];if(!h.length) return null;
  const best=rBestMelds(h);
  if(best.length) return {act:'meld',cards:best[0]};
  for(const c of h){const m=R.melds.find(m=>rCanLay(c,m));if(m) return {act:'lay',card:c,meld:m}}
  return {act:'discard',card:rAiDiscard(p,takenId)};
}

function rPlace(el,x,y,instant){

function rLayout(instantEl){
  if(!R)return;const c=$('center');if(!c)return;
  const W=c.clientWidth,H=c.clientHeight,tw=cssPx('--tw');
  const py=tw*.78+4;

  c.querySelectorAll('.slot.disc').forEach(s=>{s.style.left=(W/2-tw*.72)+'px';s.style.top=py+'px'});
  const top=py+tw*.78+12,avail=H-top-4,ms=R.melds;
  let mw=tw*.74,rows;
  for(let tries=0;tries<8;tries++){
    const gap=mw*.34,rowH=mw*1.4+gap*.9;rows=[[]];let x=0;
    for(const m of ms){const w=mw*(1+(m.cards.length-1)*.36);if(x&&x+gap+w>W-8){rows.push([]);x=0}rows[rows.length-1].push({m,w});x+=(x?gap:0)+w}
    if(rows.length*rowH<=avail||mw<tw*.42){

      for(const row of rows){

        for(const r of row){rPlace(r.m.el,x0+r.w/2,y,r.m.el===instantEl);x0+=r.w+gap}

    }

  }
}

async function rFlyOut(p,cards,els){

function rAct(takenId){

async function rTurn(p){
  let taken=null;
  if(p===0){
    setTurn(0);setStatus('نوبت شما · از دسته بکشید یا کارت زمین را بردارید');
    const src=await rChooseDraw();setTurn(-1);
    const c=await rDraw(0,src);if(!c) return 'stuck';if(src==='disc') taken=c.id;
    for(;;){
      setTurn(0);setStatus(R.hands[0].length===1&&R.hands[0][0].id!==taken?'آخرین کارت را دور بیندازید تا تمام کنید':'دسته رو کنید، به دسته‌های روی میز بچسبانید و در آخر یک کارت دور بیندازید');
      const a=await rAct(taken);setTurn(-1);
      if(a.act==='meld') await rMeld(0,a.cards);
      else if(a.act==='lay') await rLay(0,a.card,a.meld);
      else{await rDiscard(0,a.card);break}
      if(!R.hands[0].length) break;
    }
  }else{
    setTurn(p,true);setStatus(`${nameOf(p)} فکر می‌کند…`);await sleep(THINK);
    const src=rAiDraw(p);setTurn(-1);
    const c=await rDraw(p,src);if(!c) return 'stuck';if(src==='disc') taken=c.id;
    for(;;){
      const a=rAiAction(p,taken);if(!a) break;
      setTurn(p,true);await sleep(a.act==='discard'?520:640);setTurn(-1);
      if(a.act==='meld') await rMeld(p,a.cards);
      else if(a.act==='lay') await rLay(p,a.card,a.meld);
      else{await botLift(p);await rDiscard(p,a.card);break}
      if(!R.hands[p].length) break;
    }
  }
  if(R.hands[p].length===1){say(p,'یک کارت مانده!');if(p) setFace(p,'smug',2000)}
  return R.hands[p].length?null:'out';
}
