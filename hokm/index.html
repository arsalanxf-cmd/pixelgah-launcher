/* ===== Solitaire (Klondike): tap to auto-move, drag stacks, undo, hint ===== */
let L=null;
const sr=c=>c.r===14?1:c.r;
const sRed=c=>c.s==='H'||c.s==='D';
const lStore={get(k,d){try{const v=localStorage.getItem('mz_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mz_'+k,JSON.stringify(v))}catch(e){}}};
const lTime=s=>fa(Math.floor(s/60))+':'+fa(String(s%60).padStart(2,'0'));

/* ---- geometry ---- */
function lGeo(){
  const c=$('center'),W=c.clientWidth,H=c.clientHeight,g0=W<520?.1:.18;
  let cw=Math.min((W-12)/(7+6*g0),(H-10)/4.1);cw=Math.max(34,Math.min(116,cw));
  const g=cw*g0,ch=cw*1.4,x0=(W-(7*cw+6*g))/2,y0=4,tabY=y0+ch+Math.max(10,g*1.4);
  return {W,H,cw,ch,g,x:i=>x0+i*(cw+g),y0,tabY};
}
function lFind(c){
  if(L.stock.includes(c)) return {pile:'stock',idx:L.stock.indexOf(c)};
  if(L.waste.includes(c)) return {pile:'waste',idx:L.waste.indexOf(c)};
  for(let k=0;k<4;k++){const i=L.found[k].indexOf(c);if(i>=0) return {pile:'found',k,idx:i}}
  for(let k=0;k<7;k++){const i=L.tab[k].indexOf(c);if(i>=0) return {pile:'tab',k,idx:i}}
  return null;
}
/* puts every card where it belongs; cards in `moving` ride above the rest while they travel */
function lLayout(moving){
  if(!L||!L.els)return;
  const G=lGeo(),c=$('center');L.G=G;c.style.setProperty('--sw',G.cw.toFixed(1)+'px');
  const put=(card,x,y,z)=>{const el=L.els[card.id];if(!el)return;el.style.left=x.toFixed(1)+'px';el.style.top=y.toFixed(1)+'px';
    el.classList.toggle('up',!!card.up);el._z=z;el.style.zIndex=moving&&moving.has(card.id)?1000+z:z};
  // slots
  const slot=(id,x,y)=>{const s=$(id);if(s){s.style.left=x+'px';s.style.top=y+'px'}};
  slot('lsS',G.x(0),G.y0);slot('lsW',G.x(1),G.y0);
  for(let k=0;k<4;k++) slot('lsF'+k,G.x(3+k),G.y0);
  for(let k=0;k<7;k++) slot('lsT'+k,G.x(k),G.tabY);
  $('lsS')?.classList.toggle('empty',!L.stock.length);
  L.stock.forEach((cd,i)=>put(cd,G.x(0)-Math.min(i,24)*.12,G.y0-Math.min(i,24)*.18,10+i));
  const wn=L.waste.length,fan=L.draw===3?Math.min(3,wn):1;
  L.waste.forEach((cd,i)=>{const j=i-(wn-fan);put(cd,G.x(1)+(j>0?j*G.cw*.26:0),G.y0,100+i)});
  L.found.forEach((f,k)=>f.forEach((cd,i)=>put(cd,G.x(3+k),G.y0,200+i)));
  const avail=G.H-G.tabY-G.ch-6;
  L.tab.forEach((t,k)=>{
    const nd=t.filter(x=>!x.up).length,nu=t.length-nd;let dd=G.cw*.12,du=G.cw*(G.H/G.W>1.25?.42:.3);
    const need=nd*dd+Math.max(0,nu-1)*du;if(need>avail&&need>0){const f=avail/need;dd*=Math.max(.45,f);du*=f}
    let y=G.tabY;t.forEach((cd,i)=>{put(cd,G.x(k),y,300+i);y+=cd.up?du:dd});
  });
  if(moving&&moving.size){const s=T.sid;setTimeout(()=>{if(s!==T.sid||!L)return;for(const id of moving){const el=L.els[id];if(el&&!el.classList.contains('drag')) el.style.zIndex=el._z}},430)}
}
function lStats(){
  setRoll($('lScore'),L.score);setRoll($('lMoves'),L.moves);
  const f=L.found.reduce((t,x)=>t+x.length,0);
  const fb=$('lFound');if(fb) fb.textContent=fa(f)+' از ۵۲';
  setRing($('lbR'),f,52);setRoll($('lbN'),f);
  const auto=$('lAutoB');if(auto) auto.hidden=!(lCanAutoFinish()&&!L.won);
  const u=$('lUndoB');if(u) u.disabled=!L.hist.length||L.won;
}
function lTick(){
  const s=T.sid,go=()=>{if(s!==T.sid||!L||T.g!==Solitaire)return;if(L.t0&&!L.won){const el=$('lTime');if(el) el.textContent=lTime(Math.floor((Date.now()-L.t0)/1000))}setTimeout(go,1000)};go();
}

/* ---- rules ---- */
function lCanFound(c,k){const f=L.found[k];if(!f.length) return sr(c)===1;const t=f[f.length-1];return t.s===c.s&&sr(c)===sr(t)+1}
function lFoundFor(c){for(let k=0;k<4;k++) if(L.found[k].length&&lCanFound(c,k)) return k;for(let k=0;k<4;k++) if(lCanFound(c,k)) return k;return -1}
function lCanTab(c,k){const t=L.tab[k];if(!t.length) return sr(c)===13;const top=t[t.length-1];return top.up&&sRed(top)!==sRed(c)&&sr(top)===sr(c)+1}
function lGroup(c,loc){return loc.pile==='tab'?L.tab[loc.k].slice(loc.idx):[c]}
function lPickable(c,loc){
  if(!loc||!c.up) return false;
  if(loc.pile==='waste') return loc.idx===L.waste.length-1;
  if(loc.pile==='found') return loc.idx===L.found[loc.k].length-1;
  return loc.pile==='tab';
}
function lCanAutoFinish(){return !L.stock.length&&!L.waste.length&&L.tab.every(t=>t.every(c=>c.up))&&L.found.some(f=>f.length<13)}
function lSnap(){
  const ids=a=>a.map(c=>c.id);
  L.hist.push({stock:ids(L.stock),waste:ids(L.waste),found:L.found.map(ids),tab:L.tab.map(ids),up:Object.fromEntries(Object.values(L.cards).map(c=>[c.id,c.up])),score:L.score,moves:L.moves});
  if(L.hist.length>200) L.hist.shift();
}
function lUndo(){
  if(!L.hist.length||L.busy||L.won)return;
  const st=L.hist.pop(),C=L.cards,m=a=>a.map(i=>C[i]);
  L.stock=m(st.stock);L.waste=m(st.waste);L.found=st.found.map(m);L.tab=st.tab.map(m);
  for(const id in st.up) C[id].up=st.up[id];L.score=st.score;L.moves=st.moves;
  tone('sweep');lLayout(new Set(Object.keys(C)));lStats();setStatus('یک حرکت برگشت');
}

/* ---- moves ---- */
function lStart(){if(!L.t0) L.t0=Date.now()}
function lMove(cards,from,to,o={}){
  if(!o.noSnap) lSnap();lStart();
  const src=from.pile==='tab'?L.tab[from.k]:from.pile==='waste'?L.waste:L.found[from.k];
  src.splice(src.length-cards.length,cards.length);
  (to.pile==='tab'?L.tab[to.k]:L.found[to.k]).push(...cards);
  if(to.pile==='found') L.score+=10;
  else if(from.pile==='waste') L.score+=5;
  else if(from.pile==='found') L.score=Math.max(0,L.score-15);
  L.moves++;
  let flipped=null;
  if(from.pile==='tab'){const t=L.tab[from.k];if(t.length&&!t[t.length-1].up){flipped=t[t.length-1];flipped.up=true;L.score+=5}}
  const ids=new Set(cards.map(c=>c.id));
  lLayout(ids);
  tone('whoosh');
  const s=T.sid;
  setTimeout(()=>{if(s!==T.sid)return;tone('snap');
    cards.forEach(c=>{const el=L.els[c.id];if(el&&!reduce) el.animate([{scale:'1.06'},{scale:'1'}],{duration:260,easing:EASE_POP})});
    if(to.pile==='found'){const el=L.els[cards[0].id];if(el){sparks(el.querySelector('.scf'),10);if(L.found[to.k].length===13){bigPop(SN[cards[0].s]+' کامل شد!','us');tone('chime')}}}
  },360);
  if(flipped) setTimeout(()=>{if(s===T.sid) tone('tick')},300);
  lStats();
  if(L.found.every(f=>f.length===13)) lWin();
  return true;
}
function lDraw(){
  if(L.busy||L.won)return;
  lSnap();lStart();
  if(!L.stock.length){
    if(!L.waste.length){L.hist.pop();return}
    L.stock=L.waste.reverse();L.waste=[];L.stock.forEach(c=>c.up=false);
    L.score=Math.max(0,L.score-(L.draw===1?20:0));L.recycles++;
    tone('sweep');lLayout(new Set(L.stock.map(c=>c.id)));lStats();setStatus('کارت‌ها به دسته برگشتند');return;
  }
  const n=Math.min(L.draw,L.stock.length),drawn=L.stock.splice(L.stock.length-n,n).reverse();
  drawn.forEach(c=>c.up=true);L.waste.push(...drawn);L.moves++;
  tone('tick');lLayout(new Set(drawn.map(c=>c.id)));lStats();
}
function lTry(group,from,to){
  const c=group[0];
  if(to.pile==='found'){
    if(group.length!==1) return false;
    const k=lCanFound(c,to.k)?to.k:lFoundFor(c);if(k<0||(from.pile==='found'&&from.k===k)) return false;
    return lMove(group,from,{pile:'found',k});
  }
  if(from.pile==='tab'&&from.k===to.k) return false;
  if(!lCanTab(c,to.k)) return false;
  return lMove(group,from,to);
}
/* a tap sends the card to the most useful legal place */
function lAuto(c,loc){
  const group=lGroup(c,loc);
  if(group.length===1&&loc.pile!=='found'){const k=lFoundFor(c);if(k>=0) return lMove(group,loc,{pile:'found',k})}
  const cols=[...Array(7).keys()].filter(k=>!(loc.pile==='tab'&&k===loc.k)&&lCanTab(c,k));
  const good=cols.filter(k=>L.tab[k].length).concat(cols.filter(k=>!L.tab[k].length&&!(loc.pile==='tab'&&loc.idx===0)));
  if(good.length) return lMove(group,loc,{pile:'tab',k:good[0]});
  const el=L.els[c.id];if(el&&!reduce) el.animate([{translate:'0 0'},{translate:'-6px 0'},{translate:'5px 0'},{translate:'-3px 0'},{translate:'0 0'}],{duration:340});
  tone('tick');return false;
}
function lTargetAt(cx,cy){
  const G=L.G;let i=Math.round((cx-G.x(0)-G.cw/2)/(G.cw+G.g));i=Math.max(0,Math.min(6,i));
  if(cy<G.tabY-G.g*.3) return i>=3?{pile:'found',k:i-3}:null;
  return {pile:'tab',k:i};
}
function lDown(e,c){
  if(!L||L.busy||L.won||e.button>0)return;
  const loc=lFind(c);if(!loc)return;
  if(loc.pile==='stock'){e.preventDefault();lDraw();return}
  if(!lPickable(c,loc))return;
  e.preventDefault();
  const group=lGroup(c,loc),els=group.map(x=>L.els[x.id]),sx=e.clientX,sy=e.clientY;
  const base=els.map(el=>({l:parseFloat(el.style.left),t:parseFloat(el.style.top)}));
  let moved=false;
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved){if(Math.hypot(dx,dy)<6)return;moved=true;els.forEach((el,k)=>{el.classList.add('drag');el.style.zIndex=2000+k});tone('tick')}
    els.forEach((el,k)=>{el.style.left=(base[k].l+dx)+'px';el.style.top=(base[k].t+dy)+'px';el.style.rotate=(Math.max(-8,Math.min(8,(ev.movementX||0)*.6))).toFixed(1)+'deg'})};
  const up=()=>{
    removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    els.forEach(el=>{el.classList.remove('drag');el.style.rotate=''});
    if(!moved){lAuto(c,loc);return}
    const lead=els[0],tgt=lTargetAt(parseFloat(lead.style.left)+L.G.cw/2,parseFloat(lead.style.top)+L.G.ch/2);
    if(tgt&&lTry(group,loc,tgt))return;
    lLayout(new Set(group.map(x=>x.id)));
  };
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}

/* ---- hints and autoplay ---- */
function lFindMove(){
  const tops=[];
  if(L.waste.length) tops.push({c:L.waste[L.waste.length-1],loc:{pile:'waste',idx:L.waste.length-1}});
  L.tab.forEach((t,k)=>{if(t.length) tops.push({c:t[t.length-1],loc:{pile:'tab',k,idx:t.length-1}})});
  for(const x of tops){const k=lFoundFor(x.c);if(k>=0) return {group:[x.c],from:x.loc,to:{pile:'found',k}}}
  for(let k=0;k<7;k++){
    const t=L.tab[k],i=t.findIndex(c=>c.up);if(i<0)continue;
    if(i===0&&sr(t[0])===13)continue;
    for(let j=0;j<7;j++) if(j!==k&&lCanTab(t[i],j)&&(L.tab[j].length||i>0)) return {group:t.slice(i),from:{pile:'tab',k,idx:i},to:{pile:'tab',k:j}};
  }
  if(L.waste.length){const c=L.waste[L.waste.length-1];for(let j=0;j<7;j++) if(lCanTab(c,j)) return {group:[c],from:{pile:'waste',idx:L.waste.length-1},to:{pile:'tab',k:j}}}
  if(L.stock.length||L.waste.length) return {draw:true};
  return null;
}
function lHint(){
  if(L.won||L.busy)return;
  const m=lFindMove();
  document.querySelectorAll('.sc.hint,.sslot.hint').forEach(e=>e.classList.remove('hint'));
  if(!m){setStatus('حرکتی نمانده · بازی تازه را امتحان کنید');return}
  const mark=[];
  if(m.draw){mark.push(L.stock.length?L.els[L.stock[L.stock.length-1].id]:$('lsS'));setStatus('یک کارت از دسته بکشید')}
  else{
    m.group.forEach(c=>mark.push(L.els[c.id]));
    const tp=m.to.pile==='found'?L.found[m.to.k]:L.tab[m.to.k];
    mark.push(tp.length?L.els[tp[tp.length-1].id]:$(m.to.pile==='found'?'lsF'+m.to.k:'lsT'+m.to.k));
    setStatus(m.to.pile==='found'?'این کارت به پایه می‌رود':'این کارت‌ها را جابه‌جا کنید');
  }
  mark.forEach(e=>e&&e.classList.add('hint'));tone('tick');
  const s=T.sid;setTimeout(()=>{if(s===T.sid) mark.forEach(e=>e&&e.classList.remove('hint'))},1600);
}
async function lAutoFinish(){
  if(L.busy||L.won)return;L.busy=true;lSnap();
  try{
    while(!L.found.every(f=>f.length===13)){
      let best=null;
      L.tab.forEach((t,k)=>{if(!t.length)return;const c=t[t.length-1],f=lFoundFor(c);if(f>=0&&(!best||sr(c)<sr(best.c))) best={c,k,f}});
      if(!best) break;
      lMove([best.c],{pile:'tab',k:best.k},{pile:'found',k:best.f},{noSnap:true});
      await sleep(95);
    }
  }finally{L.busy=false}
}
async function lAutoPlay(){
  let idle=0,lastSig='';const gid=L.gid;
  while(!L.won&&L.gid===gid){
    await sleep(140);
    if(lCanAutoFinish()){await lAutoFinish();break}

    if(m.draw){lDraw();const sig=L.stock.length+'/'+L.found.map(f=>f.length).join();if(!L.stock.length){if(sig===lastSig) idle++;lastSig=sig}if(idle>2) break}
    else lMove(m.group,m.from,m.to);

}

let lDefs=null;
function lCardImg(c){
  return new Promise(res=>{
    if(!lDefs){const d=document.querySelector('svg[width="0"]');lDefs=d?d.innerHTML:''}
    const inner=cardSVG(c).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
    const src='<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 140" width="200" height="280">'+lDefs+inner+'</svg>';
    const img=new Image();img.onload=()=>res(img);img.onerror=()=>res(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  });

async function lCascade(){
  if(reduce) return;
  const cv=document.createElement('canvas');cv.className='lCascade';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  let skip=false;cv.onclick=()=>skip=true;
  const order=[];for(let r=12;r>=0;r--) for(let k=0;k<4;k++){const c=L.found[k][r];if(c) order.push(c)}
  const imgs=await Promise.all(order.map(lCardImg));
  const cw=L.G.cw,ch=L.G.ch,live=[],s0=T.sid;let next=0,last=0,t0=0;
  await new Promise(done=>{
    const step=t=>{
      if(s0!==T.sid||skip){done();return}
      if(!t0) t0=t;if(t-t0>9500){done();return}
      if(next<order.length&&t-last>130){
        const c=order[next],el=L.els[c.id],r=el.getBoundingClientRect();el.style.visibility='hidden';
        live.push({x:r.left,y:r.top,vx:(Math.random()<.5?-1:1)*(4.5+Math.random()*5),vy:-(Math.random()*8),img:imgs[next],c});next++;last=t;
      }
      for(const p of live){
        p.vy+=.55;p.x+=p.vx;p.y+=p.vy;
        if(p.y+ch>H){p.y=H-ch;p.vy*=-.72}
        if(p.img) ctx.drawImage(p.img,p.x,p.y,cw,ch);
        else{ctx.fillStyle='#fff';ctx.strokeStyle='#999';ctx.fillRect(p.x,p.y,cw,ch);ctx.strokeRect(p.x,p.y,cw,ch)}
      }
      for(let i=live.length-1;i>=0;i--) if(live[i].x<-cw-10||live[i].x>W+10) live.splice(i,1);
      if(next>=order.length&&!live.length){setTimeout(done,500);return}
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  cv.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'}).finished.then(()=>cv.remove(),()=>cv.remove());
}
async function lWin(){
  if(L.won)return;L.won=true;

}

function lSeeded(seed){
  let t=seed>>>0;const rnd=()=>{t=(t+0x6D2B79F5)>>>0;let x=Math.imul(t^(t>>>15),1|t);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296};
  const d=ALL52.map(c=>({...c}));for(let i=d.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d;
}

async function okAsk(a){

    else if(a.alt==='keep'){setStatus('کارتی که کشیدید می‌خورد · بازی‌اش کنید یا نگه دارید');o.actions=[{k:'keep',label:'نگه داشتن'}]}
    else{setStatus(kTop().r===11?`نوبت شما · خال <b>${SN[K.suit]}</b> بیاید`:`نوبت شما · خال <b>${SN[K.suit]}</b> یا <b>${kRN(kTop().r)}</b> بیاید`);o.auto=()=>{const c=kAI(0);return legal.find(x=>c&&x.id===c.id)||legal[0]}}
    const r=await netInput(a,()=>pickCard(legal,o));
    if(r===CANCEL||!r)return;
    if(r.action){netAnswer(a,r.action);return}
    NET.thrown={id:r.card.id,thrown:r.thrown};netAnswer(a,r.card.id);return;
  }
  if(a.kind==='suit'){
    setTurn(0);
    const s=await netInput(a,()=>chooseSuit('سرباز! <b>خال</b> بعدی را انتخاب کنید',()=>kSuitChoice(0)));
    setTurn(-1);if(s!==CANCEL) netAnswer(a,s);return;
  }
  if(a.kind==='target'){
    const counts=onSides(a.counts),opts=a.opts.map(onR);
    setTurn(0);
    const t=await netInput(a,()=>ask(opts.map(i=>({k:i,label:`${nameOf(i)} · ${fa(counts[i])} کارت`,primary:i===kTarget(0)})),{title:'دو! چه کسی <b>یک کارت</b> بکشد؟',auto:opts[0]}));

  }
}

      <button class="iconBtn" id="lbSnd" type="button" title="صدا" aria-label="صدا"><svg viewBox="0 0 24 24" id="lbSndIcon"></svg></button></div></header>

    <p class="lb-foot">همه‌ی بازی‌ها در برابر ربات‌ها اجرا می‌شوند. کارت را بکشید و پرت کنید یا فقط رویش بزنید.</p></div>`;
  el.querySelectorAll('.lb-tile').forEach(t=>{
    const g=GAMES.find(x=>x.id===t.dataset.id);
    t.querySelectorAll('.pchip').forEach(b=>b.onclick=()=>{t.querySelectorAll('.pchip').forEach(x=>x.classList.toggle('on',x===b));tone('tick')});
    t.querySelector('.lb-play').onclick=()=>{const on=t.querySelector('.pchip.on');startGame(g,on?+on.dataset.n:g.players[0],t)};
  });
  $('lbSnd').onclick=()=>{muted=!muted;drawSnd()};
  $('lbBack').onclick=()=>$('backBtn').click();
  drawSnd();
}
function lobbyTile(g,k){
  const cs=g.cards.map(id=>ALL52.find(c=>c.id===id));
  const fan=cs.map((c,j)=>`<div class="lc" style="--k:${(j-(cs.length-1)/2).toFixed(1)}">${cardSVG(c)}</div>`).join('');
  const chips=g.players.length>1?`<div class="pchips" role="group" aria-label="تعداد بازیکن">${g.players.map(n=>`<button type="button" class="pchip${n===g.def?' on':''}" data-n="${n}">${fa(n)} نفره${g.teamsAt===n?' · تیمی':''}</button>`).join('')}</div>`
    :`<span class="pinfo">${g.players[0]===1?'تک‌نفره':fa(g.players[0])+' نفره'}${g.teamsAt===g.players[0]?' · تیمی':''}</span>`;
  return `<article class="lb-tile${g.soon?' soon':''}" style="--d:${k*70}ms" data-id="${g.id}">
    <div class="lb-fan" aria-hidden="true">${fan}</div>
    <div class="lb-txt"><h3>${g.title}${g.tag?`<span class="tag">${g.tag}</span>`:''}</h3><p>${g.desc}</p></div>
    <div class="lb-row">${chips}<button type="button" class="lb-play"${g.soon?' disabled':''}>${g.soon?'به‌زودی':'بازی'}</button></div></article>`;
}
function startGame(g,n,tile){
  tone('snap');
  const go=()=>{$('lobby').hidden=true;document.body.classList.add('ingame');mountGame(g.mod,{players:n,teams:g.teamsAt===n})};
  if(reduce||!tile){go();return}
  tile.animate([{scale:'1'},{scale:'1.04'},{scale:'.98',opacity:.6}],{duration:260,easing:'ease-in'});
  $('lobby').animate([{opacity:1},{opacity:0}],{duration:300,delay:120,fill:'forwards'}).finished.then(()=>{$('lobby').getAnimations().forEach(a=>a.cancel());go()});
}
function goLobby(){
  abortAll();cleanupFloating();T.g=null;T.turn=-1;
  document.body.classList.remove('ingame');delete document.body.dataset.game;document.body.classList.remove('solo');
  for(const id of ['seats','center','hand','side','tbInfo','tbScore','actions','seat0']) $(id).innerHTML='';
  $('actions').hidden=true;$('turnLight').style.opacity=0;
  Object.assign($('tableTop').style,{width:'',height:'',left:'',top:'',transform:''});
  const l=$('lobby');l.hidden=false;
  if(!reduce) l.querySelectorAll('.lb-tile').forEach(t=>t.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:600,delay:parseFloat(t.style.getPropertyValue('--d'))||0,easing:EASE_SOFT,fill:'backwards'}));
}
$('homeBtn').onclick=()=>{
  if(!$('modal').hidden){goLobby();return}
  $('confirm').hidden=false;$('cfStay').focus();
};
$('cfStay').onclick=()=>{$('confirm').hidden=true};
$('cfLeave').onclick=()=>{$('confirm').hidden=true;goLobby()};
$('sndBtn').onclick=()=>{muted=!muted;drawSnd()};
const BACKS=['#a8162a','#1d3f8f'];let backI=0;
try{backI=+(localStorage.getItem('hokmBack')||0)%2}catch(e){}
function applyBack(){document.documentElement.style.setProperty('--bc',BACKS[backI])}
$('backBtn').onclick=()=>{backI=(backI+1)%2;applyBack();tone('tick');try{localStorage.setItem('hokmBack',backI)}catch(e){}};
const _drawSnd=drawSnd;
drawSnd=function(){_drawSnd();const i=$('lbSndIcon');if(i) i.innerHTML=$('sndIcon').innerHTML};

/* ===== online lobby: profile, rooms with invite codes, quick match, leaderboards ===== */
let lobbyMode='off';
try{lobbyMode=localStorage.getItem('mz_mode')==='on'?'on':'off'}catch(e){}
const onGame=id=>GAMES.find(g=>g.id===id);
const avHTML=(av,e='idle')=>{const cg=CHARS[((av%4)+4)%4].g;return `<i class="mav" style="--g1:${cg[0]};--g2:${cg[1]}">${faceSVG(((av%4)+4)%4,e)}</i>`};
const _buildLobby=buildLobby;
buildLobby=function(){_buildLobby();onDecorate()};
function onDecorate(){
  const el=$('lobby'),head=el.querySelector('.lb-head');
  const bar=document.createElement('div');bar.className='lb-modebar';
  bar.innerHTML=`<div class="lb-mode" role="tablist"><button type="button" data-m="off">با ربات</button><button type="button" data-m="on">آنلاین <i class="ndot"></i></button></div>
    <div class="lb-online">
      <button type="button" class="lb-me" id="lbMe">${avHTML(NET.av)}<span id="lbMeN">${NET.name||'نام شما'}</span></button>
      <form class="lb-code" id="lbCode"><input id="lbCodeI" maxlength="5" placeholder="کد اتاق" autocomplete="off" spellcheck="false" aria-label="کد اتاق"><button type="submit">ورود</button></form>
      <button type="button" class="lb-lbBtn" id="lbBoard">جدول امتیاز</button>
    </div>`;
  head.after(bar);
  bar.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setLobbyMode(b.dataset.m));
  $('lbMe').onclick=()=>onProfile();
  $('lbBoard').onclick=()=>onBoard();
  $('lbCode').onsubmit=e=>{e.preventDefault();const v=$('lbCodeI').value.trim().toUpperCase();if(v.length<5){toast('کد اتاق ۵ حرف است');return}onNeedName(()=>{netConnect();onWhenReady(()=>netSend({t:'join',code:v}))})};
  el.querySelectorAll('.lb-tile').forEach(t=>{
    const g=onGame(t.dataset.id);if(!g||g.soon)return;
    const row=t.querySelector('.lb-row'),box=document.createElement('div');box.className='lb-onb';
    box.innerHTML=g.id==='solitaire'?`<button type="button" class="lb-d">چالش روزانه</button>`:`<button type="button" class="lb-q">حریف تصادفی</button><button type="button" class="lb-c">ساخت اتاق</button>`;
    row.appendChild(box);
    const n=()=>{const on=t.querySelector('.pchip.on');return on?+on.dataset.n:g.players[0]};
    box.querySelector('.lb-q')?.addEventListener('click',()=>onNeedName(()=>{netConnect();onWhenReady(()=>netSend({t:'quick',game:g.id,n:n()}));onQueueShow({game:g.id,n:n(),count:1,left:25})}));
    box.querySelector('.lb-c')?.addEventListener('click',()=>onNeedName(()=>{netConnect();onWhenReady(()=>netSend({t:'create',game:g.id,n:n()}))}));
    box.querySelector('.lb-d')?.addEventListener('click',()=>onNeedName(()=>{netConnect();onWhenReady(()=>netSend({t:'daily'}));NET.wantDaily=true}));
  });
  setLobbyMode(lobbyMode,true);
}
function setLobbyMode(m,silent){
  lobbyMode=m;try{localStorage.setItem('mz_mode',m)}catch(e){}
  const el=$('lobby');el.classList.toggle('online',m==='on');
  el.querySelectorAll('.lb-mode [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const foot=el.querySelector('.lb-foot');
  if(foot) foot.textContent=m==='on'?(netAvailable()?'با دوستانتان در یک اتاق بازی کنید یا حریف تصادفی پیدا کنید. اگر جایی خالی بماند، ربات می‌نشیند.':'سرور آنلاین هنوز راه‌اندازی نشده است. فعلاً می‌توانید با ربات‌ها بازی کنید.'):'همه‌ی بازی‌ها در برابر ربات‌ها اجرا می‌شوند. کارت را بکشید و پرت کنید یا فقط رویش بزنید.';
  el.classList.toggle('noserver',m==='on'&&!netAvailable());
  if(m==='on'&&netAvailable()) netConnect();
  if(!silent) tone('tick');
}
function onWhenReady(f){if(NET.ready){f();return}const h=()=>{if(NET.ready){f();NET.listeners.status=NET.listeners.status.filter(x=>x!==h)}};netOn('status',h)}
function onNeedName(f){if(NET.name){f();return}onProfile(f)}
netOn('status',s=>{const d=document.querySelector('.lb-mode .ndot');if(d) d.className='ndot '+s});
netOn('me',()=>{const n=$('lbMeN');if(n) n.textContent=NET.name||'نام شما';const b=$('lbMe');if(b) b.querySelector('.mav').outerHTML=avHTML(NET.av)});

/* ---- one overlay for the online screens ---- */
function onOverlay(html,cls=''){
  let o=$('oroom');
  if(!o){o=document.createElement('div');o.id='oroom';o.className='modal';o.setAttribute('dir','rtl');document.body.appendChild(o)}
  // the same screen updates in place, so its entrance animation doesn't replay on every server update
  const cur=o.firstElementChild;
  if(!o.hidden&&cur&&cur.dataset.cls===cls&&cls){cur.innerHTML=html;return cur}
  o.innerHTML=`<div class="glass panel oPanel ${cls}" data-cls="${cls}">${html}</div>`;o.hidden=false;return o.firstChild;
}
function onHide(){const o=$('oroom');if(o) o.hidden=true}

function onProfile(after){
  let av=NET.av||0;
  const p=onOverlay(`<h2>نام و چهره‌ی شما</h2><p class="sub">بقیه‌ی بازیکن‌ها شما را با این نام می‌بینند.</p>
    <input class="oIn" id="pfN" maxlength="16" placeholder="مثلاً آرمان" value="${(NET.name||'').replace(/"/g,'')}">
    <div class="pfAv">${[0,1,2,3].map(i=>`<button type="button" data-av="${i}" class="${i===av?'on':''}">${avHTML(i,i===av?'happy':'idle')}</button>`).join('')}</div>
    <div class="mbtns"><button class="cta" type="button" id="pfOk">ذخیره</button><button class="cta ghostb" type="button" id="pfX">بستن</button></div>`);
  p.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{av=+b.dataset.av;p.querySelectorAll('[data-av]').forEach(x=>{const on=+x.dataset.av===av;x.classList.toggle('on',on);x.innerHTML=avHTML(+x.dataset.av,on?'happy':'idle')});tone('tick')});
  $('pfN').focus();
  const save=()=>{
    const n=$('pfN').value.replace(/[<>&"'`]/g,'').trim().slice(0,16);if(!n){shake($('pfN'));return}
    NET.name=n;NET.av=av;try{localStorage.setItem('mz_name',n);localStorage.setItem('mz_av',av)}catch(e){}
    if(NET.ready) netSend({t:'profile',name:n,av});netEmit('me');onHide();tone('snap');if(after) after();
  };
  $('pfOk').onclick=save;$('pfN').onkeydown=e=>{if(e.key==='Enter') save()};$('pfX').onclick=onHide;
}

/* ---- waiting room ---- */
function onRoomShow(m){
  if(T.online||!m){if(!m) onHide();return}
  if(m.state!=='wait'){return}
  const g=onGame(m.game),isHost=m.host===m.me,link=onInviteLink(m.code);
  const pos=POSMAP[m.n];
  const seats=m.seats.map((s,i)=>{
    const rel=((i-m.me)%m.n+m.n)%m.n,team=m.teams?(i%2===m.me%2?'us':'them'):(i===m.me?'us':'them');
    const tags=[i===m.host?'<b class="tg h">میزبان</b>':'',s&&s.bot?'<b class="tg">ربات</b>':'',s&&!s.bot&&!s.online?'<b class="tg off">آفلاین</b>':'',i===m.me?'<b class="tg me">شما</b>':''].join('');
    const kick=isHost&&s&&i!==m.me?`<button type="button" class="kx" data-kick="${i}" aria-label="بیرون کردن">×</button>`:'';
    return `<div class="oSeat ${team} p-${pos[rel]}${s?'':' empty'}">${s?avHTML(s.av,s.online?'happy':'idle'):'<i class="mav e">+</i>'}<span class="on">${s?s.name:'جای خالی'}</span><span class="tgs">${tags}</span>${kick}</div>`;
  }).join('');
  const empty=m.seats.filter(s=>!s).length;
  const p=onOverlay(`<div class="oHead"><div><small>${g?g.title:''} · ${fa(m.n)} نفره${m.teams?' · تیمی':''}</small><h2>اتاق <span class="oCode">${m.code}</span></h2></div>
      <button type="button" class="abtn" id="orCopy">کپی لینک دعوت</button></div>
    <div class="oTable n${m.n}">${seats}<div class="oFelt">${m.teams?'<span>هم‌تیمی شما روبه‌رویتان می‌نشیند</span>':''}</div></div>
    <p class="sub">${empty?`${fa(empty)} جای خالی · ${isHost?'می‌توانید منتظر دوستانتان بمانید یا جای خالی را به ربات بدهید.':'منتظر میزبان بمانید تا بازی را شروع کند.'}`:(isHost?'همه آماده‌اند.':'منتظر میزبان…')}</p>
    <div class="mbtns">${isHost?`<button class="cta" type="button" id="orStart">شروع بازی${empty?' با ربات':''}</button>${empty?'<button class="cta ghostb" type="button" id="orBot">افزودن ربات</button>':''}`:''}<button class="cta ghostb" type="button" id="orLeave">خروج از اتاق</button></div>`,'oRoom');
  $('orCopy').onclick=()=>onCopy(link,`کد اتاق: ${m.code}`);
  $('orLeave').onclick=()=>{netSend({t:'leave'});NET.room=null;onHide()};
  $('orStart')&&($('orStart').onclick=()=>{netSend({t:'start'});tone('snap')});
  $('orBot')&&($('orBot').onclick=()=>netSend({t:'addbot'}));
  p.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>netSend({t:'kick',seat:+b.dataset.kick}));
  if(T.auto&&isHost){const s=T.sid;setTimeout(()=>{if(s===T.sid&&!T.online&&NET.room&&NET.room.state==='wait'&&NET.room.seats.filter(Boolean).length>=(NET.autoStartAt||1)) netSend({t:'start'})},400)}
}
function onInviteLink(code){
  const base=/^https?:$/.test(location.protocol)?location.origin+location.pathname:'';
  return base?base+'?room='+code:code;
}
function onCopy(text,fallback){
  const done=()=>toast('لینک دعوت کپی شد');
  if(navigator.share&&/Mobi|Android/i.test(navigator.userAgent)){navigator.share({title:'میز ورق',text:fallback,url:text}).catch(()=>{});return}
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(done,()=>toast(fallback));else toast(fallback);
}
netOn('room',m=>onRoomShow(m));

/* ---- quick match ---- */
function onQueueShow(q){
  if(T.online)return;
  const g=onGame(q.game);
  onOverlay(`<div class="oSearch"><div class="radar"><i></i><i></i><i></i>${avHTML(NET.av,'think')}</div>
    <h2>در جستجوی حریف</h2><p class="sub">${g?g.title:''} · ${fa(q.n)} نفره · ${fa(q.count)} نفر در صف</p>
    <p class="oLeft">${q.left>0?`اگر کسی نیاید، تا <b>${fa(q.left)}</b> ثانیه‌ی دیگر با ربات شروع می‌کنیم`:'در حال ساختن میز…'}</p></div>
    <div class="mbtns"><button class="cta" type="button" id="oqNow">همین حالا با ربات</button><button class="cta ghostb" type="button" id="oqX">انصراف</button></div>`,'oQueue');
  NET.qAt=Date.now();NET.qLeft=q.left;
  $('oqNow').onclick=()=>netSend({t:'quicknow'});
  $('oqX').onclick=()=>{netSend({t:'unqueue'});NET.queue=null;onHide()};
}
netOn('queue',q=>onQueueShow(q));
netOn('mount',()=>onHide());

/* ---- leaderboards ---- */
const LB_GAMES=['hokm','shelem','pasur','hearts','haft','rummy','solitaire'];
function onBoard(game){
  game=game||NET.lbGame||'hokm';NET.lbGame=game;
  if(!netAvailable()){toast('سرور آنلاین هنوز راه‌اندازی نشده است');return}
  netConnect();
  onOverlay(`<h2>جدول امتیاز</h2><div class="lbTabs">${LB_GAMES.map(id=>`<button type="button" data-g="${id}" class="${id===game?'on':''}">${id==='solitaire'?'پاسیانس امروز':onGame(id).title}</button>`).join('')}</div>
    <div class="lbList" id="lbList"><p class="sub">در حال دریافت…</p></div><div class="mbtns"><button class="cta ghostb" type="button" id="lbX">بستن</button></div>`,'oBoard');
  document.querySelectorAll('.lbTabs [data-g]').forEach(b=>b.onclick=()=>onBoard(b.dataset.g));
  $('lbX').onclick=onHide;
  onWhenReady(()=>netSend(game==='solitaire'?{t:'daily'}:{t:'lb',game}));
}
function onRows(rows,cols){
  if(!rows.length) return '<p class="sub">هنوز کسی در این جدول نیست. اولین نفر باشید!</p>';
  return `<ol class="lbRows">${rows.map((r,i)=>`<li class="${r.pid===NET.pid?'myrow':''}"><span class="rk">${fa(i+1)}</span>${avHTML(r.av)}<span class="nm">${r.name}</span>${cols(r)}</li>`).join('')}</ol>`;
}
netOn('lb',m=>{const l=$('lbList');if(!l||NET.lbGame!==m.game)return;
  l.innerHTML=(m.mine?`<p class="sub">امتیاز شما: <b>${fa(m.mine.r)}</b> · ${fa(m.mine.w)} برد از ${fa(m.mine.p)} بازی</p>`:'')+onRows(m.rows,r=>`<span class="st"><b>${fa(r.r)}</b><small>${fa(r.w)} برد / ${fa(r.p)}</small></span>`)});
netOn('daily',m=>{
  NET.daily=m;
  const l=$('lbList');if(l&&NET.lbGame==='solitaire') l.innerHTML=`<p class="sub">همه امروز یک دست یکسان را بازی می‌کنند.</p>`+onRows(m.rows,r=>`<span class="st"><b>${fa(r.score)}</b><small>${lTime(r.secs)}</small></span>`);
  if(NET.wantDaily){NET.wantDaily=false;onHide();startDaily(m)}
});

/* ---- leaving an online table ---- */
$('homeBtn').onclick=()=>{
  if(!$('modal').hidden&&!T.online){goLobby();return}
  const cf=$('confirm');
  cf.querySelector('h2').textContent=T.online?'ترک میز؟':'خروج از بازی؟';
  cf.querySelector('.sub').textContent=T.online?'تا آخر این بازی یک ربات جای شما بازی می‌کند.':'این دست نیمه‌کاره می‌ماند و به منوی بازی‌ها برمی‌گردید.';
  cf.hidden=false;$('cfStay').focus();
};
$('cfLeave').onclick=()=>{$('confirm').hidden=true;if(T.online){netSend({t:'leave'});NET.room=null;T.online=false}goLobby()};

/* ---- invite links: ?room=CODE ---- */
function onBootLink(){
  const code=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  if(!code||!netAvailable())return;
  setLobbyMode('on',true);
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  onNeedName(()=>{netConnect();onWhenReady(()=>netSend({t:'join',code}))});
}
setInterval(()=>{const el=document.querySelector('.oQueue .oLeft b');if(!el||!NET.qAt)return;const left=Math.max(0,NET.qLeft-Math.floor((Date.now()-NET.qAt)/1000));el.textContent=fa(left)},500);

/* ===== boot ===== */
registerGame({id:'hokm',title:'حکم',desc:'حاکم حکم را انتخاب می‌کند و هر کس زودتر ۷ دست ببرد، دور را می‌برد. تیمی یا تک‌به‌تک.',players:[4,3,2],def:4,teamsAt:4,mod:Hokm,cards:['S14','H13','D12']});
registerGame({id:'shelem',title:'شلم',desc:'حکم با مزایده: هر تیم می‌خواند چند امتیاز می‌گیرد و آس، ده و پنج امتیاز دارند.',players:[4],teamsAt:4,mod:Shelem,cards:['S10','C14','H5'],tag:'جدید'});
registerGame({id:'pasur',title:'پاسور',desc:'چهاربرگ: با جمع یازده کارت بردار، سرباز همه را جمع می‌کند و سور پنج امتیاز دارد.',players:[2,4],def:2,teamsAt:4,mod:Pasur,cards:['C2','D10','C11'],tag:'جدید'});
registerGame({id:'hearts',title:'دل',desc:'از دل‌ها و بی‌بی پیک فرار کن. کمترین امتیاز برنده است.',players:[4],mod:Hearts,cards:['H14','S12','H2'],tag:'جدید'});
registerGame({id:'haft',title:'هفت‌خبیث',desc:'زودتر از همه دستت را خالی کن. هفت دو کارت جریمه دارد و سرباز خال را عوض می‌کند.',players:[4,3,2],def:4,mod:Haft,cards:['S7','H11','D8'],tag:'جدید'});
registerGame({id:'rummy',title:'رامی',desc:'دسته‌ی سه‌تایی و ردیف هم‌خال بساز و زودتر از همه کارت‌هایت را رو کن.',players:[2,3,4],def:2,mod:Rummy,cards:['H4','H5','H6'],tag:'جدید'});
registerGame({id:'solitaire',title:'پاسیانس',desc:'بازی تک‌نفره‌ی کلاسیک کلوندایک: همه‌ی کارت‌ها را به ترتیب روی پایه‌ها بچین.',players:[1],mod:Solitaire,cards:['D13','C12','H11'],tag:'جدید'});
applyBack();buildLobby();onBootLink();
if(location.hash==='#auto') T.auto=true;
document.fonts&&document.fonts.ready.then(()=>layout());
</script>
