<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>لانچر پیکسل‌گاه</title>
<link rel="preload" href="fonts/vazirmatn-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/noto-kufi-arabic-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@property --amb { syntax: '<color>'; inherits: true; initial-value: #F7A65A; }
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
:root {
  /* Layout: a launcher window. Icon rail docked on the right, glass command bar on top, one scrolling content canvas, a status strip at the foot. Ambient glow follows the featured item. */
  --ink-0: #05060A;
  --ink-1: #0A0C12;
  --ink-2: #0F121A;
  --ink-3: #151923;
  --ink-4: #1D2230;
  --ink-5: #283043;
  --line: #222837;
  --line-2: #323A4E;
  --fg: #F2F3F7;
  --fg-2: #B0B6C4;
  --fg-3: #8D94A5;
  --accent: #F5B83D;
  --accent-ink: #1A1305;
  --ok: #45C489;
  --bad: #FF6B5A;
  --f-display: 'Noto Kufi Arabic', 'Vazirmatn', Tahoma, sans-serif;
  --f-body: 'Vazirmatn', Tahoma, system-ui, sans-serif;
  --f-tech: 'Chakra Petch', 'Vazirmatn', ui-monospace, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --rail: 76px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; background: var(--ink-0); }
body { height: 100%; margin: 0; background: var(--ink-0); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.65; direction: rtl; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tech { font-family: var(--f-tech); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::selection { background: var(--accent); color: var(--accent-ink); }

/* ---------- shared controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 13px; font-weight: 800; font-size: 15px; cursor: pointer; white-space: nowrap; transition: transform .25s var(--ease), background .25s, box-shadow .3s, filter .2s; transform: translate(var(--tx, 0), var(--ty, 0)); }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; border-radius: 11px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn.primary:hover { filter: brightness(1.08); box-shadow: 0 14px 40px -10px color-mix(in srgb, var(--accent) 90%, transparent); }
.btn.glass { background: rgba(255, 255, 255, .1); color: #fff; backdrop-filter: blur(10px); }
.btn.glass:hover { background: rgba(255, 255, 255, .18); }
.btn.ghost { background: var(--ink-4); color: var(--fg); }
.btn.ghost:hover { background: var(--ink-5); }
.btn:active { transform: translate(var(--tx, 0), var(--ty, 0)) scale(.97); }
.btn .i { width: 18px; height: 18px; }
.ib { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--fg); cursor: pointer; transition: background .2s, transform .2s; flex: none; }
.ib:hover { background: var(--ink-4); }
.ib.glass { background: rgba(10, 12, 18, .55); backdrop-filter: blur(10px); }
.ib.glass:hover { background: rgba(10, 12, 18, .8); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--ink-3); color: var(--fg-2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s, transform .2s; }
.chip:hover { color: var(--fg); border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
kbd { font-family: var(--f-tech); font-size: 11px; font-weight: 600; color: var(--fg-2); background: var(--ink-4); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; direction: ltr; }

/* ---------- app shell ---------- */
.app {
  position: relative; height: 100%; display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "rail top" "rail main" "rail status";
  background:
    radial-gradient(1100px 620px at 68% -18%, color-mix(in srgb, var(--amb) 22%, transparent), transparent 70%),
    radial-gradient(900px 520px at 8% 112%, color-mix(in srgb, var(--amb) 11%, transparent), transparent 70%),
    var(--ink-1);
  transition: --amb 1.4s var(--ease);
  isolation: isolate;
}
.app::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(to bottom, #000, transparent 60%); }

/* rail */
.rail { grid-area: rail; position: relative; z-index: 45; width: var(--rail); }
.rail-in { position: absolute; inset-block: 0; inset-inline-start: 0; width: var(--rail); display: flex; flex-direction: column; gap: 4px; padding: 14px 12px; padding-inline-start: calc(12px + env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--ink-2) 94%, transparent); border-inline-end: 1px solid var(--line); backdrop-filter: blur(18px); overflow: hidden; transition: width .4s var(--ease), box-shadow .4s; }
@media (hover: hover) { .rail:hover .rail-in, .rail:focus-within .rail-in { width: 252px; box-shadow: -40px 0 80px rgba(0, 0, 0, .55); } }
.r-logo { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 2px; margin-bottom: 10px; border: 0; background: none; cursor: pointer; white-space: nowrap; }
.mark { width: 48px; height: 48px; flex: none; display: grid; place-items: center; }
.mark svg { width: 40px; height: 40px; }
.r-word { font-family: var(--f-display); font-weight: 800; font-size: 19px; }
.lbl { opacity: 0; transform: translateX(10px); transition: opacity .25s, transform .4s var(--ease); white-space: nowrap; }
@media (hover: hover) { .rail:hover .lbl, .rail:focus-within .lbl { opacity: 1; transform: none; } }
.r-nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.r-item { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; height: 48px; padding: 0 14px; border: 0; border-radius: 13px; background: none; color: var(--fg-3); font-size: 15px; font-weight: 600; cursor: pointer; text-align: right; white-space: nowrap; transition: color .2s, background .2s; }
.r-item:hover { color: var(--fg); background: rgba(255, 255, 255, .04); }
.r-item[aria-current="page"] { color: var(--fg); }
.r-item[aria-current="page"] .i { color: var(--accent-fg); }
.r-item .i { width: 22px; height: 22px; transition: transform .35s var(--spring); }
.r-item:hover .i { transform: scale(1.12); }
.r-badge { position: absolute; top: 6px; inset-inline-start: 30px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; box-shadow: 0 0 0 3px var(--ink-2); }
.r-badge:empty { display: none; }
.r-dot { position: absolute; top: 12px; inset-inline-start: 34px; width: 8px; height: 8px; border-radius: 4px; background: var(--ok); box-shadow: 0 0 0 3px var(--ink-2), 0 0 10px var(--ok); }
.r-pill { position: absolute; inset-inline: 0; top: 0; height: 48px; border-radius: 13px; background: var(--ink-4); box-shadow: inset 0 0 0 1px var(--line-2); transition: transform .5s var(--spring), opacity .3s; z-index: 0; }
.r-sep { height: 1px; background: var(--line); margin: 10px 6px; flex: none; }
.r-cap { display: block; font-size: 11px; font-weight: 700; color: var(--fg-3); padding: 0 6px 4px; }
.r-q { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 2px; border: 0; background: none; color: var(--fg-2); cursor: pointer; white-space: nowrap; text-align: right; border-radius: 12px; }
.r-q:hover { color: var(--fg); }
.r-q .mini { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; flex: none; position: relative; background: var(--ink-4); transition: transform .3s var(--spring); }
.r-q:hover .mini { transform: scale(1.06); }
.r-q .mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.r-q .mini .illu { inset: 8%; width: 84%; height: 84%; }
.r-q .lbl small { display: block; font-size: 11px; color: var(--ok-fg); }
.r-fill { flex: 1 1 auto; }

/* top bar */
.top { grid-area: top; position: relative; z-index: 40; display: flex; align-items: center; gap: 14px; height: 70px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--ink-1) 72%, transparent); backdrop-filter: blur(22px) saturate(1.3); }
.m-logo { display: none; }
.search { display: flex; align-items: center; gap: 10px; width: 250px; height: 44px; padding: 0 14px 0 8px; border: 1px solid var(--line); border-radius: 22px; background: var(--ink-3); color: var(--fg-3); cursor: pointer; font-size: 14px; transition: border-color .2s, background .2s, width .4s var(--ease); flex: none; }
.search:hover { border-color: var(--line-2); background: var(--ink-4); color: var(--fg-2); }
.search .s-ph { flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cats { position: relative; display: flex; align-items: stretch; gap: 2px; flex: 1 1 auto; min-width: 0; height: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: none; color: var(--fg-2); font-size: 14.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: color .2s; }
.cat .i { width: 18px; height: 18px; transition: transform .35s var(--spring), color .2s; }
.cat:hover, .cat[aria-expanded="true"], .cat.cur { color: var(--fg); }
.cat:hover .i, .cat[aria-expanded="true"] .i { transform: translateY(-2px) scale(1.1); color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); }
.cat-line { position: absolute; bottom: 0; left: 0; height: 2px; width: var(--w, 0); border-radius: 2px; background: var(--lc, var(--accent)); box-shadow: 0 0 14px var(--lc, var(--accent)); transform: translateX(var(--x, 0)); opacity: 0; transition: transform .45s var(--ease), width .45s var(--ease), opacity .25s, background .3s; }
.cat-line.on { opacity: 1; }
.acts { display: flex; align-items: center; gap: 6px; flex: none; }
.wallet { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 6px; border: 1px solid var(--line); border-radius: 22px; background: var(--ink-3); color: var(--fg); cursor: pointer; font-weight: 700; font-size: 14px; white-space: nowrap; transition: border-color .2s; }
.wallet:hover { border-color: var(--line-2); }
.wallet > .i { color: var(--accent-fg); }
.wallet small { font-size: 11px; color: var(--fg-3); font-weight: 600; }
.wallet .w-plus { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); transition: transform .35s var(--spring); }
.wallet:hover .w-plus { transform: rotate(90deg); }
.wallet .w-plus .i { width: 16px; height: 16px; stroke-width: 2.6; }
.badge { position: absolute; top: 2px; left: 2px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; line-height: 19px; text-align: center; box-shadow: 0 0 0 3px var(--ink-1); }
.badge.pop { animation: pop .45s var(--spring); }
.ib.bump { animation: cartBump .6s var(--spring); }
.dot { position: absolute; top: 10px; left: 11px; width: 9px; height: 9px; border-radius: 5px; background: var(--bad); box-shadow: 0 0 0 3px var(--ink-1); }
.dot[hidden] { display: none; }
.avatar { position: relative; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 23px; background: none; cursor: pointer; flex: none; }
.avatar svg { position: absolute; inset: 0; width: 46px; height: 46px; transform: rotate(-90deg); }
.avatar .ring-bg { stroke: var(--ink-5); }
.avatar .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.avatar span { position: absolute; inset: 6px; display: grid; place-items: center; border-radius: 50%; background: var(--ink-4); font-weight: 800; font-size: 14px; transition: transform .3s var(--spring); }
.avatar:hover span { transform: scale(1.06); }
.m-only { display: none !important; }

/* mega menu */
.mega { position: absolute; top: calc(100% + 8px); inset-inline: 14px; z-index: 60; max-height: calc(100vh - 120px); overflow: auto; border-radius: 24px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--ink-2) 92%, transparent); backdrop-filter: blur(30px) saturate(1.4); box-shadow: 0 40px 120px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .02) inset; opacity: 0; visibility: hidden; transform: translateY(-10px) scale(.985); transform-origin: top center; transition: opacity .22s, transform .35s var(--ease), visibility 0s .35s; scrollbar-width: thin; }
.mega.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.m-head { display: none; }
.m-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; padding: 26px 28px; }
.m-title { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-family: var(--f-display); font-size: 20px; font-weight: 800; }
.m-title .i { color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); width: 22px; height: 22px; }
.m-title small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--fg-3); }
.m-cols { columns: 4 170px; column-gap: 30px; }
.m-group { break-inside: avoid; display: flex; flex-direction: column; margin-bottom: 18px; }
.m-gt, .m-link { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: right; cursor: pointer; transition: color .2s, transform .3s var(--ease); }
.m-gt { min-height: 34px; color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); font-weight: 800; font-size: 14.5px; }
.m-link { min-height: 30px; color: var(--fg-2); font-size: 13.5px; font-weight: 500; }
.m-link::after, .m-gt::after { content: "←"; font-family: var(--f-tech); opacity: 0; transform: translateX(8px); transition: opacity .2s, transform .3s var(--ease); }
.m-link:hover, .m-gt:hover { color: var(--fg); transform: translateX(-4px); }
.m-link:hover::after, .m-gt:hover::after { opacity: 1; transform: none; }
.mega.open .m-gt, .mega.open .m-link { animation: linkIn .5s var(--ease) backwards; animation-delay: calc(min(var(--i), 30) * 13ms + 60ms); }
.m-stage { position: relative; min-height: 330px; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--tint) 38%, transparent), transparent 62%), var(--ink-3); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: flex-end; }
.mega.open .m-stage { animation: stageIn .7s var(--ease) backwards; }
.m-art { position: absolute; inset: 0 0 120px; }
.m-it { position: absolute; }
.m-it0 { inset-inline-start: 22%; top: 16%; width: 56%; aspect-ratio: 1; }
.m-it1 { inset-inline-end: 4%; top: 4%; width: 36%; aspect-ratio: 1; }
.m-it2 { inset-inline-start: 4%; bottom: 2%; width: 34%; aspect-ratio: 1; }
.mega.open .m-it { animation: itemIn .9s var(--spring) backwards; }
.mega.open .m-it1 { animation-delay: .08s; }
.mega.open .m-it2 { animation-delay: .16s; }
.m-cta { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; padding: 18px; background: linear-gradient(to top, rgba(5, 6, 10, .92), rgba(5, 6, 10, 0)); }
.m-cta b { font-family: var(--f-display); font-size: 17px; }
.m-cta span { font-size: 12.5px; color: var(--fg-2); line-height: 1.7; }
.m-cta .btn { align-self: flex-start; margin-top: 6px; }
.scrim { position: absolute; inset: 0; z-index: 35; background: rgba(4, 5, 8, .55); backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
.scrim.on { opacity: 1; visibility: visible; transition-delay: 0s; }

/* floors & illustrations */
.floor { position: absolute; inset-inline: -30%; bottom: -8%; height: 58%; background-image: linear-gradient(color-mix(in srgb, var(--tint) 50%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--tint) 50%, transparent) 1px, transparent 1px); background-size: 48px 48px; transform: perspective(420px) rotateX(64deg); transform-origin: bottom; mask-image: linear-gradient(to top, rgba(0, 0, 0, .7) 0%, transparent 80%); -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, .7) 0%, transparent 80%); animation: floor 2.6s linear infinite; opacity: .55; }
.illu { display: block; width: 100%; height: 100%; overflow: visible; direction: ltr; }
.alive .bob { animation: bob 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.alive .sh { animation: shad 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.m-it1 .bob, .p-it1 .bob { animation-delay: -1.8s !important; }
.m-it2 .bob, .p-it2 .bob { animation-delay: -3.4s !important; }
.m-it1 .sh, .p-it1 .sh { animation-delay: -1.8s !important; }
.m-it2 .sh, .p-it2 .sh { animation-delay: -3.4s !important; }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 1.8s linear infinite; }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
.tw { animation: twinkle 3s ease-in-out infinite; }
.tw:nth-of-type(3n) { animation-delay: -1s; }
.tw:nth-of-type(4n) { animation-delay: -2s; }

/* main canvas */
.main { grid-area: main; position: relative; z-index: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ink-5) transparent; }
.view { max-width: 1560px; margin-inline: auto; padding-block: 22px 64px; padding-left: max(clamp(16px, 2.4vw, 34px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 2.4vw, 34px), env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 60px; transition: opacity .2s, transform .25s var(--ease), filter .25s; }
.view.out { opacity: 0; transform: translateY(10px) scale(.995); filter: blur(4px); }
.view.in { animation: viewIn .6s var(--ease) backwards; }
.reveal { transition: opacity .9s var(--ease), transform 1s var(--ease); }
.reveal.armed { opacity: 0; transform: translateY(34px); }
.sec { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.sec-h { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; }
.sec-h > div:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(21px, 2vw, 27px); line-height: 1.4; text-wrap: balance; }
.sec-sub { margin: 0; color: var(--fg-3); font-size: 14px; }
.sec-act { display: flex; align-items: center; gap: 8px; }
.eyebrow { font-family: var(--f-tech); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-fg); direction: ltr; text-align: right; }

/* status strip */
.status { grid-area: status; position: relative; z-index: 2; display: flex; align-items: center; gap: 18px; height: 34px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 18px; border-top: 1px solid var(--line); background: var(--ink-2); font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; }
.st { display: flex; align-items: center; gap: 7px; }
.st .i { width: 15px; height: 15px; }
.st-live { width: 7px; height: 7px; border-radius: 4px; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: pulse 2s ease-in-out infinite; }
.st-bar { width: 90px; height: 4px; border-radius: 2px; background: var(--ink-5); overflow: hidden; }
.st-bar i { display: block; height: 100%; width: 68%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), #fff6dc, var(--accent)); background-size: 200% 100%; animation: shimmer 1.8s linear infinite; }
.st-fill { flex: 1; }
.st-btn { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: none; color: var(--fg-3); cursor: pointer; font-size: 12px; }
.st-btn:hover { background: var(--ink-4); color: var(--fg); }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; }
.stage { position: relative; height: clamp(440px, 60vh, 600px); border-radius: 26px; overflow: hidden; background: var(--ink-3); isolation: isolate; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1s var(--ease), visibility 0s 1s; }
.slide.on { opacity: 1; visibility: visible; transition-delay: 0s; z-index: 1; }
.s-bg { position: absolute; inset: 0; overflow: hidden; }
.s-bg.flip { transform: scaleX(-1); }
.layer { position: absolute; inset: -7%; transform: translate3d(calc(var(--px, 0) * var(--d) * -1px), calc(var(--py, 0) * var(--d) * -1px), 0); will-change: transform; }
.layer > .kb, .layer > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.kb > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.slide.on .kb { animation: kb 11s var(--ease) both; }
.p-glow { position: absolute; inset: 0; background: radial-gradient(60% 70% at 30% 55%, color-mix(in srgb, var(--tint) 55%, transparent), transparent 70%), radial-gradient(40% 50% at 80% 20%, color-mix(in srgb, var(--tint) 25%, transparent), transparent 70%), var(--ink-2); }
.beams { position: absolute; inset: -20%; background: conic-gradient(from 200deg at 28% -12%, transparent 0deg, color-mix(in srgb, var(--tint) 60%, transparent) 6deg, transparent 13deg, transparent 26deg, color-mix(in srgb, var(--tint) 40%, transparent) 31deg, transparent 38deg, transparent 52deg, color-mix(in srgb, var(--tint) 30%, transparent) 55deg, transparent 60deg); opacity: .32; mix-blend-mode: screen; animation: beams 9s ease-in-out infinite alternate; transform-origin: 28% 0; }
.p-hero { position: absolute; inset-inline-end: 5%; bottom: 7%; width: min(52%, 640px); aspect-ratio: 1.3; }
.p-it { position: absolute; }
.p-it0 { inset-inline-start: 20%; bottom: 0; width: 58%; aspect-ratio: 1; }
.p-it1 { inset-inline-end: 0; bottom: 4%; width: 42%; aspect-ratio: 1; }
.p-it2 { inset-inline-start: 0; top: 0; width: 34%; aspect-ratio: 1; }
.slide.on .p-it { animation: itemIn 1.2s var(--spring) backwards; animation-delay: .2s; }
.slide.on .p-it1 { animation-delay: .32s; }
.slide.on .p-it2 { animation-delay: .44s; }
.cards3 .p-it0 { transform: rotate(-7deg); }
.cards3 .p-it1 { transform: rotate(11deg); }
.cards3 .p-it2 { transform: rotate(-19deg); }
.s-scrim { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to left, rgba(5, 6, 10, .88) 0%, rgba(5, 6, 10, .45) 38%, rgba(5, 6, 10, 0) 64%), linear-gradient(to top, rgba(5, 6, 10, .8) 0%, rgba(5, 6, 10, 0) 48%); pointer-events: none; }
.s-copy { position: absolute; z-index: 5; inset-inline: clamp(20px, 4vw, 58px); bottom: clamp(24px, 4vw, 52px); max-width: 560px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.s-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; background: rgba(255, 255, 255, .12); backdrop-filter: blur(8px); color: #fff; font-size: 12.5px; font-weight: 700; }
.s-tag::before { content: ""; width: 7px; height: 7px; border-radius: 4px; background: var(--tint); box-shadow: 0 0 10px var(--tint); }
.s-title { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 4.2vw, 58px); line-height: 1.3; color: #fff; text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, .4); }
.s-title.latin { font-family: var(--f-tech); font-weight: 700; text-transform: uppercase; line-height: 1.05; letter-spacing: -.01em; text-align: right; font-size: clamp(36px, 4.8vw, 66px); }
.w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .14em; margin-bottom: -.14em; }
.w > i { display: inline-block; font-style: normal; }
.slide.on .w > i { animation: wordUp .9s var(--ease) backwards; animation-delay: calc(.18s + var(--k) * 80ms); }
.s-desc { margin: 0; max-width: 46ch; color: #E3E6EC; font-size: 15.5px; line-height: 1.95; }
.s-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.s-meta s { color: var(--fg-3); font-size: 14px; }
.s-meta b { font-size: 19px; font-weight: 800; color: #fff; }
.s-meta small { color: var(--fg-2); font-size: 13px; }
.off { display: inline-flex; padding: 2px 8px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; direction: ltr; }
.s-ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.rise { animation: none; }
.slide.on .rise { animation: rise .8s var(--ease) backwards; animation-delay: var(--dl, .3s); }
.embers { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
.s-nav { position: absolute; z-index: 6; top: 18px; left: 18px; display: flex; gap: 8px; opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .4s var(--ease); }
.stage:hover .s-nav, .stage:focus-within .s-nav { opacity: 1; transform: none; }
.s-count { position: absolute; z-index: 6; top: 22px; inset-inline-start: clamp(20px, 4vw, 58px); font-family: var(--f-tech); font-size: 13px; color: rgba(255, 255, 255, .7); direction: ltr; letter-spacing: .1em; }
.s-count b { color: #fff; }
.thumbs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.thumb { position: relative; flex: 1 1 0; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 12px; border: 0; border-radius: 16px; background: transparent; cursor: pointer; overflow: hidden; text-align: right; transition: background .3s, transform .35s var(--ease); }
.thumb:hover { background: rgba(255, 255, 255, .04); transform: translateX(-3px); }
.thumb.on { background: var(--ink-3); }
.thumb .bar { position: absolute; inset: 0; background: linear-gradient(to left, color-mix(in srgb, var(--tint) 20%, transparent), rgba(255, 255, 255, .06)); transform: scaleX(0); transform-origin: right center; pointer-events: none; }
.hero.auto .thumb.on .bar { animation: fill 7s linear forwards; }
.hero.paused .thumb.on .bar { animation-play-state: paused; }
.hero:not(.auto) .thumb.on .bar { transform: scaleX(1); opacity: .5; }
.t-mini { position: relative; width: 54px; height: 70px; flex: none; border-radius: 10px; overflow: hidden; background: var(--ink-4); transition: transform .4s var(--spring), box-shadow .3s; }
.thumb.on .t-mini { transform: scale(1.04); box-shadow: 0 0 0 2px var(--tint), 0 8px 24px -6px color-mix(in srgb, var(--tint) 70%, transparent); }
.t-mini > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.t-mini .t-ill { position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--tint) 50%, transparent), transparent 70%), var(--ink-3); }
.t-mini .t-ill .illu { position: absolute; inset: 8%; width: 84%; height: 84%; }
.t-tx { position: relative; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.t-tx b { font-size: 14.5px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-tx b.latin { font-family: var(--f-tech); text-transform: uppercase; font-size: 14px; }
.t-tx span { font-size: 12px; color: var(--fg-3); }

/* ---------- category tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; display: block; height: 214px; padding: 0; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; cursor: pointer; text-align: right; background: radial-gradient(120% 130% at 0% 100%, color-mix(in srgb, var(--tint) 42%, transparent), transparent 58%), linear-gradient(160deg, var(--ink-3), var(--ink-2)); transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transform-style: preserve-3d; transition: transform .5s var(--ease), border-color .3s, box-shadow .4s; }
.tile:hover { border-color: color-mix(in srgb, var(--tint) 50%, var(--line)); box-shadow: 0 30px 60px -30px color-mix(in srgb, var(--tint) 70%, transparent); transition: transform .15s linear, border-color .3s, box-shadow .4s; }
.tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .13), transparent 45%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.tile:hover::after { opacity: 1; }
.t-copy { position: absolute; inset-block: 22px; inset-inline-start: 22px; z-index: 2; width: 54%; display: flex; flex-direction: column; gap: 8px; transform: translateZ(30px); }
.t-k { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: color-mix(in srgb, var(--tint) 22%, var(--ink-4)); color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); }
.t-k .i { width: 22px; height: 22px; }
.t-name { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.4; }
.t-sub { font-size: 12.5px; line-height: 1.8; color: var(--fg-2); }
.t-go { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); }
.t-go .i { width: 16px; height: 16px; transition: transform .35s var(--ease); }
.tile:hover .t-go .i { transform: translateX(-5px); }
.t-art { position: absolute; inset-inline-end: -4%; bottom: -12%; width: 52%; aspect-ratio: 1; transform: translateZ(50px); transition: transform .6s var(--ease); }
.tile:hover .t-art { transform: translateZ(70px) translateY(-8px) rotate(-4deg) scale(1.05); }
.t-art2 { position: absolute; inset-inline-end: 32%; top: -8%; width: 26%; aspect-ratio: 1; opacity: .9; transform: translateZ(20px) rotate(10deg); transition: transform .6s var(--ease); }
.tile:hover .t-art2 { transform: translateZ(40px) rotate(18deg) translateY(6px); }

/* ---------- cards ---------- */
.track-wrap { position: relative; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(208px, 17vw, 244px); gap: 16px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 10px 6px 26px; margin: -10px -6px -26px; cursor: grab; }
.track::-webkit-scrollbar { display: none; }
.track.dragging { scroll-snap-type: none; cursor: grabbing; }
.track.dragging .card { pointer-events: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
.card { position: relative; scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; border-radius: 20px; background: var(--ink-3); border: 1px solid var(--line); cursor: pointer; transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0)); transition: transform .5s var(--ease), border-color .3s, box-shadow .4s; }
.card:hover { --lift: -6px; border-color: color-mix(in srgb, var(--tint) 45%, var(--line)); box-shadow: 0 26px 50px -24px color-mix(in srgb, var(--tint) 65%, transparent); transition: transform .15s linear, border-color .3s, box-shadow .4s; }
.grid .card { animation: popIn .6s var(--ease) backwards; animation-delay: calc(min(var(--i, 0), 14) * 45ms); }
.c-media { position: relative; aspect-ratio: 1 / 1; border-radius: 19px 19px 0 0; overflow: hidden; background: radial-gradient(circle at 50% 62%, color-mix(in srgb, var(--tint) 34%, transparent), transparent 66%), var(--ink-2); }
.card.is-game .c-media { aspect-ratio: 3 / 4; }
.c-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .2) 50%, transparent 62%); transform: translateX(-130%); transition: transform 0s; pointer-events: none; z-index: 3; }
.card:hover .c-media::after { transform: translateX(130%); transition: transform 1s var(--ease); }
.c-illu { position: absolute; inset: 11%; transition: transform .6s var(--ease); }
.card:hover .c-illu { transform: translateY(-6px) scale(1.07); }
.c-badges { position: absolute; z-index: 4; top: 10px; inset-inline-start: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.card.is-game .c-badges { top: 36px; }
.b-off { padding: 2px 8px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 12.5px; direction: ltr; }
.b-fast, .b-pre, .b-used { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 7px; background: rgba(5, 6, 10, .7); backdrop-filter: blur(6px); color: #fff; font-weight: 700; font-size: 11.5px; }
.b-fast .i { width: 13px; height: 13px; color: var(--accent-fg); }
.b-pre { background: color-mix(in srgb, var(--tint) 75%, #000); }
.b-used { background: #3A3F4F; }
.c-wish { position: absolute; z-index: 4; top: 8px; left: 8px; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 20px; background: rgba(5, 6, 10, .55); backdrop-filter: blur(6px); color: #fff; cursor: pointer; opacity: 0; transform: scale(.8); transition: opacity .2s, transform .3s var(--spring), color .2s; }
.card.is-game .c-wish { top: 34px; }
.card:hover .c-wish, .card:focus-within .c-wish, .c-wish.on { opacity: 1; transform: none; }
.c-wish .i { width: 18px; height: 18px; }
.c-wish.on { color: var(--bad-fg); }
.c-wish.on .i { fill: currentColor; }
.c-wish.pop .i { animation: pop .5s var(--spring); }
.c-body { display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 14px; flex: 1; }
.c-sub { font-size: 12px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; padding: 0; border: 0; background: none; text-align: right; font-size: 14.5px; font-weight: 700; line-height: 1.45; cursor: pointer; }
.card.is-game .c-name { position: absolute; width: 1px; height: 1px; min-height: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.card.is-game .c-sub { white-space: normal; }
.c-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.c-price { display: flex; flex-direction: column; min-width: 0; }
.c-price s { font-size: 12px; color: var(--fg-3); }
.c-price b { font-size: 15px; font-weight: 800; white-space: nowrap; }
.c-add { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border: 0; border-radius: 12px; background: var(--ink-5); color: var(--fg); cursor: pointer; transition: background .2s, color .2s, transform .3s var(--spring); }
.c-add:hover { background: var(--accent); color: var(--accent-ink); transform: rotate(90deg) scale(1.06); }
.c-add .i { stroke-width: 2.4; }
.c-add.done { background: var(--ok); color: #05130c; }
.cover { position: absolute; inset: 0; }
.cv-art { position: absolute; inset: 0; transition: transform .8s var(--ease); }
.cv-art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.card:hover .cv-art { transform: scale(1.08); }
.cv-band { position: absolute; z-index: 2; top: 0; inset-inline: 0; height: 26px; display: flex; align-items: center; justify-content: flex-start; padding: 0 10px; background: var(--band); color: #fff; font-family: var(--f-tech); font-weight: 700; font-size: 12px; letter-spacing: .12em; direction: ltr; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .7), transparent 45%); z-index: 1; }
.cv-title { position: absolute; z-index: 2; inset-inline: 12px; bottom: 12px; font-family: var(--f-tech); font-weight: 700; font-size: 19px; line-height: 1.05; text-transform: uppercase; color: #fff; text-align: right; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); }

/* countdown */
.cd { display: flex; align-items: center; gap: 6px; direction: ltr; font-family: var(--f-tech); }
.cd-lbl { font-family: var(--f-body); direction: rtl; font-size: 13px; color: var(--fg-3); margin-left: 8px; }
.cd-u { display: flex; gap: 2px; }
.cd-d { position: relative; display: grid; place-items: center; width: 26px; height: 36px; border-radius: 8px; background: var(--ink-4); border: 1px solid var(--line-2); font-weight: 700; font-size: 18px; overflow: hidden; }
.cd-d > span { display: block; }
.cd-s { color: var(--fg-3); font-weight: 700; }

/* tabs */
.tabs { position: relative; display: inline-flex; gap: 2px; padding: 4px; border-radius: 16px; background: var(--ink-3); border: 1px solid var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; z-index: 1; min-height: 38px; padding: 0 16px; border: 0; border-radius: 12px; background: none; color: var(--fg-2); font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: color .25s; }
.tab[aria-selected="true"] { color: var(--accent-ink); }
.tab-ind { position: absolute; top: 4px; left: 0; height: 38px; width: var(--w, 0); border-radius: 12px; background: var(--accent); transform: translateX(var(--x, 0)); transition: transform .45s var(--spring), width .45s var(--spring); }

/* club */
.club { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
.panel { position: relative; border-radius: 24px; border: 1px solid var(--line); background: var(--ink-2); padding: 26px; overflow: hidden; }
.lv { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; }
.lv-ring { position: relative; width: 96px; height: 96px; flex: none; }
.lv-ring svg { width: 96px; height: 96px; transform: rotate(-90deg); }
.lv-ring .rbg { stroke: var(--ink-5); }
.lv-ring .rfg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }
.lv-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 30px; font-weight: 900; }
.lv-ring small { position: absolute; bottom: 14px; inset-inline: 0; text-align: center; font-size: 10px; color: var(--fg-3); }
.lv-tx { display: flex; flex-direction: column; gap: 4px; flex: 1 1 260px; min-width: 0; }
.lv-tx h3 { margin: 0; font-family: var(--f-display); font-size: 21px; font-weight: 800; }
.lv-tx p { margin: 0; color: var(--fg-2); font-size: 14px; }
.lv-tx p b { color: var(--accent-fg); }
.xp { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
.xp-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-3); }
.xp-top b { color: var(--fg); font-variant-numeric: tabular-nums; }
.xp-bar { position: relative; height: 10px; border-radius: 5px; background: var(--ink-5); overflow: hidden; }
.xp-bar i { position: absolute; inset-block: 0; right: 0; width: var(--p, 0%); border-radius: 5px; background: linear-gradient(to left, var(--accent), color-mix(in srgb, var(--accent) 60%, #fff)); transition: width 1.4s var(--ease); }
.xp-bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sheen 2.6s ease-in-out infinite; }
.ach { margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ach-i { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--ink-3); border: 1px solid var(--line); overflow: hidden; }
.ach-i .ak { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 13px; background: var(--ink-5); color: var(--fg-3); }
.ach-i.got .ak { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 24px -4px var(--accent); }
.ach-i.got::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .12) 50%, transparent 60%); animation: sheenX 4s ease-in-out infinite; }
.ach-i div { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.ach-i b { font-size: 14px; }
.ach-i span { font-size: 12px; color: var(--fg-3); }
.ach-i.got span { color: var(--ok-fg); }
.mbar { height: 4px; border-radius: 2px; background: var(--ink-5); overflow: hidden; margin-top: 4px; }
.mbar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); width: var(--p); }
.wal { background: var(--accent); color: var(--accent-ink); border: 0; display: flex; flex-direction: column; gap: 10px; }
.wal::before { content: ""; position: absolute; width: 320px; height: 320px; left: -110px; bottom: -150px; border-radius: 50%; border: 44px solid rgba(0, 0, 0, .07); }
.wal::after { content: ""; position: absolute; width: 180px; height: 180px; left: 40px; top: -100px; border-radius: 50%; border: 26px solid rgba(255, 255, 255, .14); }
.wal > * { position: relative; z-index: 1; }
.wal-k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
.wal-v { font-family: var(--f-display); font-size: clamp(30px, 3vw, 40px); font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
.wal-v small { font-family: var(--f-body); font-size: 16px; font-weight: 700; }
.wal p { margin: 0; font-size: 14px; line-height: 1.85; max-width: 32ch; }
.wal .btn { align-self: flex-start; margin-top: auto; background: var(--accent-ink); color: #fff; }
.wal .btn:hover { filter: none; background: #000; }

/* builds */
.builds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.build { position: relative; display: flex; flex-direction: column; border-radius: 24px; background: var(--ink-2); border: 1px solid var(--line); overflow: hidden; transition: transform .5s var(--ease), box-shadow .4s; }
.build:hover { transform: translateY(-6px); box-shadow: 0 30px 70px -30px color-mix(in srgb, var(--tint) 70%, transparent); }
.build.feat { border-color: transparent; }

/* overlays */
.over { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-start; justify-content: center; padding: max(10vh, env(safe-area-inset-top, 0px)) 16px 16px; background: rgba(3, 4, 7, .55); backdrop-filter: blur(10px); opacity: 0; transition: opacity .25s; }

.pal { width: min(680px, 100%); border-radius: 22px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--ink-2) 96%, transparent); box-shadow: 0 50px 120px -20px rgba(0, 0, 0, .8); overflow: hidden; transform: translateY(-12px) scale(.97); transition: transform .4s var(--spring); }

.modal .m-panel { position: relative; width: min(560px, 100%); max-height: calc(100% - 4vh); overflow: auto; border-radius: 26px; border: 1px solid var(--line-2); background: var(--ink-2); box-shadow: 0 50px 120px -20px rgba(0, 0, 0, .85); transform: translateY(20px) scale(.96); opacity: 0; transition: transform .5s var(--spring), opacity .3s; }

.qv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

.m-pad { padding: 30px 28px 26px; display: flex; flex-direction: column; gap: 16px; }

.amounts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.amt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--ink-3); cursor: pointer; text-align: right; transition: border-color .2s, background .2s, transform .3s var(--spring); }

.line { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--ink-3); border: 1px solid var(--line); animation: linkIn .45s var(--ease) backwards; animation-delay: calc(var(--i) * 50ms); transition: opacity .3s, transform .3s, max-height .35s, padding .35s, margin .35s; max-height: 120px; }

.line .mini { position: relative; width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden; background: radial-gradient(circle, color-mix(in srgb, var(--tint) 45%, transparent), transparent 70%), var(--ink-4); }
