.success circle { stroke: var(--ok); stroke-width: 4; fill: none; stroke-dasharray: 290; stroke-dashoffset: 290; animation: draw .8s var(--ease) forwards; }
.success path { stroke: var(--ok); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .5s var(--ease) .6s forwards; }
.success h3 { margin: 0; font-family: var(--f-display); font-size: 21px; }
.success p { margin: 0; color: var(--fg-2); font-size: 14px; }
.xp-gain { font-family: var(--f-tech); font-size: 28px; font-weight: 700; color: var(--accent-fg); animation: rise .8s var(--spring) backwards 1s; direction: ltr; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.8; animation: popIn .4s var(--spring) backwards; }
.bub.them { align-self: flex-start; background: var(--ink-4); border-start-start-radius: 4px; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-start-end-radius: 4px; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 4px; background: var(--fg-3); animation: typing 1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
.chat-in { display: flex; flex-direction: row; align-items: center; gap: 8px; }
.chat-in .btn { width: auto; flex: none; }
.chat-in input { flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--ink-3); color: var(--fg); font: 500 14px var(--f-body); outline: none; }
.chat-in input:focus { border-color: var(--accent); }

.pop-panel { position: fixed; z-index: 95; width: 330px; max-width: calc(100vw - 24px); border-radius: 20px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--ink-2) 96%, transparent); backdrop-filter: blur(24px); box-shadow: 0 40px 100px -20px rgba(0, 0, 0, .8); opacity: 0; transform: translateY(-8px) scale(.97); transform-origin: top left; transition: opacity .2s, transform .35s var(--spring); }
.pop-panel.open { opacity: 1; transform: none; }
.pop-panel.side { transform-origin: bottom right; }
.pp-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
.pp-h b { font-family: var(--f-display); font-size: 16px; }
.pp-h button { border: 0; background: none; color: var(--accent-fg); font-size: 12.5px; cursor: pointer; }
.pp-b { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.nt { display: flex; gap: 12px; padding: 10px; border-radius: 14px; transition: background .2s; animation: linkIn .4s var(--ease) backwards; animation-delay: calc(var(--i) * 50ms); }
.nt:hover { background: var(--ink-4); }
.nt .nk { position: relative; display: grid; place-items: center; width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--ink-4); color: var(--accent-fg); }
.nt.unread .nk::after { content: ""; position: absolute; top: -2px; left: -2px; width: 10px; height: 10px; border-radius: 5px; background: var(--bad); box-shadow: 0 0 0 2px var(--ink-2); }
.nt div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nt b { font-size: 13.5px; }
.nt span { font-size: 12.5px; color: var(--fg-3); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 10px; }
.set-row > span { font-size: 14px; }
.set-row > span small { display: block; font-size: 12px; color: var(--fg-3); }
.swatches { display: flex; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 15px; border: 0; cursor: pointer; background: var(--c); box-shadow: 0 0 0 2px var(--ink-2), 0 0 0 4px transparent; transition: box-shadow .2s, transform .3s var(--spring); }
.sw:hover { transform: scale(1.12); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink-2), 0 0 0 4px var(--c); }
.tog { position: relative; width: 48px; height: 28px; flex: none; border: 0; border-radius: 14px; background: var(--ink-5); cursor: pointer; transition: background .25s; }
.tog::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; transition: transform .35s var(--spring); }
.tog[aria-checked="true"] { background: var(--accent); }
.tog[aria-checked="true"]::after { transform: translateX(-20px); }
.set-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 10px; border: 0; border-radius: 12px; background: none; color: var(--fg-2); cursor: pointer; font-size: 14px; text-align: right; }
.set-btn:hover { background: var(--ink-4); color: var(--fg); }
.prof { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 18px; }
.prof .pr-top { display: flex; align-items: center; gap: 12px; }
.prof .pr-top .avatar { pointer-events: none; }
.prof b { font-size: 15px; }
.prof span { font-size: 12.5px; color: var(--fg-3); }

.toasts { position: fixed; z-index: 120; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(48px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column-reverse; gap: 10px; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 12px; padding-inline-start: 12px; border-radius: 18px; background: color-mix(in srgb, var(--ink-4) 96%, transparent); backdrop-filter: blur(20px); border: 1px solid var(--line-2); box-shadow: 0 24px 60px -16px rgba(0, 0, 0, .7); overflow: hidden; pointer-events: auto; animation: toastIn .5s var(--spring) backwards; }
.toast.bye { animation: toastOut .35s var(--ease) forwards; }
.toast .tk { display: grid; place-items: center; width: 42px; height: 42px; flex: none; border-radius: 13px; background: var(--accent); color: var(--accent-ink); }
.toast .tk.ok { background: var(--ok); color: #05130c; }
.toast .tk.pink { background: var(--bad); color: #fff; }
.toast .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.toast .tx b { font-size: 14px; }
.toast .tx span { font-size: 12.5px; color: var(--fg-2); }
.toast .t-life { position: absolute; bottom: 0; right: 0; height: 2px; width: 100%; background: var(--accent); transform-origin: right; animation: lifeBar linear forwards; }
.toast.ach { background: linear-gradient(110deg, color-mix(in srgb, var(--accent) 22%, var(--ink-4)), var(--ink-4) 60%); }
.toast.ach::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .18) 45%, transparent 60%); animation: sheenX 2.2s ease-in-out 1 .3s backwards; }

.fly { position: fixed; z-index: 130; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 18px; pointer-events: none; display: grid; place-items: center; background: radial-gradient(circle, color-mix(in srgb, var(--tint) 60%, transparent), transparent 70%), var(--ink-4); box-shadow: 0 0 30px var(--tint); }
.fly .illu { width: 80%; height: 80%; }
.spot { position: fixed; z-index: 2; left: 0; top: 0; width: 640px; height: 640px; margin: -320px 0 0 -320px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, color-mix(in srgb, var(--amb) 12%, transparent), transparent 62%); transition: opacity .4s; mix-blend-mode: screen; opacity: 0; will-change: transform; }
.spot.on { opacity: 1; }

/* boot */
.boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: radial-gradient(60% 60% at 50% 45%, #141824 0%, var(--ink-0) 70%); transition: opacity .6s var(--ease), transform .8s var(--ease), filter .6s; }
.boot.done { opacity: 0; transform: scale(1.06); filter: blur(8px); pointer-events: none; }
.boot-core { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(320px, 80vw); }
.b-mark { position: relative; width: 84px; height: 84px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; padding: 10px; border-radius: 24px; }
.b-mark::before { content: ""; position: absolute; inset: 0; border-radius: 24px; background: var(--accent); opacity: 0; animation: markBg .5s var(--ease) .55s forwards; }
.b-mark i { position: relative; border-radius: 6px; background: var(--accent-ink); animation: bootSq .7s var(--spring) backwards; }
.b-mark i:nth-child(1) { --x: 60px; --y: -60px; animation-delay: .05s; }
.b-mark i:nth-child(2) { --x: -60px; --y: -60px; animation-delay: .14s; opacity: .4; }
.b-mark i:nth-child(3) { --x: 60px; --y: 60px; animation-delay: .23s; opacity: .4; }
.b-mark i:nth-child(4) { --x: -60px; --y: 60px; animation-delay: .32s; }
.b-mark.glow { animation: markGlow 1.6s ease-in-out infinite 1s; }
.b-word { font-family: var(--f-display); font-weight: 900; font-size: 30px; animation: bootWord .9s var(--ease) backwards .55s; }
.b-bar { width: 100%; height: 4px; border-radius: 2px; background: var(--ink-4); overflow: hidden; animation: rise .6s var(--ease) backwards .7s; }
.b-bar span { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--accent), #fff3d1); box-shadow: 0 0 14px var(--accent); }
.b-status { min-height: 22px; font-size: 13px; color: var(--fg-3); animation: rise .6s var(--ease) backwards .8s; }
.b-ver { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-family: var(--f-tech); font-size: 12px; color: var(--fg-3); letter-spacing: .14em; direction: ltr; }
.b-skip { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: calc(18px + env(safe-area-inset-left, 0px)); border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--fg-2); border-radius: 20px; min-height: 40px; padding: 0 16px; cursor: pointer; font-size: 13px; }
.b-skip:hover { color: var(--fg); }
.app.enter .rail-in { animation: enterRail .9s var(--ease) backwards .05s; }
.app.enter .top { animation: enterTop .8s var(--ease) backwards .12s; }
.app.enter .stage { animation: enterStage 1.1s var(--ease) backwards .2s; }
.app.enter .thumb { animation: linkIn .7s var(--ease) backwards; animation-delay: calc(.35s + var(--i) * 70ms); }
.app.enter .status { animation: enterBottom .7s var(--ease) backwards .4s; }
.app.enter .view > .sec:nth-child(2) { animation: rise .9s var(--ease) backwards .5s; }

/* ---------- product page ---------- */
.c-eye { position: absolute; z-index: 4; top: 56px; left: 8px; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 20px; background: rgba(5, 6, 10, .55); backdrop-filter: blur(6px); color: #fff; cursor: pointer; opacity: 0; transform: scale(.8); transition: opacity .2s .05s, transform .3s var(--spring) .05s; }
.card.is-game .c-eye { top: 82px; }
.card:hover .c-eye, .card:focus-within .c-eye { opacity: 1; transform: none; }
.c-eye .i { width: 18px; height: 18px; }
.pd-head { display: flex; flex-direction: column; gap: 10px; }
.pd-head + .pd { margin-top: -26px; }
.pd-chips { display: flex; flex-wrap: wrap; gap: 6px; animation: rise .7s var(--ease) backwards; }
.chip-s { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 10px; border-radius: 8px; background: var(--ink-3); border: 1px solid var(--line); font-size: 12px; color: var(--fg-2); font-weight: 600; }
.chip-s.brand { color: var(--fg); font-family: var(--f-tech); letter-spacing: .06em; }
.chip-s .i { width: 14px; height: 14px; color: var(--accent-fg); }
.pd-h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.5; text-wrap: balance; animation: rise .8s var(--ease) backwards .06s; }
.pd-en { font-family: var(--f-tech); font-size: 14px; color: var(--fg-3); letter-spacing: .04em; text-align: right; animation: rise .8s var(--ease) backwards .12s; }
.pd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; color: var(--fg-3); animation: rise .8s var(--ease) backwards .18s; }
.pd-meta button { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; border: 0; background: none; color: var(--fg-2); cursor: pointer; padding: 0; font-size: 13px; }
.pd-meta button:hover { color: var(--fg); }
.pd-meta b { color: var(--fg); }
.stars { display: inline-flex; gap: 1px; direction: ltr; }
.st { fill: var(--ink-5); }
.st.on { fill: var(--accent); }
.pd { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 28px; align-items: start; }
.pd-main { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
.pd-buy { position: sticky; top: 16px; animation: rise .9s var(--ease) backwards .25s; }

/* gallery */
.pd-gal { display: flex; flex-direction: column; gap: 12px; }
.pd-stage { position: relative; height: clamp(340px, 48vh, 500px); border-radius: 26px; overflow: hidden; border: 1px solid var(--line); isolation: isolate; background: radial-gradient(60% 70% at 50% 58%, color-mix(in srgb, var(--tint) 42%, transparent), transparent 70%), radial-gradient(40% 40% at 85% 10%, color-mix(in srgb, var(--tint) 18%, transparent), transparent 70%), var(--ink-2); animation: enterStage 1s var(--ease) backwards .1s; }
.pd-stage .floor { opacity: .45; }
.pd-tilt { position: absolute; inset: 0; transform: perspective(900px) rotateY(var(--gx, 0deg)) rotateX(var(--gy, 0deg)); }
.pd-obj { position: absolute; inset: 10% 25% 8%; transition: transform 1s var(--spring); }
.pd-obj.swap { animation: swapIn .75s var(--spring); }
.pd-stage[data-v="1"] .pd-obj { transform: scale(1.85) translateY(10%); }
.pd-stage[data-v="2"] .pd-obj { transform: perspective(700px) rotateY(-34deg) rotateX(14deg) scale(.96); }
.pd-stage[data-v="3"] .pd-obj { transform: perspective(700px) rotateX(58deg) scale(.95) translateY(-4%); }
.pd-stage[data-v="4"] .pd-obj { animation: turn 6s ease-in-out infinite; }
.pd-sweep { position: absolute; inset: 0; z-index: 2; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .14) 50%, transparent 60%); transform: translateX(-120%); opacity: 0; pointer-events: none; }
.pd-stage[data-v="4"] .pd-sweep { opacity: 1; animation: sheenX 3s ease-in-out infinite; }
.pd-vl { position: absolute; z-index: 4; bottom: 14px; inset-inline-start: 16px; padding: 5px 12px; border-radius: 8px; background: rgba(5, 6, 10, .6); backdrop-filter: blur(8px); font-size: 12.5px; font-weight: 700; }
.pd-hint { position: absolute; z-index: 4; top: 14px; left: 16px; display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(5, 6, 10, .5); backdrop-filter: blur(8px); font-size: 12px; color: var(--fg-2); transition: opacity .5s; }
.pd-hint .i { width: 15px; height: 15px; }
.pd-stage.touched .pd-hint { opacity: 0; }
@media (pointer: coarse) { .pd-hint { display: none; } }
.pd-thumbs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.pd-thumbs.g { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pt { position: relative; aspect-ratio: 1.35; padding: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--tint) 32%, transparent), transparent 70%), var(--ink-3); cursor: pointer; transition: border-color .2s, transform .35s var(--spring), box-shadow .3s; animation: popIn .6s var(--ease) backwards; animation-delay: calc(.3s + var(--i) * 60ms); }
.pt:hover { transform: translateY(-3px); }
.pt[aria-selected="true"] { border-color: var(--tint); box-shadow: 0 0 0 1px var(--tint), 0 12px 26px -12px color-mix(in srgb, var(--tint) 80%, transparent); }
.pt-o { position: absolute; inset: 8% 28% 24%; }
.pt.pv1 .pt-o { transform: scale(1.8) translateY(10%); }
.pt.pv2 .pt-o { transform: perspective(300px) rotateY(-34deg) rotateX(14deg); }
.pt.pv3 .pt-o { transform: perspective(300px) rotateX(58deg); }
.pt-a { position: absolute; inset: 0; }
.pt-a > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pt.gv0 .pt-a { filter: blur(2px) brightness(.55); }
.pt.gv0::before { content: ""; position: absolute; z-index: 1; top: 12%; bottom: 26%; left: 50%; aspect-ratio: 3 / 4; transform: translateX(-50%); border-radius: 4px; background: var(--tint); box-shadow: 0 6px 14px rgba(0, 0, 0, .6); }
.pt.gv2 .pt-a > svg { transform: scale(1.8); transform-origin: 35% 65%; }
.pt-cap { position: absolute; z-index: 2; inset: auto 0 0; padding: 3px 6px; background: rgba(5, 6, 10, .7); font-size: 10.5px; font-weight: 600; color: var(--fg-2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-play { position: absolute; z-index: 1; inset: 0 0 18px; display: grid; place-items: center; }
.pt-play span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; background: rgba(255, 255, 255, .9); color: #05060A; }
.pt-play .i { width: 14px; height: 14px; fill: currentColor; stroke: none; margin-right: -2px; }
.pd-stage.game { background: var(--ink-2); }
.pd-art { position: absolute; inset: 0; transition: transform 1.2s var(--ease), filter .8s; }
.pd-stage.game[data-v="0"] .pd-art { filter: blur(6px) brightness(.5); transform: scale(1.1); }
.pd-stage.game[data-v="2"] .pd-art { transform: scale(1.75); transform-origin: 35% 65%; }
.pd-stage.game[data-v="3"] .pd-art .kb { animation: kb 10s ease-in-out infinite alternate; }
.pd-cover { position: absolute; z-index: 3; top: 9%; bottom: 9%; left: 50%; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .85); transform: translateX(-50%) perspective(800px) rotateY(var(--gx, 0deg)) rotateX(var(--gy, 0deg)); opacity: 0; transition: opacity .5s; pointer-events: none; }
.pd-stage.game[data-v="0"] .pd-cover { opacity: 1; }
.pd-stage .embers { opacity: 0; transition: opacity .8s; }
.pd-stage[data-v="3"] .embers { opacity: 1; }

/* variants */
.pd-vars { display: flex; flex-direction: column; gap: 24px; }
.vg { display: flex; flex-direction: column; gap: 10px; }
.vg-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-size: 14px; }
.vg-h b { font-weight: 800; }
.vg-h span { color: var(--fg-2); }
.vg-sw { display: flex; flex-wrap: wrap; gap: 14px; padding: 4px; }
.vsw { position: relative; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: var(--c); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), 0 0 0 3px var(--ink-1), 0 0 0 5px transparent; transition: box-shadow .25s, transform .35s var(--spring); }
.vsw:hover { transform: scale(1.1); }
.vsw[aria-checked="true"] { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2), 0 0 0 3px var(--ink-1), 0 0 0 5px var(--accent); }
.vsw.out::after { content: ""; position: absolute; top: 21px; left: -3px; right: -3px; height: 2px; border-radius: 1px; background: var(--bad); transform: rotate(-45deg); }
.vg-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.vp { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; min-height: 50px; padding: 6px 16px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--ink-3); cursor: pointer; text-align: right; transition: border-color .2s, background .2s, transform .35s var(--spring); }
.vp:hover { border-color: var(--fg-3); }
.vp b { font-size: 14px; }
.vp small { font-size: 11.5px; color: var(--fg-3); }
.vp[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--ink-3)); transform: translateY(-2px); }
.vp.out { opacity: .6; }
.vp.out b { text-decoration: line-through; text-decoration-color: var(--bad); }
.vg-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.vc { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 14px 16px; padding-left: 44px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--ink-3); cursor: pointer; text-align: right; transition: border-color .2s, background .2s, transform .35s var(--spring); }
.vc:hover { border-color: var(--fg-3); }
.vc::before { content: ""; position: absolute; top: 16px; left: 16px; width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--line-2); transition: border-color .2s, box-shadow .3s var(--spring); }
.vc[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--ink-3)); }
.vc[aria-checked="true"]::before { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--ink-3), inset 0 0 0 9px var(--accent); }
.vc b { font-size: 14px; }
.vc small { font-size: 12px; color: var(--fg-3); line-height: 1.7; }
.vc .dl { font-size: 12.5px; font-weight: 700; color: var(--fg-2); }
.pd-feats { margin: 0; padding: 20px 22px; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px 22px; border-radius: 20px; background: var(--ink-2); border: 1px solid var(--line); }
.pd-feats li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg-2); line-height: 1.8; }
.pd-feats .i { width: 18px; height: 18px; color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); margin-top: 3px; }

/* in-page tabs */
.pd-tabs { position: sticky; top: 0; z-index: 6; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 6px 4px 0; margin-inline: -4px; margin-bottom: -16px; background: color-mix(in srgb, var(--ink-1) 90%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.pd-tabs::-webkit-scrollbar { display: none; }
.pd-tab { position: relative; min-height: 48px; padding: 0 14px; border: 0; background: none; color: var(--fg-3); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: color .2s; }
.pd-tab:hover, .pd-tab[aria-current="true"] { color: var(--fg); }
.pd-tab small { font-family: var(--f-body); font-size: 11px; color: var(--fg-3); margin-inline-start: 4px; }
.pd-tab-ind { position: absolute; bottom: 0; left: 0; height: 2px; width: var(--w, 0); border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); transform: translateX(var(--x, 0)); transition: transform .45s var(--ease), width .45s var(--ease); }

/* sections */
.pd-sec { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 21px; line-height: 1.5; display: flex; align-items: center; gap: 10px; }
.h3 .cnt { font-family: var(--f-body); font-size: 12.5px; font-weight: 700; color: var(--fg-3); background: var(--ink-3); padding: 2px 10px; border-radius: 10px; }
.sec-h2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.demo-chip { font-size: 11.5px; font-weight: 700; color: var(--fg-3); border: 1px dashed var(--line-2); padding: 3px 10px; border-radius: 8px; }
.hi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.hi-i { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); }
.hi-i::after { content: ""; position: absolute; width: 120px; height: 120px; top: -60px; left: -40px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--tint) 40%, transparent), transparent 70%); }
.hi-i b { position: relative; font-family: var(--f-tech); font-size: 25px; font-weight: 700; direction: ltr; text-align: right; }
.hi-i span { position: relative; font-size: 12.5px; color: var(--fg-3); }
.pd-desc { position: relative; display: flex; flex-direction: column; gap: 14px; max-width: 74ch; transition: max-height .8s var(--ease); }
.pd-desc.clip { max-height: 240px; overflow: hidden; }
.pd-desc.clip::after { content: ""; position: absolute; inset: auto 0 0; height: 100px; background: linear-gradient(to top, var(--ink-1), transparent); }
.pd-desc h3 { margin: 0; font-size: 16px; font-weight: 800; }
.pd-desc p { margin: 0; color: var(--fg-2); line-height: 2.05; font-size: 14.5px; }
.more-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0; border: 0; background: none; color: var(--accent-fg); font-weight: 700; font-size: 14px; cursor: pointer; }
.more-btn .i { width: 16px; height: 16px; transition: transform .35s var(--spring); }
.more-btn[aria-expanded="true"] .i { transform: rotate(180deg); }
.specs-t { display: flex; flex-direction: column; gap: 14px; }
.sg { border-radius: 18px; border: 1px solid var(--line); background: var(--ink-2); overflow: hidden; }
.sg h3 { margin: 0; padding: 13px 18px; font-size: 14px; font-weight: 800; background: var(--ink-3); border-bottom: 1px solid var(--line); }
.sg dl { margin: 0; display: grid; grid-template-columns: minmax(110px, 30%) minmax(0, 1fr); }
.sg dt, .sg dd { margin: 0; padding: 12px 18px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.sg dt { color: var(--fg-3); }
.sg dd { color: var(--fg); text-align: right; }
.sg dl > :nth-last-child(-n+2) { border-bottom: 0; }
.specs-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .7s var(--ease); }
.specs-more > div { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.specs-t.open .specs-more { grid-template-rows: 1fr; }
.pd-note { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-3); line-height: 1.8; }
.pd-note .i { width: 16px; height: 16px; flex: none; }
.box { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.box-i { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: var(--ink-2); border: 1px solid var(--line); font-size: 13.5px; }
.box-i .i { color: color-mix(in srgb, var(--tint) var(--tmix, 100%), #000); }
.guide { margin: 0; padding: 0; list-style: none; counter-reset: g; display: flex; flex-direction: column; gap: 10px; }
.guide li { counter-increment: g; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--ink-2); border: 1px solid var(--line); font-size: 14px; color: var(--fg-2); line-height: 1.8; }
.guide li::before { content: counter(g, persian); display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }

/* price chart */
.pc { position: relative; height: 250px; padding: 14px 12px 6px; border-radius: 20px; background: var(--ink-2); border: 1px solid var(--line); }
.pc svg { display: block; width: 100%; height: 100%; overflow: visible; direction: ltr; touch-action: pan-y; }
.pc .gl { stroke: var(--line); stroke-width: 1; }
.pc .ax { fill: var(--fg-3); font-size: 11px; font-family: var(--f-body); }
.pc .ax.end { fill: var(--fg-2); font-weight: 700; }
.pc .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pc .gd { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0; }
.pc .dot { fill: var(--accent); stroke: var(--ink-2); stroke-width: 2; }
.pc .hd { opacity: 0; }
.pc.hov .gd { opacity: .8; }
.pc.hov .hd { opacity: 1; }
.pc-tip { position: absolute; z-index: 2; top: 10px; padding: 8px 12px; border-radius: 12px; background: var(--ink-4); border: 1px solid var(--line-2); font-size: 12px; color: var(--fg-2); pointer-events: none; white-space: nowrap; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .7); }
.pc-tip b { display: block; font-size: 14px; color: var(--fg); }
.pc-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.pc-stats span { font-size: 12.5px; color: var(--fg-3); background: var(--ink-3); border: 1px solid var(--line); padding: 4px 10px; border-radius: 9px; }
.pc-stats b { color: var(--fg); margin-inline-start: 4px; }

/* bundle */
.bdl { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 18px; border-radius: 22px; background: var(--ink-2); border: 1px solid var(--line); }
.bdl-items { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1 1 440px; min-width: 0; }
.bdl-i { position: relative; display: flex; flex-direction: column; gap: 6px; width: 150px; padding: 10px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--ink-3); cursor: pointer; text-align: right; transition: opacity .3s, border-color .2s, transform .35s var(--spring); }
.bdl-i:hover { transform: translateY(-3px); }
.bdl-i[aria-disabled="true"] { cursor: default; border-color: var(--tint); }
.bdl-i[aria-pressed="false"] { opacity: .45; }
.bdl-i .bm { position: relative; display: block; aspect-ratio: 1.2; border-radius: 12px; overflow: hidden; background: radial-gradient(circle, color-mix(in srgb, var(--t) 40%, transparent), transparent 70%), var(--ink-4); }
.bdl-i .bm svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bdl-i .bm .illu { inset: 8%; width: 84%; height: 84%; }
.bdl-i b { font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.bdl-i > span:last-child { font-size: 12.5px; font-weight: 700; }
.bdl-i .ck { position: absolute; z-index: 2; top: 16px; left: 16px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); transition: background .2s, color .2s; }
.bdl-i .ck .i { width: 14px; height: 14px; stroke-width: 3; }
.bdl-i[aria-pressed="false"] .ck { background: var(--ink-5); color: transparent; }
.bdl-plus { color: var(--fg-3); }
.bdl-sum { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; flex: 0 1 230px; }
.bdl-sum > span { font-size: 13px; color: var(--fg-3); }
.bdl-sum s { margin-inline-start: 4px; }
.bdl-sum b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.bdl-sum small { color: var(--ok-fg); font-size: 12.5px; min-height: 1.6em; }
.bdl-sum .btn { margin-top: 8px; }

/* reviews */
.rv { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
.rv-sum { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 22px; background: var(--ink-2); border: 1px solid var(--line); }
.rv-big { font-family: var(--f-display); font-size: 52px; font-weight: 900; line-height: 1.15; }
.rv-n { font-size: 13px; color: var(--fg-3); }
.rv-bars { display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
.rb { display: grid; grid-template-columns: 14px minmax(0, 1fr) 40px; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); }
.rb-t { height: 6px; border-radius: 3px; background: var(--ink-5); overflow: hidden; }
.rb-t i { display: block; height: 100%; width: var(--w); border-radius: 3px; background: var(--accent); transition: width 1.2s var(--ease); }
.rv-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rvc { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: var(--ink-2); border: 1px solid var(--line); }
.rvc.new { animation: popIn .6s var(--spring) backwards; border-color: var(--accent); }
.rvc-h { display: flex; align-items: center; gap: 12px; }
.rvc-a { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 20px; background: color-mix(in srgb, var(--tint) 30%, var(--ink-4)); font-weight: 800; }
.rvc-h > div { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.rvc-h b { font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.rvc-h b .i { width: 15px; height: 15px; color: var(--ok-fg); }
.rvc-h span { font-size: 12px; color: var(--fg-3); }
.rvc-v { font-size: 12px; color: var(--fg-3); }
.rvc p { margin: 0; font-size: 14px; line-height: 1.95; color: var(--fg-2); }
.pcl { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--fg-2); }
.pcl li { display: flex; align-items: center; gap: 6px; }
.pcl .i { width: 15px; height: 15px; }
.pcl .pro .i { color: var(--ok-fg); }
.pcl .con .i { color: var(--bad-fg); }
.help { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: none; color: var(--fg-3); font-size: 12.5px; cursor: pointer; transition: color .2s, border-color .2s; }
.help:hover { color: var(--fg); }
.help.on { color: var(--accent-fg); border-color: var(--accent); }
.help.on .i { animation: pop .45s var(--spring); }
.help .i { width: 15px; height: 15px; }
.rv-form { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--ink-2)); animation: popIn .45s var(--ease) backwards; }
.rv-form label { font-size: 13px; font-weight: 700; }
.rv-form textarea { min-height: 100px; resize: vertical; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--ink-3); color: var(--fg); font: 500 14px/1.8 var(--f-body); outline: none; }
.rv-form textarea:focus { border-color: var(--accent); }
.rv-err { font-size: 12.5px; color: var(--bad-fg); min-height: 1.4em; }
.rate-in { display: flex; align-items: center; gap: 2px; direction: ltr; justify-content: flex-end; }
.rate-in button { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; }
.rate-in svg { width: 28px; height: 28px; fill: var(--ink-5); transition: fill .15s, transform .3s var(--spring); }
.rate-in button.on svg { fill: var(--accent); }
.rate-in button:hover svg { transform: scale(1.15); }
.rv-form-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* q&a */
.qa-ask { display: flex; gap: 8px; }
.qa-ask input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--ink-3); color: var(--fg); font: 500 14px var(--f-body); outline: none; }
.qa-ask input:focus { border-color: var(--accent); }
.qa-list { display: flex; flex-direction: column; gap: 10px; }
.qa { border-radius: 18px; background: var(--ink-2); border: 1px solid var(--line); overflow: hidden; transition: border-color .2s; }
.qa.open { border-color: var(--line-2); }
.qa.new { animation: popIn .5s var(--spring) backwards; }
.qa-q { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 18px; border: 0; background: none; color: var(--fg); font-size: 14px; font-weight: 700; cursor: pointer; text-align: right; line-height: 1.7; }
.qa-q .qk { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 9px; background: var(--ink-4); color: var(--accent-fg); font-family: var(--f-tech); font-size: 13px; }
.qa-q .chev { margin-inline-start: auto; color: var(--fg-3); transition: transform .4s var(--spring); }
.qa.open .chev { transform: rotate(-90deg); }
.qa-a { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
.qa.open .qa-a { grid-template-rows: 1fr; }
.qa-a > div { overflow: hidden; min-height: 0; }
.qa-a p { margin: 0; padding-inline: 58px 18px; font-size: 14px; line-height: 1.95; color: var(--fg-2); }
.qa-a span { display: block; padding: 4px 58px 16px 18px; padding-inline: 58px 18px; padding-bottom: 16px; font-size: 12px; color: var(--ok-fg); }
.qa-a span.wait { color: var(--fg-3); }

/* buy panel */
.pb { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 24px; background: color-mix(in srgb, var(--ink-2) 95%, transparent); border: 1px solid var(--line-2); box-shadow: 0 30px 80px -40px color-mix(in srgb, var(--tint) 70%, transparent); }
.pb-sel { font-size: 12.5px; color: var(--fg-3); line-height: 1.8; }
.pb-sel:empty { display: none; }
.pb-stock { display: inline-flex; align-items: center; gap: 9px; align-self: flex-start; padding: 5px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--ok-fg); background: color-mix(in srgb, var(--ok) 14%, transparent); transition: color .3s, background .3s; }
.pb-stock i { width: 8px; height: 8px; border-radius: 4px; background: currentColor; animation: dotPulse 1.8s ease-out infinite; }
.pb-stock.low { color: var(--accent-fg); background: color-mix(in srgb, var(--accent) 15%, transparent); }
.pb-stock.out { color: var(--bad-fg); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pb-price { display: flex; flex-direction: column; gap: 2px; }
.pb-old { display: flex; align-items: center; gap: 8px; }
.pb-old s { color: var(--fg-3); font-size: 14px; }
.pb-now { display: flex; align-items: baseline; gap: 8px; }
.pb-now b { font-family: var(--f-display); font-size: 32px; font-weight: 900; line-height: 1.35; font-variant-numeric: tabular-nums; transition: color .3s; }
.pb-now small { font-size: 14px; color: var(--fg-2); font-weight: 700; }
.pb.isout .pb-now b { color: var(--fg-3); }
.pb-deal { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 10%, var(--ink-3)); font-size: 13px; color: var(--fg-2); }
.pb-deal .i { width: 16px; height: 16px; color: var(--accent-fg); }
.pb-deal span { margin-inline-start: auto; font-family: var(--f-tech); font-weight: 700; font-size: 15px; color: var(--fg); direction: ltr; }
.pb-inst, .pb-tot { font-size: 12.5px; color: var(--fg-3); }
.pb-inst b, .pb-tot b { color: var(--fg-2); }
.pb-row { display: flex; gap: 8px; align-items: stretch; }
.pb-row .btn { flex: 1; }
.pb-row .qty { padding: 4px; }
.pb-row .qty button { width: 36px; height: 40px; }
.pb-row2 { display: flex; gap: 8px; }
.pb-row2 .btn:first-child { flex: 1; }
.pb-row2 .btn:disabled { opacity: .45; cursor: not-allowed; }
.pb-wish { width: 50px; padding: 0 !important; }
.pb-wish.on { color: var(--bad-fg); }
.pb-wish.on .i { fill: currentColor; }
.pb-xp { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent-fg); font-weight: 700; }
.pb-xp .i { width: 16px; height: 16px; }
.pb-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.pb-sec > b { font-size: 13px; }
.ship { display: flex; flex-direction: column; gap: 6px; }
.sh { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--ink-3); cursor: pointer; text-align: right; transition: border-color .2s, background .2s; }
.sh:hover { border-color: var(--line-2); }
.sh[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--ink-3)); }
.sh .i { color: var(--fg-3); }
.sh[aria-checked="true"] .i { color: var(--accent-fg); }
.sh > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sh b { font-size: 13px; }
.sh small { font-size: 11.5px; color: var(--fg-3); }
.sh em { font-style: normal; font-size: 12px; color: var(--fg-2); font-weight: 700; white-space: nowrap; }
.pb-guar { flex-direction: row; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-2); }
.pb-guar .i { width: 18px; height: 18px; color: var(--ok-fg); }
.pb .set-row { padding: 2px 0 0; min-height: 0; }
.pd-mbar { display: none; }
@media (max-width: 1240px) {
  .pd { grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; }
  .hi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rv { grid-template-columns: minmax(0, 1fr); }
  .rv-sum { position: static; }
}
@media (max-width: 980px) {
  .pd { grid-template-columns: minmax(0, 1fr); }
  .pd-head + .pd { margin-top: -30px; }
  .pd-buy { position: static; }
  .pd-stage { height: 340px; }
  .pd-obj { inset: 10% 18% 8%; }
  .pd-thumbs { gap: 8px; }
  .pd-mbar { display: flex; position: sticky; bottom: 0; z-index: 8; align-items: center; justify-content: space-between; gap: 12px; margin-inline: -16px; margin-top: -40px; padding: 10px 16px; background: color-mix(in srgb, var(--ink-2) 94%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .pd-mbar b { font-size: 17px; font-weight: 800; }
  .pd-mbar s { display: block; font-size: 12px; color: var(--fg-3); }
  .pd-mbar .btn { min-height: 46px; }
}
@media (max-width: 620px) {
  .pd-thumbs .pt-cap { font-size: 9.5px; }
  .vg-cards { grid-template-columns: minmax(0, 1fr); }
  .bdl-i { width: calc(50% - 22px); }
  .sg dl { grid-template-columns: minmax(96px, 38%) minmax(0, 1fr); }
  .sg dt, .sg dd { padding: 11px 14px; }
}
@keyframes swapIn { from { opacity: 0; transform: scale(.82); filter: blur(10px); } }
@keyframes turn { 0%, 100% { transform: perspective(700px) rotateY(-32deg) rotateX(6deg); } 50% { transform: perspective(700px) rotateY(32deg) rotateX(-4deg); } }
@keyframes dotPulse { 0% { box-shadow: 0 0 0 0 currentColor; } 100% { box-shadow: 0 0 0 7px transparent; } }
.calm .pd-stage[data-v="4"] .pd-obj, .calm .pd-sweep, .calm .pb-stock i { animation: none !important; }

/* ================= v3 · forms ================= */
.form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label { font-size: 13px; font-weight: 700; color: var(--fg-2); }
.inp { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--ink-3); color: var(--fg); font: 500 15px/1.6 var(--f-body); outline: none; transition: border-color .2s, box-shadow .25s, background .2s; }
.inp::placeholder { color: var(--fg-3); opacity: .8; }
.inp:hover { border-color: var(--fg-3); }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.inp:disabled { opacity: .6; cursor: not-allowed; }
.inp[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 14%, transparent); }
textarea.inp { min-height: 104px; padding: 12px 14px; resize: vertical; }

@keyframes cpFloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
@keyframes cpGlow { 50% { opacity: .55; } }
@keyframes cpFlash { 40% { filter: brightness(1.8) drop-shadow(0 0 10px #fff); } }
.calm .cp-tilt, .calm .cp-light, .calm .sv-plane { animation: none !important; }

@media (max-width: 1240px) {

}

  .nw-grid.home { grid-template-columns: minmax(0, 1fr); }

}

  .uae-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cp-parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .ar-rev { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .ar-pc { grid-template-columns: minmax(0, 1fr); text-align: right; }

  .sv-tabs button { flex: none; }
  .nw-score { top: -44px; bottom: auto; left: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
}

/* ---------- v4 · light theme ---------- */
:root { --accent-fg: var(--accent); --ok-fg: var(--ok); --bad-fg: var(--bad); --shadow-pop: 0 40px 100px -20px rgba(0, 0, 0, .8); --scrim: rgba(3, 4, 7, .55); }
:root[data-theme="light"] {
  color-scheme: light;
  --ink-0: #E3E7EE; --ink-1: #EDF0F5; --ink-2: #FFFFFF; --ink-3: #F4F6F9; --ink-4: #E8EBF1; --ink-5: #D2D8E2;
  --line: #DDE2EA; --line-2: #C8CFDB;
  --fg: #0D1017; --fg-2: #3E4555; --fg-3: #5F6778;
  --accent-fg: color-mix(in srgb, var(--accent) 50%, #000);
  --ok: #1E9A61; --ok-fg: #12764A; --bad: #E04A3B; --bad-fg: #BF3327;
  --series: #a86f00; --series-a: rgba(168, 111, 0, .13);
  --shadow-pop: 0 30px 70px -24px rgba(22, 30, 50, .3), 0 2px 10px rgba(22, 30, 50, .06);
  --scrim: rgba(26, 32, 46, .34); --tmix: 58%;
}
/* cover art keeps its dark stage, like a game cover on a light shelf */
:root[data-theme="light"] :is(.stage, .c-media, .m-stage, .b-stage, .qv-stage, .pd-stage, .pt, .mini, .t-mini, .nw-cv, .rm-cv, .cmp-art, .ct-s, .fly, .c-hero, .tile, .gcard, .pe-prev .c-media, .boot, .ar-hero, .lv-hero, .wl-hero, .club-hero, .w-hero) {
  --ink-1: #0A0C12; --ink-2: #0F121A; --ink-3: #151923; --ink-4: #1D2230; --ink-5: #283043; --line: #222837; --line-2: #323A4E;
  --fg: #F2F3F7; --fg-2: #B0B6C4; --fg-3: #8D94A5; --accent-fg: var(--accent); --ok-fg: #45C489; --bad-fg: #FF6B5A; --tmix: 100%; color: var(--fg);
}
:root[data-theme="light"] body { -webkit-font-smoothing: auto; }
:root[data-theme="light"] .card { background: var(--ink-2); box-shadow: 0 1px 2px rgba(22, 30, 50, .06); }
:root[data-theme="light"] .card:hover { box-shadow: 0 24px 50px -22px rgba(22, 30, 50, .35); }
:root[data-theme="light"] :is(.over, .drawer-over, .sheet-over, .adm.nav-open .adm-body::after) { background: var(--scrim); }
:root[data-theme="light"] :is(.pop-panel, .modal .m-panel, .pal, .drawer, .toast, .mega, .adm-sres, .lc-tip, .sheet) { box-shadow: var(--shadow-pop); }
:root[data-theme="light"] .drawer { box-shadow: 30px 0 80px -30px rgba(22, 30, 50, .3); }
:root[data-theme="light"] .top, :root[data-theme="light"] .status { background: color-mix(in srgb, var(--ink-2) 72%, transparent); }
:root[data-theme="light"] .adm::before { background-image: linear-gradient(rgba(20, 30, 60, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 30, 60, .04) 1px, transparent 1px); }
:root[data-theme="light"] .adm-side { background: color-mix(in srgb, var(--ink-2) 80%, transparent); }
:root[data-theme="light"] :is(.adm-card, .kpi) { background: var(--ink-2); box-shadow: 0 1px 2px rgba(22, 30, 50, .05); }
:root[data-theme="light"] .serp { border: 1px solid var(--line); }
:root[data-theme="light"] .at th { background: var(--ink-3); }
:root[data-theme="light"] .tog::after { box-shadow: 0 1px 3px rgba(22, 30, 50, .25); }
:root[data-theme="light"] kbd { background: var(--ink-2); }
:root[data-theme="light"] .btn.primary { box-shadow: 0 10px 26px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
:root[data-theme="light"] .chip[aria-pressed="true"] { color: var(--accent-ink); }
:root[data-theme="light"] .pill.go { background: color-mix(in srgb, var(--accent) 20%, transparent); }
:root[data-theme="light"] ::selection { color: var(--accent-ink); }
/* theme switch: circular reveal from the button */
html.vt-theme::view-transition-old(root), html.vt-theme::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.vt-theme::view-transition-new(root) { animation: themeReveal .75s cubic-bezier(.16, 1, .3, 1); }
@keyframes themeReveal { from { clip-path: circle(0 at var(--vt-x, 50%) var(--vt-y, 0)); } to { clip-path: circle(150vmax at var(--vt-x, 50%) var(--vt-y, 0)); } }
.th-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin: 2px 0 6px; border-radius: 14px; background: var(--ink-3); border: 1px solid var(--line); }
.th-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 700; cursor: pointer; transition: background .25s, color .25s; }
.th-seg button .i { width: 16px; height: 16px; }
.th-seg button:hover { color: var(--fg); }
.th-seg button[aria-checked="true"] { background: var(--ink-2); color: var(--fg); box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
.th-seg button[aria-checked="true"] .i { color: var(--accent-fg); }
.th-lbl { display: block; padding: 4px 4px 0; font-size: 13px; font-weight: 700; color: var(--fg); }
.th-lbl small { display: block; font-weight: 500; color: var(--fg-3); font-size: 12px; }
[data-action="theme"] .i { transition: transform .6s var(--spring); }
[data-action="theme"]:hover .i { transform: rotate(40deg); }
/* shortcuts sheet */
.keys h2 { margin: 4px 0; font-family: var(--f-display); }
.keys-g { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.keys-g section { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: var(--ink-3); border: 1px solid var(--line); }
.keys-g h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 15px; }
.keys-g h3 .i { color: var(--accent-fg); }
.keys-g h3 small { margin-inline-start: auto; padding: 2px 8px; border-radius: 8px; background: var(--ink-4); color: var(--fg-3); font-size: 11px; font-weight: 600; }
.keys-g h3 small.on { color: var(--ok-fg); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.kr { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 0 4px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--fg-2); }
.kr:last-child { border-bottom: 0; }
.kk { display: inline-flex; align-items: center; gap: 4px; direction: ltr; flex: none; }
.kk i { font-style: normal; color: var(--fg-3); font-size: 12px; }
.kk em { font-style: normal; color: var(--fg-3); font-size: 12px; margin: 0 4px; direction: rtl; }
.kk kbd { min-width: 28px; text-align: center; font-size: 12px; padding: 3px 7px; }
.gp { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--ink-5); color: #fff; font-family: var(--f-tech); font-size: 12px; font-weight: 700; font-style: normal; }
.gp.a { background: #2E9E55; } .gp.b { background: #D8443A; } .gp.x { background: #2F6FD6; } .gp.y { background: #C99A10; }
.gp.lb, .gp.st, .gp.ls, .gp.rs { border-radius: 7px; background: #3A4256; }
/* gamepad mode */
html.pad-on .pad-focus { outline: 3px solid var(--accent) !important; outline-offset: 3px; box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 34px color-mix(in srgb, var(--accent) 45%, transparent) !important; transition: outline-offset .2s var(--spring), box-shadow .3s; position: relative; z-index: 3; }
html.pad-on .card.pad-focus { transform: translateY(-6px) scale(1.03); }
.pad-hit { animation: padHit .22s var(--ease); }
@keyframes padHit { 50% { transform: scale(.95); } }
.pad-hint { position: fixed; z-index: 115; left: 50%; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); display: none; gap: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--ink-2) 92%, transparent); backdrop-filter: blur(16px); box-shadow: var(--shadow-pop); transform: translateX(-50%); font-size: 13px; color: var(--fg-2); white-space: nowrap; }
html.pad-on .pad-hint { display: flex; animation: rise .5s var(--ease); }
.pad-hint span { display: inline-flex; align-items: center; gap: 6px; }
@media (max-width: 560px) { .top .th-btn { display: none; } }
@media (max-width: 760px) {
  .keys-g { grid-template-columns: minmax(0, 1fr); }
  .pad-hint { gap: 10px; font-size: 12px; padding: 6px 12px; }
  .pad-hint span:nth-child(n+4) { display: none; }
}

/* keyframes */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes shad { 50% { transform: scaleX(.8); opacity: .2; } }

@keyframes enterRail { from { transform: translateX(100%); opacity: 0; } }
@keyframes enterTop { from { transform: translateY(-100%); opacity: 0; } }

    var on = !!(g.buttons[b] && g.buttons[b].pressed) || !!dirs[b];
    if (on && !padPrev[b]) { padPress(b); padRep[b] = now + 380; padShowHint(); }
    else if (on && b >= 12 && b <= 15 && now > (padRep[b] || 0)) { padPress(b); padRep[b] = now + 130; }
    padPrev[b] = on;
  }
  var ry = g.axes[3] || 0;
  if (Math.abs(ry) > .2) { var s = padScroller(); if (s) s.scrollTop += ry * 22; }
  padRaf = requestAnimationFrame(padLoop);
}
function padShowHint() {
  document.documentElement.classList.add('pad-on');

    document.body.appendChild(padHint);
  }
}

});
window.addEventListener('gamepaddisconnected', function (e) {

  padIdx = null; document.documentElement.classList.remove('pad-on'); $$('.pad-focus').forEach(function (x) { x.classList.remove('pad-focus'); });
  toast({ ic: 'pad', title: 'دسته‌ی بازی جدا شد', ms: 2400 });
});
['pointerdown', 'wheel'].forEach(function (ev) { window.addEventListener(ev, function () { if (document.documentElement.classList.contains('pad-on')) { document.documentElement.classList.remove('pad-on'); $$('.pad-focus').forEach(function (x) { x.classList.remove('pad-focus'); }); } }, { passive: true }); });
